<!-- =====================================================================
     JS · SERVICIO REPORTES  (tablas tipo hoja de cálculo · filtro de fechas · documento PDF/Excel)
     Lo usan K. Cierres y M. Inventario: una sola implementación para todos los informes.
     ===================================================================== -->
<script id="js-reportes">
(function () {
  'use strict';
  const { Util } = App;
  const n = (v) => (v || 0).toLocaleString('es-CO');
  const clave = (f) => f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0');
  const hora = (iso) => new Date(iso).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  const dia = (iso) => new Date(iso).toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });

  // Filtro de fechas reutilizable: botones rápidos + Desde/Hasta. alCambiar() se llama en cada cambio.
  function filtroFechas(alCambiar, inicial) {
    const hoy = new Date(), atras = (d) => { const f = new Date(); f.setDate(f.getDate() - d); return f; };
    const RAPIDOS = [['Hoy', hoy, hoy], ['Ayer', atras(1), atras(1)], ['7 días', atras(6), hoy], ['Este mes', new Date(hoy.getFullYear(), hoy.getMonth(), 1), hoy]];
    const ini = RAPIDOS.find(r => r[0] === inicial) || RAPIDOS[0];
    const inDesde = Util.el('input', { type: 'date', class: 'adm-input', 'aria-label': 'Desde', value: clave(ini[1]), onchange: () => { marcar(null); cambio(); } });
    const inHasta = Util.el('input', { type: 'date', class: 'adm-input', 'aria-label': 'Hasta', value: clave(ini[2]), onchange: () => { marcar(null); cambio(); } });
    const botones = RAPIDOS.map(([t, d, h]) => Util.el('button', { type: 'button', class: 'btn', text: t, onclick: () => { inDesde.value = clave(d); inHasta.value = clave(h); marcar(t); cambio(); } }));
    const marcar = (t) => botones.forEach(b => b.classList.toggle('activo', b.textContent === t));
    const cambio = () => { if (inDesde.value > inHasta.value) [inDesde.value, inHasta.value] = [inHasta.value, inDesde.value]; alCambiar(); };
    marcar(ini[0]);
    return {
      el: [Util.el('div', { class: 'k-filtro' }, botones),
        Util.el('div', { class: 'k-rango' }, Util.el('label', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: 'Desde' }), inDesde),
          Util.el('label', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: 'Hasta' }), inHasta))],
      desde: () => inDesde.value, hasta: () => inHasta.value,
      rango: () => [new Date(inDesde.value + 'T00:00:00').getTime() - 1, new Date(inHasta.value + 'T23:59:59.999').getTime()]
    };
  }

  // Tabla reutilizable (encabezados, filas, totales opcionales). col: { t: título, k: clave | fn, num }.
  function tabla(cols, filas, totales, alTocar) {
    const celda = (c, f) => {
      const v = typeof c.k === 'function' ? c.k(f) : f[c.k], txt = v == null || v === '' ? '—' : c.num && typeof v === 'number' ? n(v) : String(v);
      const url = c.link && c.link(f); // celda con enlace (ej. WhatsApp); el valor exportado sigue siendo el texto
      return url ? Util.el('td', null, Util.el('a', { href: url, target: '_blank', rel: 'noopener', text: txt, onclick: e => e.stopPropagation() }))
        : Util.el('td', { class: c.num ? 'num' : '', text: txt });
    };
    return Util.el('div', { class: 'hc' }, Util.el('table', null,
      Util.el('thead', null, Util.el('tr', null, cols.map(c => Util.el('th', { class: c.num ? 'num' : '', text: c.t })))),
      Util.el('tbody', null, filas.map(f => Util.el('tr', { class: (alTocar ? 'clic ' : '') + (f.tipo || ''), onclick: alTocar ? () => alTocar(f) : null }, cols.map(c => celda(c, f))))),
      totales ? Util.el('tfoot', null, Util.el('tr', null, cols.map(c => celda(c, totales)))) : null));
  }
  const pintarBloques = (grupos) => grupos.flatMap(b => [Util.el('p', { class: 'caja-grupo__tit', text: b.sub }),
    b.filas.length ? tabla(b.cols, b.filas, b.totales, b.alTocar) : Util.el('p', { class: 'adm-nota', text: 'Sin datos.' }),
    b.nota ? Util.el('p', { class: 'adm-nota', text: b.nota }) : null]).filter(Boolean);

  // Archivo para Excel / Google Sheets (CSV con ";" y acentos correctos). Varios bloques separados por una línea vacía.
  function descargar(nombre, grupos) {
    const esc = (v) => { const s = v == null ? '' : String(v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const val = (c, f) => typeof c.k === 'function' ? c.k(f) : f[c.k];
    const lineas = grupos.flatMap(({ sub, cols, filas, totales, nota }, i) => [
      ...(i ? [''] : []), esc(sub), cols.map(c => esc(c.t)).join(';'),
      ...filas.map(f => cols.map(c => esc(val(c, f))).join(';')),
      ...(totales ? [cols.map(c => esc(val(c, totales))).join(';')] : []), ...(nota ? [esc(nota)] : [])]);
    bajar(nombre, new Blob(['﻿' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  }
  function bajar(nombre, blob) {
    const a = Util.el('a', { href: URL.createObjectURL(blob), download: nombre });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  // Datos en JSON legible (para respaldos o llevar a otra herramienta).
  function descargarJson(nombre, datos) { bajar(nombre, new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' })); }

  // Vista previa del documento: el mismo bloque se ve en pantalla y se imprime como PDF. El Excel lleva los mismos bloques.
  async function documento({ titulo, meta, grupos, archivo }) {
    const M = App.servicio('marca'), logo = await M.logoUrl(), nombre = await M.nombre();
    const hojaDoc = () => Util.el('div', { class: 'doc__hoja' },
      Util.el('div', { class: 'doc__cab' }, logo ? Util.el('img', { src: logo, alt: '' }) : null, Util.el('span', { class: 'doc__negocio', text: nombre })),
      Util.el('div', null, Util.el('div', { class: 'doc__titulo', text: titulo }), Util.el('div', { class: 'doc__meta', text: meta })),
      ...grupos.flatMap(b => [Util.el('div', { class: 'doc__sub', text: b.sub }),
        b.filas.length ? tabla(b.cols, b.filas, b.totales) : Util.el('p', { class: 'adm-nota', text: 'Sin datos.' }),
        b.nota ? Util.el('p', { class: 'adm-nota', text: b.nota }) : null]));
    const tecla = (e) => { if (e.key === 'Escape') cerrar(); };
    const cerrar = () => { capa.remove(); barra.remove(); document.removeEventListener('keydown', tecla); };
    const capa = Util.el('div', { class: 'doc', role: 'dialog', 'aria-modal': 'true', 'aria-label': titulo }, hojaDoc());
    const barra = Util.el('div', { class: 'doc__barra' },
      Util.el('button', { type: 'button', class: 'btn btn--prim', text: '📄 PDF', onclick: () => {
        document.querySelectorAll('.impresion').forEach(x => x.remove()); // nunca duplicar
        const imp = Util.el('div', { class: 'impresion' }, hojaDoc());
        document.body.append(imp);
        const limpiar = () => { imp.remove(); window.removeEventListener('afterprint', limpiar); };
        window.addEventListener('afterprint', limpiar);
        window.print();
      } }),
      Util.el('button', { type: 'button', class: 'btn btn--prim', text: '📥 Excel', onclick: () => descargar(archivo, grupos) }),
      Util.el('button', { type: 'button', class: 'btn doc__cerrar', text: '✕ Cerrar', onclick: cerrar }));
    document.getElementById('slot-capas').append(capa, barra);
    document.addEventListener('keydown', tecla);
  }

  App.servicio('reportes', { n, clave, hora, dia, filtroFechas, tabla, pintarBloques, descargar, descargarJson, documento });
})();
</script>

<!-- =====================================================================
     JS · MÓDULO CARTERA  (créditos por cobrar · cancelados en espera · pérdidas)
     Se ve en la Caja (caja "Cartera") y en Autogestión (L). Las acciones las resuelve el servicio de pedidos.
     ===================================================================== -->
<script id="js-cartera">
(function () {
  'use strict';
  const { Util, Store } = App;
  const Ped = () => App.servicio('pedidos'), Cob = () => App.servicio('cobros');
  const fecha = (iso) => new Date(iso).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  // Listas de la cartera a partir del estado de pedidos y los pagos.
  function listas(est, pagados) {
    const perdida = (p) => p.cuenta && p.cuenta.tipo === 'perdida';
    return {
      credito: est.items.filter(p => p.estado === 'cerrado' && !pagados.has(p.id) && !perdida(p)),
      espera: est.items.filter(p => p.estado === 'cancelado' && !p.descartadoEn),
      perdidas: est.items.filter(p => p.estado !== 'cancelado' && !pagados.has(p.id) && perdida(p))
    };
  }

  // Pide motivo y nombre del asesor (para pasar a pérdida).
  async function pedirMotivo(p, alConfirmar) {
    const h = Util.hoja('⚫ Pasar a pérdida · ' + p.numero);
    const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
    const inObs = Util.el('textarea', { class: 'adm-input', rows: 3, maxlength: 160, placeholder: 'Ej: No volvió a pagar', id: 'cart-obs' });
    const inAsesor = Util.el('input', { type: 'text', class: 'adm-input', maxlength: 40, id: 'cart-asesor', value: (await Store.get('asesor', { nombre: '' })).nombre });
    h.cuerpo.append(
      Util.el('p', { class: 'ped__cliente', text: '👤 ' + p.nombre + ' · ' + Util.precio(p.total) }),
      Util.el('div', { class: 'adm-campo' }, Util.el('label', { class: 'adm-etq', for: 'cart-obs', text: 'Motivo *' }), inObs),
      Util.el('div', { class: 'adm-campo' }, Util.el('label', { class: 'adm-etq', for: 'cart-asesor', text: 'Tu nombre (asesor) *' }), inAsesor),
      msg,
      Util.el('div', { class: 'adm-acciones' },
        Util.el('button', { type: 'button', class: 'btn', text: 'Cancelar', onclick: () => h.cerrar() }),
        Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Pasar a pérdida', onclick: async () => {
          try {
            await Store.set('asesor', { nombre: Util.limpiarTexto(inAsesor.value, 40) });
            await alConfirmar(inObs.value, inAsesor.value); h.cerrar();
          } catch (e) { Util.mensaje(msg, '⚠️ ' + e.message, 'error'); }
        } })));
  }

  // Pinta la cartera dentro de un contenedor y se mantiene al día sola.
  async function montar(zona) {
    // Los avisos van en toast: la cartera se repinta al cambiar los datos y el mensaje no debe perderse.
    const aviso = (t) => Util.toast(t, true);
    const accion = async (fn, ok) => { try { await fn(); aviso(ok, 'ok'); } catch (e) { aviso('⚠️ ' + e.message, 'error'); } };
    const lista = Util.el('div', { class: 'adm-campo' });
    async function pintar() {
      const est = await Ped().estado(), pagados = Cob() ? await Cob().pagados() : new Map();
      const L = listas(est, pagados), suma = (l) => l.reduce((a, p) => a + p.total, 0);
      const tarjeta = (p, clase, botones) => Util.el('div', { class: 'ped ' + clase },
        Util.el('div', { class: 'ped__cab' }, Util.el('span', { class: 'ped__num', text: p.numero }), Util.el('span', { class: 'ped__meta', text: fecha(p.fecha) })),
        Util.el('span', { class: 'ped__cliente', text: '👤 ' + p.nombre + (p.whatsapp ? ' · ' + p.whatsapp : '') + (p.bandera ? ' · 🚩 #' + String(p.bandera).padStart(2, '0') : '') }),
        Util.el('div', { class: 'ped__lineas' }, p.lineas.map(l => Util.el('div', { class: 'ped__linea' }, Util.el('span', { text: l.cantidad + ' × ' + l.nombre }), Util.el('span', { text: Util.precio(l.valor * l.cantidad) })))),
        Util.el('div', { class: 'ped__total' }, Util.el('span', { text: 'Total' }), Util.el('span', { text: Util.precio(p.total) })),
        p.cuenta ? Util.el('span', { class: 'ped__meta', text: '📝 ' + p.cuenta.obs + ' · ' + p.cuenta.asesor + ' · ' + fecha(p.cuenta.fecha) }) : null,
        p.canceladoEn ? Util.el('span', { class: 'ped__meta', text: 'Cancelado ' + fecha(p.canceladoEn) }) : null,
        botones.length ? Util.el('div', { class: 'adm-acciones' }, botones) : null);
      const bloque = (titulo, l, vacio, hacer) => [Util.el('div', { class: 'cart-sub' }, Util.el('span', { text: titulo }), Util.el('span', { class: 'caja-cont', text: String(l.length) }),
        l.length ? Util.el('span', { class: 'ped__meta', text: Util.precio(suma(l)) }) : null),
        ...(l.length ? l.slice().reverse().map(hacer) : [Util.el('p', { class: 'adm-nota', text: vacio })])];
      lista.replaceChildren(
        ...bloque('🔴 Crédito por cobrar', L.credito, 'No hay créditos pendientes.', p => tarjeta(p, 'ped--cartera', [
          Cob() ? Util.el('button', { type: 'button', class: 'btn btn--prim', text: '💵 Cobrar', onclick: () => Cob().abrirCobro([p.id], 'Cobrar ' + p.numero) }) : null,
          Util.el('button', { type: 'button', class: 'btn', text: '⚫ Pasar a pérdida', onclick: () => pedirMotivo(p, async (o, a) => { await Ped().pasarAPerdida(p.id, o, a); aviso('⚫ ' + p.numero + ' quedó como pérdida.', 'ok'); }) })].filter(Boolean))),
        ...bloque('⏸️ Pedidos cancelados (sin entregar)', L.espera, 'No hay pedidos cancelados.', p => tarjeta(p, 'ped--espera', [
          Util.el('button', { type: 'button', class: 'btn btn--prim', text: '↩️ Reactivar', onclick: () => accion(() => Ped().reactivar(p.id), '↩️ ' + p.numero + ' volvió a la Caja.') }),
          Util.el('button', { type: 'button', class: 'btn btn--peligro', text: '🗑️ Descartar', onclick: async () => {
            if (await Util.confirmar('¿Descartar ' + p.numero + '?', 'Sale de la Caja y de la Cartera. Solo queda como línea informativa "Cancelado" en el libro de ventas.', 'Descartar', 'Volver'))
              accion(() => Ped().descartar(p.id), '🗑️ ' + p.numero + ' descartado.');
          } })])),
        ...bloque('⚫ Pérdidas', L.perdidas, 'No hay pérdidas registradas.', p => tarjeta(p, 'ped--perdida', [])));
    }
    zona.replaceChildren(lista);
    await pintar();
    Util.escuchar(zona, ['store:pedidos', 'store:cobros'], pintar);
  }

  App.servicio('cartera', {
    // Pendientes por resolver (lo que muestra el contador de la caja Cartera).
    contar(est, pagados) { const L = listas(est, pagados || new Map()); return L.credito.length + L.espera.length; },
    montar
  });

  App.modulo({
    id: 'cartera',
    letra: 'L',
    titulo: 'Cartera crédito',
    async admin(cuerpo) { await montar(cuerpo); }
  });
})();
</script>

<!-- =====================================================================
     JS · MÓDULO CIERRES  (autogestión: K. Cierres y cuadres)
     Cada cierre es una hoja de cálculo del periodo entre el cierre anterior y ese cierre:
     resumen compacto + una fila por producto vendido. Solo consulta: los cierres no se editan.
     ===================================================================== -->
<script id="js-cierres">
(function () {
  'use strict';
  const { Util } = App;
  const Ped = () => App.servicio('pedidos'), Cob = () => App.servicio('cobros'), Cat = () => App.servicio('catalogo');
  const { hora, dia, clave, tabla, pintarBloques, documento } = App.servicio('reportes');
  const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '—';

  /* ---------- Análisis de ventas de un periodo ----------
     Ventas = todo lo vendido no cancelado (contado, crédito y pérdidas). Costo = costo de esas ventas
     (costo congelado al vender; sin costo registrado cuenta como 0). Utilidad bruta = Ventas − Costo. */
  async function analizar(desde, hasta, cierre) {
    const datos = await Cob().datos(), est = await Ped().estado(), prods = await Cat().productos();
    const en = (iso) => { const t = new Date(iso).getTime(); return t > desde && t <= hasta; };
    const cobroDe = new Map(); datos.items.forEach(c => c.pedidoIds.forEach(id => cobroDe.set(id, c)));
    const costoProd = Object.fromEntries(prods.map(p => [p.id, Util.entero(p.costo)]));
    const medios = (c) => c.partes.map(x => x.medio).join(' + ');
    const obs = (p) => p.cuenta ? p.cuenta.obs + ' · ' + p.cuenta.asesor + ' · ' + dia(p.cuenta.fecha) + ' ' + hora(p.cuenta.fecha) : '';
    const dias = {}, vacio = () => ({ ventas: 0, costo: 0, pedidos: 0, perdidas: { n: 0, v: 0 }, credito: { n: 0, v: 0 }, canceladas: { n: 0, v: 0 } });
    const ventas = [];
    let sinCosto = 0;
    est.items.filter(p => en(p.fecha)).forEach(p => {
      const d = dias[clave(new Date(p.fecha))] = dias[clave(new Date(p.fecha))] || vacio();
      const c = cobroDe.get(p.id), canc = p.estado === 'cancelado', perdida = !c && p.cuenta && p.cuenta.tipo === 'perdida';
      // En el libro de un cierre, "Contado" es lo cobrado en ese cierre; por fecha, lo cobrado en cualquier momento.
      const pagado = c && (!cierre || c.cierre === cierre);
      const estado = canc ? 'Cancelado' : perdida ? 'Pérdida' : pagado ? (p.cuenta ? 'Crédito pagado' : 'Contado') : 'Por cobrar';
      const cobro = pagado ? medios(c) + ' · ' + c.numero + (p.cuenta ? ' (' + dia(c.fecha) + ')' : '') : c ? 'Pagado luego · ' + medios(c) + ' · ' + c.numero + ' (' + dia(c.fecha) + ')' : '';
      if (canc) { d.canceladas.n++; d.canceladas.v += p.total; }
      else {
        d.ventas += p.total; d.pedidos++;
        if (perdida) { d.perdidas.n++; d.perdidas.v += p.total; }
        else if (!pagado) { d.credito.n++; d.credito.v += p.total; }
      }
      ventas.push({ t: p.fecha, lineas: p.lineas.map(l => {
        const cu = 'costo' in l ? l.costo : costoProd[l.productoId] ?? null;
        if (!canc) { d.costo += (cu || 0) * l.cantidad; if (cu == null) sinCosto++; }
        return { fecha: dia(p.fecha), hora: hora(p.fecha), pedido: p.numero, cliente: p.nombre, wa: p.whatsapp || '', producto: l.nombre + (l.nota ? ' (' + l.nota + ')' : ''),
          cant: l.cantidad, valor: l.valor * l.cantidad, costo: cu != null ? cu * l.cantidad : null, estado, cobro, obs: obs(p),
          tipo: canc ? 'canc' : perdida || !pagado ? 'pend' : '' };
      }) });
    });
    // Cobros del periodo que pagan ventas de antes (créditos): entran al arqueo y como línea informativa.
    const cobros = datos.items.filter(c => cierre ? c.cierre === cierre : en(c.fecha));
    let anteriores = { n: 0, v: 0 };
    cobros.forEach(c => c.pedidoIds.forEach(id => {
      const p = est.items.find(x => x.id === id);
      if (!p || en(p.fecha)) return;
      anteriores.n++; anteriores.v += p.total;
      ventas.push({ t: c.fecha, lineas: [{ fecha: dia(c.fecha), hora: hora(c.fecha), pedido: p.numero, cliente: p.nombre, wa: p.whatsapp || '',
        producto: 'Pago de venta del ' + dia(p.fecha), cant: '', valor: p.total, costo: null, estado: 'Pago anterior', cobro: medios(c) + ' · ' + c.numero, obs: obs(p), tipo: 'ant' }] });
    }));
    ventas.sort((a, b) => new Date(a.t) - new Date(b.t));
    const porMedio = {};
    cobros.forEach(c => c.partes.forEach(x => { porMedio[x.medio] = (porMedio[x.medio] || 0) + x.valor; }));
    const tot = vacio();
    Object.values(dias).forEach(d => { tot.ventas += d.ventas; tot.costo += d.costo; tot.pedidos += d.pedidos;
      ['perdidas', 'credito', 'canceladas'].forEach(k => { tot[k].n += d[k].n; tot[k].v += d[k].v; }); });
    return { dias, tot, sinCosto, anteriores, cobrado: cobros.reduce((a, c) => a + c.total, 0), porMedio,
      lineas: ventas.flatMap((v, i) => v.lineas.map(l => Object.assign({ nro: i + 1 }, l))) };
  }

  // Bloques del informe (los mismos en pantalla, PDF y Excel).
  function bloques(A, conDetalle) {
    const C2 = [{ t: 'Concepto', k: 't' }, { t: 'Valor', k: 'v', num: true }];
    // Ventas − Costo = Utilidad bruta; − Cartera pérdida = Utilidad después de pérdidas. El crédito por cobrar es informativo.
    const ub = A.tot.ventas - A.tot.costo, cant = (x) => ' (' + x.n + ')';
    const resumen = [
      { t: 'Total ventas' + cant({ n: A.tot.pedidos }), v: A.tot.ventas }, { t: '− Total costo de ventas', v: A.tot.costo },
      { t: '= Utilidad bruta', v: ub, tipo: 'clave' }, { t: 'Margen bruto', v: pct(ub, A.tot.ventas) },
      { t: '− Cartera pérdida' + cant(A.tot.perdidas), v: A.tot.perdidas.v, tipo: A.tot.perdidas.n ? 'pend' : '' },
      { t: '= Utilidad después de pérdidas', v: ub - A.tot.perdidas.v, tipo: 'clave' },
      { t: 'Cartera crédito por cobrar' + cant(A.tot.credito) + ' · informativo', v: A.tot.credito.v, tipo: A.tot.credito.n ? 'pend' : '' }];
    const g = [{ sub: 'Resumen', cols: C2, filas: resumen, nota: A.sinCosto ? '⚠️ ' + A.sinCosto + ' producto' + (A.sinCosto === 1 ? '' : 's') + ' sin costo registrado: cuenta' + (A.sinCosto === 1 ? '' : 'n') + ' como $0.' : '' }];
    const claves = Object.keys(A.dias).sort();
    if (!conDetalle && claves.length) {
      const fila = (k, d) => ({ fecha: k === 'tot' ? 'Total del periodo' : new Date(k + 'T12:00:00').toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' }),
        ventas: d.ventas, costo: d.costo, util: d.ventas - d.costo, margen: pct(d.ventas - d.costo, d.ventas), perd: d.perdidas.v,
        neta: d.ventas - d.costo - d.perdidas.v, cred: d.credito.v });
      g.push({ sub: 'Consolidado por día', cols: [{ t: 'Fecha', k: 'fecha' }, { t: 'Ventas', k: 'ventas', num: true }, { t: 'Costo', k: 'costo', num: true },
        { t: 'Utilidad bruta', k: 'util', num: true }, { t: 'Margen', k: 'margen', num: true }, { t: 'Pérdidas', k: 'perd', num: true },
        { t: 'Después de pérdidas', k: 'neta', num: true }, { t: 'Crédito por cobrar', k: 'cred', num: true }],
        filas: claves.map(k => fila(k, A.dias[k])), totales: fila('tot', A.tot) });
    }
    if (conDetalle) g.push({ sub: 'Detalle de ventas (' + A.lineas.length + ' líneas)', cols: [
      { t: 'N.º', k: 'nro', num: true }, { t: 'Fecha', k: 'fecha' }, { t: 'Hora', k: 'hora' }, { t: 'Pedido', k: 'pedido' }, { t: 'Cliente', k: 'cliente' },
      { t: 'WhatsApp', k: 'wa' }, { t: 'Producto', k: 'producto' }, { t: 'Cant.', k: 'cant', num: true }, { t: 'Valor', k: 'valor', num: true },
      { t: 'Costo', k: 'costo', num: true }, { t: 'Estado', k: 'estado' }, { t: 'Medio · Cobro', k: 'cobro' }, { t: 'Observación', k: 'obs' }], filas: A.lineas });
    g.push({ sub: 'Arqueo de cobros', cols: C2, filas: [
      { t: 'Total cobrado', v: A.cobrado, tipo: 'clave' }, ...Object.entries(A.porMedio).map(([m, v]) => ({ t: '· ' + m, v })),
      ...(A.anteriores.n ? [{ t: '(incluye pagos de ventas anteriores: ' + A.anteriores.n + ')', v: A.anteriores.v }] : []),
      { t: 'Canceladas (' + A.tot.canceladas.n + ', no suman)', v: A.tot.canceladas.v, tipo: 'canc' }] });
    return g;
  }

  // Hoja de un cierre de caja (Z): su periodo es desde el cierre anterior hasta ese cierre.
  async function verCierre(z, todos) {
    const i = todos.findIndex(x => x.id === z.id), prev = i > 0 ? todos[i - 1] : null;
    const grupos = bloques(await analizar(prev ? new Date(prev.fecha).getTime() : 0, new Date(z.fecha).getTime(), z.numero), true);
    const h = Util.hoja('📒 ' + z.numero + ' · ' + new Date(z.fecha).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }));
    h.cuerpo.append(...pintarBloques(grupos),
      Util.el('button', { type: 'button', class: 'btn btn--prim', text: '👁️ Ver documento', onclick: () => documento({
        titulo: 'Cierre ' + z.numero, meta: new Date(z.fecha).toLocaleString('es-CO', { dateStyle: 'long', timeStyle: 'short' }),
        grupos, archivo: 'cierre-' + z.numero + '-' + clave(new Date(z.fecha)) + '.csv' }) }));
  }

  App.modulo({
    id: 'cierres',
    letra: 'K',
    titulo: 'Cierres y cuadres',
    async admin(cuerpo) {
      const filtro = App.servicio('reportes').filtroFechas(() => pintar(), 'Hoy');
      const inDesde = { get value() { return filtro.desde(); } }, inHasta = { get value() { return filtro.hasta(); } };
      const zona = Util.el('div', { class: 'adm-campo' });
      async function pintar() {
        const [desde, hasta] = filtro.rango();
        const unDia = inDesde.value === inHasta.value;
        const A = await analizar(desde, hasta, null), grupos = bloques(A, unDia);
        const titulo = unDia ? 'Informe del ' + new Date(inDesde.value + 'T12:00:00').toLocaleDateString('es-CO', { dateStyle: 'long' })
          : 'Informe del ' + new Date(inDesde.value + 'T12:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }) + ' al ' + new Date(inHasta.value + 'T12:00:00').toLocaleDateString('es-CO', { dateStyle: 'long' });
        // Cierres de caja (Z) del periodo: cada uno abre su hoja.
        const todos = (await Cob().datos()).cierres;
        const zs = todos.filter(z => { const k = clave(new Date(z.fecha)); return k >= inDesde.value && k <= inHasta.value; }).reverse();
        zona.replaceChildren(
          Util.el('p', { class: 'doc__titulo', text: titulo }),
          ...pintarBloques(grupos),
          Util.el('button', { type: 'button', class: 'btn btn--prim', text: '👁️ Ver documento', onclick: () => documento({
            titulo, meta: unDia ? 'Detalle de ventas' : 'Consolidado por día', grupos,
            archivo: 'informe-' + inDesde.value + (unDia ? '' : '_' + inHasta.value) + '.csv' }) }),
          Util.el('p', { class: 'caja-grupo__tit', text: 'Cierres de caja del periodo' }),
          zs.length ? tabla([{ t: 'Fecha', k: z => dia(z.fecha) + ' ' + hora(z.fecha) }, { t: 'Cierre', k: 'numero' }, { t: 'Cobros', k: 'cobros', num: true }, { t: 'Total', k: 'total', num: true }],
            zs, null, z => verCierre(z, todos)) : Util.el('p', { class: 'adm-nota', text: 'No hay cierres de caja en estas fechas.' }),
          Util.el('p', { class: 'adm-nota', text: 'Un día muestra el detalle venta por venta; varios días, el consolidado por día. Los cierres no se pueden editar ni borrar.' }));
      }
      cuerpo.append(...filtro.el, zona);
      await pintar();
      Util.escuchar(cuerpo, ['store:cobros', 'store:pedidos'], pintar);
    }
  });
})();
</script>

<!-- =====================================================================
     JS · MÓDULO INVENTARIO  (servicio de movimientos · autogestión: M. Inventario)
     Inventario en tiempo real (unidades, valor a costo, valor potencial a venta) y kardex de movimientos:
     entradas con costo promedio ponderado, salidas con motivo, ventas automáticas y ajustes manuales.
     ===================================================================== -->
<script id="js-inventario">
(function () {
  'use strict';
  const { Util, Store } = App;
  const Cat = () => App.servicio('catalogo');
  const MOD = 'inventario', DEF = { consecutivo: 0, movs: [] };
  const CLAVE = '7890'; // Control local por ahora; la seguridad real llega con servidor y usuarios.
  const MOTIVOS = { entrada: ['Compra', 'Reposición', 'Ajuste'], salida: ['Dañado', 'Vencido', 'Consumo interno', 'Ajuste'] };
  const TIPO = { entrada: 'Entrada', salida: 'Salida', venta: 'Venta', ajuste: 'Ajuste manual' };
  const ent = (v) => parseInt(v, 10) || 0;
  // Productos agrupados por categoría para Util.selector.
  const porCategoria = (cats, prods, extra) => cats.map(c => ({ titulo: c.nombre,
    items: prods.filter(p => p.categoriaId === c.id).map(p => ({ valor: p.id, texto: p.nombre, extra: extra ? extra(p) : '' })) })).filter(g => g.items.length);

  async function anotar(d, mov) {
    d.consecutivo += 1;
    d.movs.push(Object.assign({ id: 'm' + Date.now().toString(36) + d.consecutivo, numero: 'M-' + String(d.consecutivo).padStart(5, '0'), fecha: new Date().toISOString() }, mov));
  }

  const Inventario = {
    async datos() { return Store.get(MOD, DEF); },
    // Entrada o salida manual. Entrada con costo: costo promedio ponderado.
    async registrar({ productoId, tipo, cantidad, costo, motivo, obs, quien }) {
      const cant = ent(cantidad), o = Util.limpiarTexto(obs, 160), q = Util.limpiarTexto(quien, 40);
      if (!['entrada', 'salida'].includes(tipo)) throw new Error('Tipo de movimiento no válido.');
      if (!(cant > 0)) throw new Error('Escribe una cantidad mayor a 0.');
      if (!MOTIVOS[tipo].includes(motivo)) throw new Error('Elige el motivo.');
      if (tipo === 'salida' && !o) throw new Error('La salida necesita una observación.');
      if (!q) throw new Error('Escribe tu nombre.');
      const prods = (await Cat().productos()).slice(), p = prods.find(x => x.id === productoId);
      if (!p) throw new Error('Elige el producto.');
      const antes = ent(p.stock), costoAntes = Util.entero(p.costo);
      let costoDespues = costoAntes, costoUnit = costoAntes;
      if (tipo === 'entrada') {
        const c = Util.entero(costo);
        if (motivo === 'Compra' && !(c > 0)) throw new Error('Escribe el costo de compra por unidad.');
        if (c > 0) {
          costoUnit = c;
          // Promedio ponderado: (existencias × costo actual + entrada × costo nuevo) ÷ total.
          costoDespues = costoAntes == null || antes <= 0 ? c : Math.round((antes * costoAntes + cant * c) / (antes + cant));
          p.costo = costoDespues;
        }
        p.stock = antes + cant;
      } else {
        if (cant > antes) throw new Error('Solo hay ' + antes + ' unidades de ' + p.nombre + '.');
        p.stock = antes - cant;
      }
      await Cat().guardarProductos(prods);
      const d = await this.datos();
      await anotar(d, { productoId, nombre: p.nombre, tipo, motivo, cant: tipo === 'entrada' ? cant : -cant, costoUnit, costoAntes, costoDespues, saldo: p.stock, obs: o, quien: q });
      await Store.set(MOD, d);
      return { saldo: p.stock, costo: costoDespues };
    },
    // Venta despachada: descuenta el inventario y deja la salida en el kardex.
    async venta(pedido) {
      const prods = (await Cat().productos()).slice(), d = await this.datos();
      for (const l of pedido.lineas) {
        const p = prods.find(x => x.id === l.productoId);
        if (!p) continue;
        p.stock = Math.max(0, ent(p.stock) - l.cantidad);
        await anotar(d, { productoId: p.id, nombre: p.nombre, tipo: 'venta', motivo: 'Venta ' + pedido.numero, cant: -l.cantidad,
          costoUnit: 'costo' in l ? l.costo : Util.entero(p.costo), saldo: p.stock, obs: '', quien: '' });
      }
      await Cat().guardarProductos(prods);
      await Store.set(MOD, d);
    },
    // Cambio del inventario escrito a mano en E. Productos.
    async ajuste(p, antes, despues, quien) {
      if (antes === despues || (antes === null && !despues)) return;
      const d = await this.datos();
      await anotar(d, { productoId: p.id, nombre: p.nombre, tipo: 'ajuste', motivo: antes === null ? 'Inventario inicial' : 'Desde Productos',
        cant: despues - (antes || 0), costoUnit: Util.entero(p.costo), saldo: despues, obs: '', quien: quien || 'Administrador' });
      await Store.set(MOD, d);
    }
  };
  App.servicio('inventario', Inventario);

  /* ---------- Autogestión M ---------- */
  App.modulo({
    id: 'inventario',
    letra: 'M',
    titulo: 'Inventario entradas + salidas',
    async admin(cuerpo) {
      const R = App.servicio('reportes'), { tabla, pintarBloques, documento, dia, hora, clave } = R;
      let desbloqueado = false;

      /* 1. Inventario en tiempo real */
      const zonaInv = Util.el('div', { class: 'adm-campo' });
      async function bloquesInventario() {
        const cats = await Cat().categorias(), prods = await Cat().productos();
        const nomCat = Object.fromEntries(cats.map(c => [c.id, c.nombre])), orden = Object.fromEntries(cats.map((c, i) => [c.id, i]));
        let sinCosto = 0;
        const filas = prods.slice().sort((a, b) => ((orden[a.categoriaId] ?? 99) - (orden[b.categoriaId] ?? 99)) || a.nombre.localeCompare(b.nombre)).map(p => {
          const u = ent(p.stock), c = Util.entero(p.costo), v = ent(p.valor), min = ent(p.stockMin);
          if (c == null) sinCosto++;
          return { cat: nomCat[p.categoriaId] || '—', prod: p.nombre, u, costo: c, vCosto: u * (c || 0), precio: v, vVenta: u * v, util: u * (v - (c || 0)),
            estado: u <= 0 ? 'Agotado' : u <= min ? 'Bajo mínimo' : 'OK', tipo: u <= min ? 'pend' : '' };
        });
        const sum = (k) => filas.reduce((a, f) => a + f[k], 0);
        const C2 = [{ t: 'Concepto', k: 't' }, { t: 'Valor', k: 'v', num: true }];
        const agot = filas.filter(f => f.u <= 0).length, bajos = filas.filter(f => f.u > 0 && f.estado === 'Bajo mínimo').length;
        return [
          { sub: 'Resumen del inventario', cols: C2, filas: [
            { t: 'Productos', v: filas.length }, { t: 'Unidades en inventario', v: sum('u') },
            { t: 'Valor a costo', v: sum('vCosto'), tipo: 'clave' }, { t: 'Valor potencial a venta', v: sum('vVenta') },
            { t: 'Utilidad potencial', v: sum('util'), tipo: 'clave' },
            { t: 'Agotados', v: agot, tipo: agot ? 'pend' : '' }, { t: 'Bajo el mínimo', v: bajos, tipo: bajos ? 'pend' : '' }],
            nota: sinCosto ? '⚠️ ' + sinCosto + ' producto' + (sinCosto === 1 ? '' : 's') + ' sin costo registrado: su valor a costo cuenta como $0.' : '' },
          { sub: 'Inventario por producto', cols: [{ t: 'Categoría', k: 'cat' }, { t: 'Producto', k: 'prod' }, { t: 'Unidades', k: 'u', num: true },
            { t: 'Costo unit.', k: 'costo', num: true }, { t: 'Valor a costo', k: 'vCosto', num: true }, { t: 'Precio venta', k: 'precio', num: true },
            { t: 'Valor potencial venta', k: 'vVenta', num: true }, { t: 'Utilidad potencial', k: 'util', num: true }, { t: 'Estado', k: 'estado' }],
            filas, totales: { cat: 'Totales', prod: filas.length + ' productos', u: sum('u'), costo: '', vCosto: sum('vCosto'), precio: '', vVenta: sum('vVenta'), util: sum('util'), estado: '' } }];
      }
      async function pintarInv() {
        const g = await bloquesInventario(), ahora = new Date();
        zonaInv.replaceChildren(...pintarBloques(g),
          Util.el('button', { type: 'button', class: 'btn btn--prim', text: '👁️ Ver documento', onclick: () => documento({
            titulo: 'Inventario', meta: 'Corte al ' + ahora.toLocaleString('es-CO', { dateStyle: 'long', timeStyle: 'short' }), grupos: g,
            archivo: 'inventario-' + clave(ahora) + '.csv' }) }));
      }

      /* 2. Entradas y salidas (con clave) */
      const zonaMov = Util.el('div', { class: 'adm-campo' });
      async function pintarMov() {
        if (!desbloqueado) {
          const inClave = Util.el('input', { type: 'password', inputmode: 'numeric', maxlength: 4, class: 'adm-input', placeholder: '••••', 'aria-label': 'Clave de administrador' });
          const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
          const entrar = () => { if (inClave.value === CLAVE) { desbloqueado = true; pintarMov(); } else { Util.mensaje(msg, '⚠️ Clave incorrecta.', 'error'); inClave.value = ''; } };
          inClave.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

          return;
        }
        const cats = await Cat().categorias(), prods = await Cat().productos();
        let tipo = 'entrada';
        const selProd = Util.selector({ etiqueta: 'Producto', vacio: '— Elige producto —', alCambiar: () => vista(), buscar: true,

        const inCant = Util.el('input', { type: 'text', inputmode: 'numeric', class: 'adm-input', placeholder: 'Cantidad', oninput: e => { e.target.value = e.target.value.replace(/\D/g, ''); vista(); } });
        const inCosto = Util.el('input', { type: 'text', inputmode: 'numeric', class: 'adm-input', placeholder: 'Costo por unidad', oninput: e => { const v = Util.entero(e.target.value); e.target.value = v ? v.toLocaleString('es-CO') : ''; vista(); } });
        const selMotivo = Util.el('select', { class: 'adm-input adm-select', 'aria-label': 'Motivo' });
        const inObs = Util.el('textarea', { class: 'adm-input', rows: 2, maxlength: 160, placeholder: 'Observación' });
        const inQuien = Util.el('input', { type: 'text', class: 'adm-input', maxlength: 40, placeholder: 'Tu nombre', value: (await Store.get('asesor', { nombre: '' })).nombre });
        const previa = Util.el('p', { class: 'adm-nota' });
        const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
        const campoCosto = Util.el('div', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: 'Costo de compra por unidad' }), inCosto);
        const botones = ['entrada', 'salida'].map(t => Util.el('button', { type: 'button', class: 'btn', 'data-t': t, text: t === 'entrada' ? '➕ Entrada' : '➖ Salida', onclick: () => { tipo = t; modo(); } }));
        function modo() {
          botones.forEach(b => b.classList.toggle('btn--prim', b.dataset.t === tipo));
          selMotivo.replaceChildren(...MOTIVOS[tipo].map(m => Util.el('option', { value: m, text: m })));
          campoCosto.classList.toggle('oculto', tipo !== 'entrada');
          inObs.placeholder = tipo === 'salida' ? 'Observación (obligatoria): ej. se venció el lote' : 'Observación (opcional)';
          vista();
        }
        function vista() {
          const p = prods.find(x => x.id === selProd.value), cant = ent(inCant.value);
          if (!p || !cant) { previa.textContent = ''; return; }
          const u = ent(p.stock), c = Util.entero(p.costo), nc = Util.entero(inCosto.value);
          if (tipo === 'entrada') {
            const prom = nc > 0 ? (c == null || u <= 0 ? nc : Math.round((u * c + cant * nc) / (u + cant))) : c;
            previa.textContent = 'Quedará en ' + (u + cant) + ' und' + (nc > 0 ? ' · costo promedio ' + Util.precio(prom) + ' (antes ' + (c == null ? 'sin costo' : Util.precio(c)) + ')' : '');
          } else previa.textContent = cant > u ? '⚠️ Solo hay ' + u + ' und.' : 'Quedará en ' + (u - cant) + ' und · valor a costo de la salida ' + Util.precio(cant * (c || 0));
        }
        zonaMov.replaceChildren(
          Util.el('p', { class: 'caja-grupo__tit', text: '🔓 Entradas y salidas' }),
          Util.el('div', { class: 'adm-acciones' }, botones),
          Util.el('div', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: 'Producto' }), selProd.buscador, selProd),
          Util.el('div', { class: 'adm-grid2' }, Util.el('div', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: 'Cantidad' }), inCant),
            Util.el('div', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: 'Motivo' }), selMotivo)),
          campoCosto,
          Util.el('div', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: 'Observación' }), inObs),
          Util.el('div', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: 'Registrado por' }), inQuien),
          previa, msg,
          Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Registrar movimiento', onclick: async () => {
            try {
              await Store.set('asesor', { nombre: Util.limpiarTexto(inQuien.value, 40) });
              const r = await Inventario.registrar({ productoId: selProd.value, tipo, cantidad: inCant.value, costo: Util.entero(inCosto.value), motivo: selMotivo.value, obs: inObs.value, quien: inQuien.value });
              Util.toast('✅ ' + TIPO[tipo] + ' registrada · quedan ' + r.saldo + ' und' + (tipo === 'entrada' && r.costo != null ? ' · costo ' + Util.precio(r.costo) : ''), true);
            } catch (e) { Util.mensaje(msg, '⚠️ ' + e.message, 'error'); }
          } }));
        modo();
      }

      /* 3. Kardex: historial de movimientos */
      const filtro = R.filtroFechas(() => pintarKardex(), 'Este mes');
      let catsK = [], prodsK = [];
      const selFiltroProd = Util.selector({ etiqueta: 'Filtrar producto', vacio: 'Todos los productos', alCambiar: () => pintarKardex(),
        grupos: () => [{ titulo: null, items: [{ valor: '', texto: 'Todos los productos' }] }, ...porCategoria(catsK, prodsK)] });
      const zonaKardex = Util.el('div', { class: 'adm-campo' });
      async function pintarKardex() {
        const prods = await Cat().productos(), actual = selFiltroProd.value;
        catsK = await Cat().categorias(); prodsK = prods; selFiltroProd.value = actual;
        const [desde, hasta] = filtro.rango();
        const movs = (await Inventario.datos()).movs.filter(m => { const t = new Date(m.fecha).getTime(); return t > desde && t <= hasta && (!actual || m.productoId === actual); });
        // 'clase' colorea la fila (salidas en rojo); 'mov' es el texto del tipo de movimiento.
        const filas = movs.map(m => ({ fecha: dia(m.fecha), hora: hora(m.fecha), numero: m.numero, prod: m.nombre, mov: TIPO[m.tipo], motivo: m.motivo, cant: m.cant,
          costo: m.costoUnit, valor: m.costoUnit != null ? Math.abs(m.cant) * m.costoUnit : null, saldo: m.saldo, obs: m.obs || (m.tipo === 'entrada' && m.costoDespues != null && m.costoDespues !== m.costoAntes ? 'Costo ' + Util.precio(m.costoAntes || 0) + ' → ' + Util.precio(m.costoDespues) : ''),
          quien: m.quien, tipo: m.tipo === 'salida' ? 'pend' : '' }));
        const suma = (f) => movs.filter(f).reduce((a, m) => a + Math.abs(m.cant) * (m.costoUnit || 0), 0), und = (f) => movs.filter(f).reduce((a, m) => a + Math.abs(m.cant), 0);
        const merma = m => m.tipo === 'salida' && ['Dañado', 'Vencido'].includes(m.motivo);
        const g = [
          { sub: 'Resumen de movimientos', cols: [{ t: 'Concepto', k: 't' }, { t: 'Unidades', k: 'u', num: true }, { t: 'Valor a costo', k: 'v', num: true }], filas: [
            { t: 'Entradas', u: und(m => m.tipo === 'entrada'), v: suma(m => m.tipo === 'entrada') },
            { t: 'Ventas', u: und(m => m.tipo === 'venta'), v: suma(m => m.tipo === 'venta') },
            { t: 'Salidas por daño o vencimiento', u: und(merma), v: suma(merma), tipo: und(merma) ? 'pend' : '' },
            { t: 'Otras salidas (consumo, ajuste)', u: und(m => m.tipo === 'salida' && !merma(m)), v: suma(m => m.tipo === 'salida' && !merma(m)) },
            { t: 'Ajustes manuales (neto)', u: movs.filter(m => m.tipo === 'ajuste').reduce((a, m) => a + m.cant, 0), v: '' }] },
          { sub: 'Kardex (' + movs.length + ' movimientos)', cols: [{ t: 'Fecha', k: 'fecha' }, { t: 'Hora', k: 'hora' }, { t: 'N.º', k: 'numero' }, { t: 'Producto', k: 'prod' },
            { t: 'Tipo', k: 'mov' }, { t: 'Motivo', k: 'motivo' }, { t: 'Cantidad', k: 'cant', num: true }, { t: 'Costo unit.', k: 'costo', num: true },
            { t: 'Valor a costo', k: 'valor', num: true }, { t: 'Saldo', k: 'saldo', num: true }, { t: 'Observación', k: 'obs' }, { t: 'Quién', k: 'quien' }],
            filas }];
        zonaKardex.replaceChildren(...pintarBloques(g),
          Util.el('button', { type: 'button', class: 'btn', text: '👁️ Ver documento', onclick: () => documento({
            titulo: 'Kardex de inventario', meta: filtro.desde() + ' a ' + filtro.hasta() + (actual ? ' · ' + (prods.find(p => p.id === actual) || {}).nombre : ''),
            grupos: g, archivo: 'kardex-' + filtro.desde() + '_' + filtro.hasta() + '.csv' }) }));
      }

      cuerpo.append(zonaInv, zonaMov,
        Util.el('p', { class: 'caja-grupo__tit', text: 'Historial de movimientos (kardex)' }), ...filtro.el,
        Util.el('div', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: 'Producto' }), selFiltroProd), zonaKardex);
      await pintarInv(); await pintarMov(); await pintarKardex();
      Util.escuchar(cuerpo, ['store:productos', 'store:pedidos', 'store:categorias'], pintarInv);
      Util.escuchar(cuerpo, ['store:' + MOD], () => { pintarInv(); pintarKardex(); if (desbloqueado) pintarMov(); });
    }
  });
})();
</script>

<!-- =====================================================================
     JS · MÓDULO CLIENTES  (N. Trazabilidad: cada venta amarrada a nombre y WhatsApp)
     ===================================================================== -->
<script id="js-clientes">
(function () {
  'use strict';
  const { Util } = App;
  const ENTREGADOS = ['despachado', 'cerrado']; // solo ventas entregadas; las canceladas no cuentan
  const norm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const linkWa = (wa) => { const num = Util.numeroWa(wa); return num ? 'https://wa.me/' + num : null; };

  // Clientes leídos de los pedidos (fuente única). Clave: WhatsApp; si el pedido no lo trae, el de su misma
  // bandera (mismo ciclo); si no hay ninguno, el nombre (📵).
  async function clientes(desde, hasta) {
    const items = (await App.servicio('pedidos').estado()).items;
    const waCiclo = {};
    items.forEach(p => { if (p.ciclo && p.whatsapp && !waCiclo[p.ciclo]) waCiclo[p.ciclo] = p.whatsapp; });
    const mapa = {};
    items.filter(p => ENTREGADOS.includes(p.estado)).forEach(p => {
      const t = new Date(p.fecha).getTime();
      if (t <= desde || t > hasta) return;
      const wa = String(p.whatsapp || waCiclo[p.ciclo] || '').replace(/\D/g, '');
      const k = wa ? 'w' + wa : 'n' + norm(p.nombre);
      const c = mapa[k] = mapa[k] || { nombre: p.nombre, whatsapp: wa, compras: [], total: 0 };
      c.compras.push(p); c.total += p.total;
      if (new Date(p.fecha) >= new Date(c.compras[0].fecha)) c.nombre = p.nombre; // el nombre más reciente
    });
    return Object.values(mapa).map(c => {
      c.compras.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
      return Object.assign(c, { primera: c.compras[0].fecha, ultima: c.compras[c.compras.length - 1].fecha });
    }).sort((a, b) => (b.compras.length - a.compras.length) || (b.total - a.total) || new Date(b.ultima) - new Date(a.ultima));
  }

  App.modulo({
    id: 'clientes',
    letra: 'N',
    titulo: 'Clientes trazabilidad',
    async admin(cuerpo) {
      const R = App.servicio('reportes'), { pintarBloques, tabla, documento, descargarJson, dia, hora } = R;
      const detalle = (p) => p.lineas.map(l => l.cantidad + ' × ' + l.nombre + (l.nota ? ' (' + l.nota + ')' : '')).join(', ');
      const filtro = R.filtroFechas(() => pintar(), 'Este mes');
      const inBus = Util.el('input', { type: 'search', class: 'adm-input', placeholder: '🔍 Buscar por nombre o WhatsApp', 'aria-label': 'Buscar cliente', autocomplete: 'off', oninput: () => pintar() });
      const zona = Util.el('div', { class: 'adm-campo' });
      const colsCli = [{ t: 'Cliente', k: 'nombre' }, { t: 'WhatsApp', k: f => f.whatsapp || '📵 Sin WhatsApp', link: f => linkWa(f.whatsapp) },
        { t: 'Compras', k: 'n', num: true }, { t: 'Total comprado', k: 'total', num: true }, { t: 'Primera compra', k: 'prim' }, { t: 'Última compra', k: 'ult' }];
      const colsHist = [{ t: 'Fecha', k: 'fecha' }, { t: 'Hora', k: 'hora' }, { t: 'Pedido', k: 'numero' }, { t: 'Detalle', k: 'detalle' }, { t: 'Total', k: 'total', num: true }];
      const filaHist = (p, c) => ({ cliente: c ? c.nombre : '', whatsapp: c ? c.whatsapp : '', fecha: dia(p.fecha), hora: hora(p.fecha), numero: p.numero, detalle: detalle(p), total: p.total });

      function verCliente(c) {
        const h = Util.hoja('👤 ' + c.nombre);
        const wa = linkWa(c.whatsapp);
        h.cuerpo.append(
          wa ? Util.el('a', { class: 'btn btn--prim', href: wa, target: '_blank', rel: 'noopener', style: 'text-align:center;text-decoration:none', text: '💬 Abrir WhatsApp · ' + c.whatsapp })
            : Util.el('p', { class: 'ped__sinwa', text: '📵 Este cliente no dejó WhatsApp' }),
          Util.el('p', { class: 'adm-nota', text: c.compras.length + ' compra' + (c.compras.length === 1 ? '' : 's') + ' · total ' + Util.precio(c.total) + ' · cliente desde ' + dia(c.primera) }),
          tabla(colsHist, c.compras.slice().reverse().map(p => filaHist(p)), { fecha: 'Total', hora: '', numero: '', detalle: '', total: c.total }));
      }

      async function pintar() {
        const [desde, hasta] = filtro.rango(), q = norm(inBus.value), qn = q.replace(/\D/g, '');
        const todos = await clientes(desde, hasta);
        const lista = q ? todos.filter(c => norm(c.nombre).includes(q) || (qn && c.whatsapp.includes(qn))) : todos;
        const filas = lista.map(c => ({ c, nombre: c.nombre, whatsapp: c.whatsapp, n: c.compras.length, total: c.total, prim: dia(c.primera), ult: dia(c.ultima), tipo: c.compras.length > 1 ? 'clave' : '' }));
        const sum = (f) => lista.reduce((a, c) => a + f(c), 0);
        const g = [
          { sub: 'Resumen', cols: [{ t: 'Concepto', k: 't' }, { t: 'Valor', k: 'v', num: true }], filas: [
            { t: 'Clientes', v: lista.length }, { t: 'Con WhatsApp', v: lista.filter(c => c.whatsapp).length },
            { t: 'Recurrentes (2 o más compras)', v: lista.filter(c => c.compras.length > 1).length, tipo: 'clave' },

<!-- =====================================================================
     JS · MÓDULO AUTOGESTIÓN  (panel que agrupa A, B, C… de cada módulo)
     ===================================================================== -->
<script id="js-admin">
(function () {
  'use strict';
  const { Util, Bus, Store, CONFIG } = App;
  let panel = null;

  // Títulos de las secciones: cada módulo trae el suyo por defecto y el dueño lo puede cambiar (✏️).
  // Se guardan en un solo lugar; vacío = vuelve al título por defecto. La letra y el orden no cambian.
  const TITULOS = 'admin-titulos', TITULO_MAX = 50;
  const titulos = () => Store.get(TITULOS, {});
  // Orden de los bloques: lo decide el dueño (↕️ Ordenar). Solo es visual; las letras se asignan por posición (A, B, C…).
  const ORDEN = 'admin-orden';
  const letraDe = (i) => String.fromCharCode(65 + i);

  function seccion(m, propios) {
    const cuerpo = Util.el('div', { class: 'adm-sec__cuerpo oculto' });
    const sec = Util.el('div', { class: 'adm-sec', 'data-admin': m.id });
    const nombre = Util.el('span', { class: 'adm-sec__nombre', text: propios[m.id] || m.titulo });
    let cargado = false;
    const btn = Util.el('button', {
      type: 'button', class: 'adm-sec__btn', 'aria-expanded': 'false',
      onclick: async () => {
        const abrir = cuerpo.classList.contains('oculto');
        cuerpo.classList.toggle('oculto', !abrir);
        sec.classList.toggle('abierta', abrir);
        btn.setAttribute('aria-expanded', String(abrir));
        if (abrir && !cargado) { cargado = true; await m.admin(cuerpo); }
      }
    },
      Util.el('span', { class: 'adm-sec__letra' }),
      nombre,
      Util.el('span', { class: 'adm-sec__flecha', 'aria-hidden': 'true', text: '›' })
    );
    // Edición del título en el mismo lugar.
    const input = Util.el('input', { type: 'text', class: 'adm-input', maxlength: TITULO_MAX, 'aria-label': 'Título de la sección' });
    const edicion = Util.el('div', { class: 'adm-fila adm-sec__editar oculto' }, input,
      Util.el('button', { type: 'button', class: 'btn', text: 'Cancelar', onclick: () => edicion.classList.add('oculto') }),
      Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar', onclick: async () => {
        const t = await titulos(), v = Util.limpiarTexto(input.value, TITULO_MAX);
        if (v && v !== m.titulo) t[m.id] = v; else delete t[m.id];
        await Store.set(TITULOS, t);
        nombre.textContent = t[m.id] || m.titulo;
        edicion.classList.add('oculto');
      } }));
    const lapiz = Util.el('button', { type: 'button', class: 'adm-sec__lapiz', 'aria-label': 'Cambiar título', text: '✏️',
      onclick: async () => {
        if (!edicion.classList.contains('oculto')) { edicion.classList.add('oculto'); return; } // abierta: se cierra sin preguntar
        if (!await Util.confirmar('¿Seguro quieres cambiar el título del bloque ' + sec.dataset.letra + ' · ' + nombre.textContent + '?', '', 'Sí', 'No')) return;
        input.value = nombre.textContent; edicion.classList.remove('oculto'); input.focus();
      } });
    // Flechas para ordenar (visibles solo en modo "↕️ Ordenar bloques").
    const mover = (dir) => Util.el('button', { type: 'button', class: 'adm-mini adm-sec__mover', 'aria-label': dir < 0 ? 'Subir bloque' : 'Bajar bloque', text: dir < 0 ? '↑' : '↓', onclick: () => moverBloque(sec, dir) });
    sec.append(Util.el('div', { class: 'adm-sec__cab' }, mover(-1), mover(1), btn, lapiz), edicion, cuerpo);
    return sec;
  }

  // Letras por posición y flechas habilitadas según el puesto.
  function rotular(lista) {
    const secs = [...lista.children];
    secs.forEach((sec, i) => {
      sec.dataset.letra = letraDe(i);
      sec.querySelector('.adm-sec__letra').textContent = letraDe(i);
      const [arriba, abajo] = sec.querySelectorAll('.adm-sec__mover');
      arriba.disabled = i === 0; abajo.disabled = i === secs.length - 1;
    });
  }
  async function moverBloque(sec, dir) {
    const lista = sec.parentNode, otro = dir < 0 ? sec.previousElementSibling : sec.nextElementSibling;
    if (!otro) return;
    if (dir < 0) lista.insertBefore(sec, otro); else lista.insertBefore(otro, sec);
    rotular(lista);
    await Store.set(ORDEN, [...lista.children].map(x => x.dataset.admin));
  }

  async function abrir() {
    if (panel) return;
    panel = true; // reservado mientras se leen los títulos (evita abrir dos veces)
    const propios = await titulos(), orden = await Store.get(ORDEN, []);
    // Orden guardado por el dueño; los bloques que no estén en él (nuevos) van al final en su orden de fábrica.
    const puesto = (m) => { const i = orden.indexOf(m.id); return i < 0 ? 1000 : i; };
    const secciones = App.lista()
      .filter(m => typeof m.admin === 'function' && m.letra)
      .sort((a, b) => (puesto(a) - puesto(b)) || a.letra.localeCompare(b.letra))
      .map(m => seccion(m, propios));
    const lista = Util.el('div', { class: 'adm-bloques' }, secciones);
    rotular(lista);
    const btnOrdenar = Util.el('button', { type: 'button', class: 'btn adm-ordenar', text: '↕️ Ordenar bloques', onclick: () => {
      const on = lista.classList.toggle('adm-bloques--ordenar');
      btnOrdenar.textContent = on ? '✅ Listo' : '↕️ Ordenar bloques';
      btnOrdenar.classList.toggle('btn--prim', on);
    } });
    panel = Util.hoja('⚙️ Autogestión', () => { panel = null; Util.quitarAvisosInternos(); });
    panel.cuerpo.append(btnOrdenar, lista,
      Util.el('p', { class: 'adm-version', text: [CONFIG.version, CONFIG.peso].filter(Boolean).join(' · ') }));
  }

  Bus.on('admin:abrir', abrir);
})();
</script>

<!-- =====================================================================
     JS · MÓDULO HORARIO  (servicio abierto/cerrado · aviso al cliente · autogestión: J. Horario)
     Fuera de horario la carta queda en modo vitrina: se ve todo, pero no se puede pedir.
     ===================================================================== -->
<script id="js-horario">
(function () {
  'use strict';
  const { Util, Store, Bus } = App;
  const MOD = 'horario';
  const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const ORDEN = [1, 2, 3, 4, 5, 6, 0]; // lunes primero en la autogestión
  const DEF = { activo: false, dias: Object.fromEntries([0, 1, 2, 3, 4, 5, 6].map(d => [d, { abierto: true, abre: '07:00', cierra: '21:00' }])), especiales: [] };
  const min = (hhmm) => { const [h, m] = String(hhmm).split(':').map(Number); return h * 60 + m; };
  const clave = (f) => f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0');
  const dia = (f, k) => { const d = new Date(f); d.setDate(d.getDate() + k); return d; };
  const horaTxt = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' }); };
  const fechaTxt = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' });

  // Regla de un día: la fecha especial manda sobre el día de la semana. Si cierra ≤ abre, el horario pasa la medianoche.
  function regla(conf, f) {
    const e = conf.especiales.find(x => x.fecha === clave(f));
    return e || conf.dias[f.getDay()];
  }
  function abiertoEn(conf, f) {
    if (!conf.activo) return true;
    const t = f.getHours() * 60 + f.getMinutes();
    const r = regla(conf, f), ayer = regla(conf, dia(f, -1));
    if (r.abierto) {
      const a = min(r.abre), c = min(r.cierra);
      if (a < c ? (t >= a && t < c) : t >= a) return true;
    }
    return !!(ayer.abierto && min(ayer.cierra) <= min(ayer.abre) && t < min(ayer.cierra));
  }
  function proxima(conf, f) {
    const t = f.getHours() * 60 + f.getMinutes();
    for (let k = 0; k <= 14; k++) {
      const d = dia(f, k), r = regla(conf, d);
      if (r.abierto && (k > 0 || min(r.abre) > t)) return { k, d, abre: r.abre };
    }
    return null;
  }

  const Horario = {
    async config() { return Store.get(MOD, DEF); },
    async abierto(f) { return abiertoEn(await this.config(), f || new Date()); },
    async textoCerrado(f) {
      const ahora = f || new Date(), p = proxima(await this.config(), ahora);
      if (!p) return '🔒 Cerrados por ahora';
      const cuando = p.k === 0 ? 'hoy' : p.k === 1 ? 'mañana' : 'el ' + DIAS[p.d.getDay()].toLowerCase();
      return '🔒 Cerrados · Abrimos ' + cuando + ' a las ' + horaTxt(p.abre);
    }
  };
  App.servicio('horario', Horario);

  // Avisa a la app solo cuando cambia de abierto a cerrado (o al revés), revisando cada 30 s.
  let ultimo = null;
  async function revisar() {
    const ahora = await Horario.abierto();
    if (ultimo !== null && ahora !== ultimo) Bus.emit('horario:cambio', ahora);
    ultimo = ahora;
  }
  revisar(); setInterval(revisar, 30000);
  Bus.on('store:' + MOD, () => { ultimo = null; revisar().then(() => Bus.emit('horario:cambio')); });

  App.modulo({
    id: MOD,
    slot: 'app-main',
    orden: 12,
    letra: 'J',
    titulo: 'Horarios asignación',

    async montar(raiz) {
      raiz.className = 'horario oculto';
      const aviso = Util.el('p', { class: 'horario__aviso', role: 'status' });
      raiz.append(aviso);
      async function pintar() {
        const abierto = await Horario.abierto();
        raiz.classList.toggle('oculto', abierto);
        if (!abierto) aviso.textContent = await Horario.textoCerrado();
      }
      await pintar();
      Bus.on('horario:cambio', pintar);
      setInterval(pintar, 60000); // el "Abrimos…" se mantiene al día
    },

    async admin(cuerpo) {
      const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
      const aviso = (t, tipo) => Util.mensaje(msg, t, tipo);
      const conf = await Horario.config();
      const guardar = async (cambio, ok) => { const c = await Horario.config(); if (cambio(c) === false) return; await Store.set(MOD, c); aviso(ok, 'ok'); };

      const swActivo = Util.el('input', { type: 'checkbox', checked: conf.activo,
        onchange: e => guardar(c => { c.activo = e.target.checked; }, e.target.checked ? '✅ Horario activado: fuera de horario no se reciben pedidos.' : 'Horario desactivado: siempre abierto.') });

      // Semana: un renglón por día (Abierto + abre / cierra) y un solo Guardar.
      const filas = ORDEN.map(d => {
        const r = conf.dias[d];
        const sw = Util.el('input', { type: 'checkbox', checked: r.abierto, onchange: () => horas.classList.toggle('oculto', !sw.checked) });
        const abre = Util.el('input', { type: 'time', class: 'adm-input', value: r.abre, 'aria-label': 'Abre ' + DIAS[d] });
        const cierra = Util.el('input', { type: 'time', class: 'adm-input', value: r.cierra, 'aria-label': 'Cierra ' + DIAS[d] });
        const horas = Util.el('div', { class: 'hor-dia__horas' + (r.abierto ? '' : ' oculto') }, abre, Util.el('span', { text: 'a' }), cierra);
        return { d, sw, abre, cierra, el: Util.el('div', { class: 'hor-dia', 'data-dia': d },
          Util.el('strong', { text: DIAS[d] }), Util.el('label', { class: 'adm-switch' }, sw, Util.el('span', { text: 'Abierto' })), horas) };
      });

      // Fechas especiales (festivos): cerrado todo el día u horario propio.
      const inFecha = Util.el('input', { type: 'date', class: 'adm-input', id: 'adm-hor-fecha' });
      const swCerrado = Util.el('input', { type: 'checkbox', checked: true, onchange: () => horasEsp.classList.toggle('oculto', swCerrado.checked) });
      const inAbreE = Util.el('input', { type: 'time', class: 'adm-input', value: '09:00', 'aria-label': 'Abre ese día' });
      const inCierraE = Util.el('input', { type: 'time', class: 'adm-input', value: '14:00', 'aria-label': 'Cierra ese día' });
      const horasEsp = Util.el('div', { class: 'hor-dia__horas oculto' }, inAbreE, Util.el('span', { text: 'a' }), inCierraE);
      const lista = Util.el('div', { class: 'band-lista' });
      async function pintarEspeciales() {
        const hoy = clave(new Date());
        const proximas = (await Horario.config()).especiales.filter(e => e.fecha >= hoy).sort((a, b) => a.fecha.localeCompare(b.fecha));
        lista.replaceChildren(...(proximas.length ? proximas.map(e => Util.el('div', { class: 'band-chip' },
          Util.el('span', { text: fechaTxt(e.fecha) + ' · ' + (e.abierto ? horaTxt(e.abre) + ' – ' + horaTxt(e.cierra) : 'Cerrado') }),
          Util.el('button', { type: 'button', class: 'btn', text: 'Quitar', onclick: () => guardar(c => { c.especiales = c.especiales.filter(x => x.fecha !== e.fecha); }, 'Fecha quitada.') })))
          : [Util.el('p', { class: 'adm-nota', text: 'Sin fechas especiales próximas.' })]));
      }

      cuerpo.append(
        Util.el('label', { class: 'adm-switch' }, swActivo, Util.el('span', { text: 'Usar horario (fuera de horario la carta queda solo para ver)' })),
        Util.el('div', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: 'Horario de la semana' }),
          ...filas.map(f => f.el),
          Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar horario', onclick: () => guardar(c => {
            for (const f of filas) {
              if (f.sw.checked && (!f.abre.value || !f.cierra.value || f.abre.value === f.cierra.value)) { aviso('⚠️ Revisa las horas del ' + DIAS[f.d].toLowerCase() + '.', 'error'); return false; }
              c.dias[f.d] = { abierto: f.sw.checked, abre: f.abre.value || '07:00', cierra: f.cierra.value || '21:00' };
            }
          }, '✅ Horario de la semana guardado.') }),
          Util.el('p', { class: 'adm-nota', text: 'Si cierra después de medianoche, pon la hora de cierre menor que la de apertura (ej: 18:00 a 02:00).' })),
        Util.el('div', { class: 'adm-campo' }, Util.el('label', { class: 'adm-etq', for: 'adm-hor-fecha', text: 'Fechas especiales (festivos)' }),
          inFecha, Util.el('label', { class: 'adm-switch' }, swCerrado, Util.el('span', { text: 'Cerrado todo el día' })), horasEsp,
          Util.el('button', { type: 'button', class: 'btn btn--prim', text: '＋ Agregar fecha', onclick: () => guardar(c => {
            if (!inFecha.value) { aviso('⚠️ Elige la fecha.', 'error'); return false; }
            if (!swCerrado.checked && (!inAbreE.value || !inCierraE.value || inAbreE.value === inCierraE.value)) { aviso('⚠️ Revisa las horas de esa fecha.', 'error'); return false; }
            c.especiales = c.especiales.filter(x => x.fecha !== inFecha.value)
              .concat({ fecha: inFecha.value, abierto: !swCerrado.checked, abre: inAbreE.value, cierra: inCierraE.value });
            inFecha.value = '';
          }, '✅ Fecha especial guardada.') }),
          lista),
        msg);
      await pintarEspeciales();
      Util.escuchar(cuerpo, ['store:' + MOD], pintarEspeciales);
    }
  });
})();
</script>

<!-- Arranque -->
<script id="js-arranque">App.iniciar();</script>
