<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2F2A27">
<title>Nacho's Coffee & Drinks</title>

<!-- =====================================================================
     CSS · CORE (tokens y base compartida)
     ===================================================================== -->
<style id="css-core">
:root{
  --naranja:#E8762E;
  --naranja-osc:#C9601E;
  --cafe:#5A2E22;
  --crema:#FBF6EF;
  --negro:#2F2A27;  /* negro suave de la marca: franja del navegador, pie y categorías */
  --fondo:#FFFFFF; /* fondo de la carta del cliente: blanco puro, como el del logo */
  --crema-2:#F3EAE0;
  --blanco:#FFFFFF;
  --texto:#3A2A24;
  --texto-suave:#8A7568;
  --ok:#2E8B57;
  --error:#C0392B;
  --radio:16px;
  --gutter:16px;
  --ancho-max:1200px;
  /* Grosor de letra: todo normal; solo los valores en dinero en negrita. */
  --peso-normal:400;
  --peso-valor:800;
  --peso-titulo:800; /* títulos destacados (NUESTROS PRODUCTOS; luego la marca) */
  --fuente:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fuente);background:var(--fondo);color:var(--texto);line-height:1.4;min-height:100vh;display:flex;flex-direction:column}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.contenedor{width:100%;max-width:var(--ancho-max);margin:0 auto;padding:0 var(--gutter)}
#app-main{flex:1}
.oculto{display:none!important}

/* Botones reutilizables */
.btn{min-height:44px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--naranja);background:var(--blanco);color:var(--naranja-osc)}
.btn--prim{background:var(--naranja);color:var(--blanco)}
.btn--peligro{border-color:var(--error);color:var(--error)}
.btn:disabled{opacity:.45;cursor:default}

/* Hoja deslizable reutilizable (autogestión, ver pedido…) — el overlay completo hace scroll */
.hoja{position:fixed;inset:0;z-index:100;background:rgba(58,42,36,.45);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.hoja__caja{background:var(--crema);width:100%;max-width:720px;margin:6vh auto 0;min-height:94vh;border-radius:20px 20px 0 0}
.hoja__cab{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px var(--gutter);background:var(--naranja);color:var(--blanco);border-radius:20px 20px 0 0}
.hoja__titulo{font-size:1.05rem}
.hoja__cerrar{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:var(--blanco);font-size:1.3rem;line-height:1}
.adm-version{margin-top:8px;font-size:.75rem;color:var(--texto-suave);text-align:center}
.hoja__cuerpo{padding:var(--gutter) var(--gutter) calc(var(--gutter) + 40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
@media (min-width:768px){
  .hoja{padding:0 var(--gutter)}
  .hoja__caja{min-height:0;margin:5vh auto;border-radius:20px}
}

/* Editor de encuadre reutilizable (la forma del marco la define quien lo usa) */
.encuadre{position:relative;width:100%;max-width:520px;margin:0 auto;border-radius:14px;overflow:hidden;background:var(--crema-2);touch-action:none;cursor:grab;outline:3px dashed var(--naranja);outline-offset:3px}
.encuadre.arrastrando{cursor:grabbing}
.encuadre img{width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-select:none}
/* Visor de imagen a pantalla completa reutilizable */
.visor{position:fixed;inset:0;z-index:150;background:rgba(20,16,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px var(--gutter) calc(24px + env(safe-area-inset-bottom))}
.visor__img{max-width:100%;max-height:70vh;min-height:0;flex:0 1 auto;object-fit:contain;border-radius:12px} /* cede alto para que Cerrar siempre quepa */
.visor__texto{color:var(--blanco);font-size:1.05rem;text-align:center;max-width:600px;overflow-wrap:anywhere}
.visor__cerrar{min-height:52px;min-width:180px;padding:12px 28px;border-radius:999px;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.12);color:var(--blanco);font-size:1.1rem;line-height:1}
.visor__accion{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 24px;border-radius:999px;background:#25D366;color:var(--blanco);text-decoration:none}
.visor__accion svg{width:22px;height:22px;fill:currentColor}
.visor__titulo{color:var(--blanco);font-size:1.2rem;text-align:center;max-width:600px;overflow-wrap:anywhere}
.visor__titulo + .visor__texto{font-size:.95rem;opacity:.9;margin-top:-10px}
.visor__pie{display:flex;justify-content:center;background:var(--blanco);border-radius:999px;padding:4px 12px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.visor__pie .paso{margin-top:0}
.visor__pie:has(.paso.oculto){display:none} /* fuera de horario no se puede pedir: sin pastilla vacía */
.visor__precio{color:var(--blanco);font-weight:var(--peso-valor);font-size:1.25rem;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 16px}
.visor__contador{color:rgba(255,255,255,.75);font-size:.85rem}
/* Flechas ‹ › a los bordes de la pantalla (mismo estilo que las de categorías) */
.visor__flecha{position:fixed;top:45%;transform:translateY(-50%);z-index:1;width:40px;height:40px;border-radius:50%;border:0;background:var(--blanco);color:var(--naranja);font-size:1.7rem;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 3px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.visor__flecha--izq{left:6px}
.visor__flecha--der{right:6px}

/* Aviso flotante reutilizable (arriba, se cierra con ✕) */
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:180;width:calc(100% - 24px);max-width:520px;background:var(--blanco);border-left:6px solid var(--naranja);border-radius:var(--radio);box-shadow:0 8px 24px rgba(58,42,36,.25);padding:14px 52px 14px 14px;color:var(--cafe);line-height:1.35;animation:toast-entra .3s ease}
.toast__cerrar{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--crema-2);color:var(--cafe);font-size:1rem}
@keyframes toast-entra{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}

/* Diálogo de confirmación reutilizable */
.dlg{position:fixed;inset:0;z-index:200;background:rgba(58,42,36,.5);display:flex;align-items:center;justify-content:center;padding:var(--gutter)}
.dlg__caja{background:var(--blanco);border-radius:var(--radio);width:100%;max-width:380px;padding:20px;display:flex;flex-direction:column;gap:14px;text-align:center}
.dlg__titulo{color:var(--cafe);font-size:1.05rem}
.dlg__texto{color:var(--texto-suave);font-size:.95rem;overflow-wrap:anywhere}
.dlg__acciones{display:flex;gap:8px}
.dlg__acciones .btn{flex:1}
/* Grosor uniforme: todo normal y solo los valores (precios, subtotales y totales) en negrita. */
body,h1,h2,h3,h4,th,strong,b{font-weight:var(--peso-normal)}
.ped__linea>span:last-child,.ped__total>span:last-child,.ped-total>span:last-child,.cob-total>span:last-child,.ped-linea__unit,.hc td.num{font-weight:var(--peso-valor)}
.prod__valor s.prod__antes{font-weight:var(--peso-normal)}
</style>

<!-- =====================================================================
     CSS · MÓDULO MARCA (encabezado: logo + nombre)
     ===================================================================== -->
<style id="css-marca">
.marca{background:var(--blanco);border-bottom:2px solid var(--naranja)}
.marca__fila{display:flex;align-items:center;gap:14px;min-height:76px;padding-top:10px;padding-bottom:10px}
.marca__logo{flex:0 0 auto;width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--blanco);border:2px solid var(--naranja);display:flex;align-items:center;justify-content:center}
.marca__logo img{width:100%;height:100%;object-fit:contain}
.marca__inicial{font-size:1.5rem;color:var(--naranja)}
.marca__nombre{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:"Arial Black","Segoe UI Black",var(--fuente);line-height:1.15;color:var(--cafe);font-size:20px}
@media (min-width:768px){
  .marca__fila{min-height:92px;gap:18px}
  .marca__logo{width:68px;height:68px}
}
@media (min-width:1280px){
  .marca__logo{width:76px;height:76px}
}
</style>

<!-- =====================================================================
     CSS · MÓDULO BANNERS (slider publicitario)
     ===================================================================== -->
<style id="css-banners">
.banners{padding:14px 8px 4px}
.banners__titulo{text-align:center;color:var(--naranja);font-size:1.15rem;margin-bottom:10px}
.banners__vista{position:relative;width:100%;aspect-ratio:25/11;max-height:360px;border-radius:14px;overflow:hidden;background:var(--crema-2)}
.banners__pista{display:flex;height:100%;transition:transform .45s ease}
.banners__slide{flex:0 0 100%;height:100%;position:relative;border:0;padding:0;background:none;display:block}
.banners__slide img{width:100%;height:100%;object-fit:cover}
.banners__fondo{position:absolute;inset:0;filter:blur(18px) brightness(.85);transform:scale(1.15)}
.banners__completa{position:relative;object-fit:contain!important}
.adm-preview-banner .banners__fondo,.adm-preview-banner .banners__completa{width:100%;height:100%}
.adm-preview-banner .banners__fondo{object-fit:cover}
.banners__texto{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:var(--negro);color:var(--blanco);font-size:.8rem;padding:5px 12px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.banners__ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.banners__flecha{width:36px;height:36px;border-radius:50%;border:0;background:var(--naranja);color:var(--blanco);font-size:1.3rem;line-height:1}
.banners__puntos{display:flex;gap:8px}
.banners__punto{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--crema-2)}
.banners__punto.activo{background:var(--naranja)}
@media (min-width:768px){
  .banners{padding:20px 8px 6px}
  .banners__titulo{font-size:1.5rem}
  .banners__texto{font-size:1rem;left:16px;bottom:16px;padding:7px 16px}
}
.adm-preview-banner{width:100%;aspect-ratio:25/11;border-radius:10px;overflow:hidden;background:var(--crema-2)}
.adm-preview-banner img{width:100%;height:100%;object-fit:cover}
.adm-preview-banner{position:relative}
</style>

<!-- =====================================================================
     CSS · MÓDULO CATÁLOGO (tarjeta de producto reutilizable + destacados)
     ===================================================================== -->
<style id="css-catalogo">
.prod-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
/* Tarjeta en una sola pieza: foto libre (sin marco) arriba y, pegada debajo, la caja con borde (título + precio + − 0 +). */
.prod{display:flex;flex-direction:column;min-width:0}
.prod__img{width:100%;aspect-ratio:1/1;border-radius:16px 16px 0 0;overflow:hidden;background:var(--crema-2);display:flex;align-items:center;justify-content:center}
.prod__caja{flex:1;display:flex;flex-direction:column;gap:4px;padding:6px 4px 4px 8px;border:1.5px solid var(--naranja);border-radius:0 0 12px 12px;background:var(--blanco)}
.prod__img{position:relative}
.prod__img img{width:100%;height:100%;object-fit:cover}
.prod__img--ver{cursor:zoom-in}
.prod__desc{position:absolute;top:8px;left:8px;background:#C0392B;color:var(--blanco);font-weight:var(--peso-valor);font-size:.85rem;border-radius:999px;padding:3px 9px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.prod__valor--promo{display:flex;flex-direction:column;line-height:1.1}
.prod__valor s.prod__antes{font-size:.72rem;color:var(--texto-suave)}
.prod__inicial{font-family:"Arial Black","Segoe UI Black",var(--fuente);font-size:2.4rem;color:var(--naranja);opacity:.6}
.prod__texto{display:flex;flex-direction:column;gap:2px;text-align:center;padding-right:4px}
.prod__nombre{font-size:.95rem;color:var(--cafe);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod__detalle{font-size:.8rem;color:var(--texto-suave);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod__valor{font-size:1rem;font-weight:var(--peso-valor);color:var(--negro);white-space:nowrap}
/* Orden de la tarjeta: imagen → nombre y detalle → caja de compra.
   La caja se ancla al fondo (margin-top:auto): en una fila todas quedan a la misma altura con o sin detalle.
   Caja de compra: precio y − + juntos en un solo bloque (solo borde naranja, sin fondo).
   Si no caben (pantallas muy angostas), el − + baja solo dentro de la caja. */
.prod__pie{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 6px;margin-top:auto}
.prod__pie .prod__valor{font-size:.95rem}
.prod__pie .paso{margin-top:0;gap:4px}
.prod__pie .paso__btn{width:26px;height:26px;font-size:1rem}
.prod__pie .paso__num{min-width:16px;font-size:.95rem}
.destacados--fuera{display:none}
.destacados .franja{padding:0 2px 8px}
.destacados{padding:6px 8px 4px;max-width:var(--ancho-max);margin:0 auto}
@media (min-width:768px){
  .destacados .prod-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px}
  .prod__nombre{font-size:1.05rem}
  .prod__valor{font-size:1.1rem}
}
.cats{max-width:var(--ancho-max);margin:0 auto;padding:0;--caja-h:42px} /* --caja-h: alto común de la cajita del título y del botón volver */ /* márgenes estrechos: pegada al banner y a los productos */
.cats__marco{position:relative;--arriba:10px}
/* Cuadrícula de 3 columnas siempre: las piezas (cajita + foto) se reparten el ancho con márgenes laterales estrechos
   y crecen con la pantalla hasta un tope (no excesivo). Columnas alineadas; la última fila a la izquierda. */
.cats__fila{--pieza-max:140px;display:grid;grid-template-columns:repeat(3,minmax(0,var(--pieza-max)));justify-content:center;gap:10px 8px;padding:var(--arriba) 10px 8px}
/* Franja de título compartida (NUESTROS PRODUCTOS, destacados): naranja, letra blanca en negrita, del ancho de la cuadrícula. */
.franja{display:flex;flex-direction:column;align-items:center;padding:6px 10px 0;max-width:calc(3 * 140px + 2 * 8px + 20px);margin:0 auto}
.franja__caja{width:100%;margin:0;text-align:center;background:var(--naranja);color:var(--blanco);border-radius:999px;padding:5px 12px;font-weight:var(--peso-titulo);letter-spacing:.04em;line-height:1.2;white-space:nowrap;overflow:hidden}
.franja__txt{display:block;width:max-content;margin:0 auto} /* el alto de la caja lo da solo el texto (sin la línea base del h2) */
/* Una categoría abierta: las demás se ocultan y la abierta queda centrada, del mismo tamaño, como encabezado. */
.cats--una .cat-item:not(.activa){display:none}
.cats--una .cat-item.activa{grid-row:1;grid-column:1 / span 2;align-self:center;box-shadow:none;transform:none} /* abierta = encabezado: solo el título */
.cats--una .cat-item.activa .cat__foto{display:none}
.cats--una .cat-item.activa .cat{border-radius:14px;border-bottom:1px solid rgba(47,42,39,.3);pointer-events:none}
.cats__volver{display:none;grid-row:1;grid-column:3;align-self:center;width:100%;height:var(--caja-h);padding:2px 8px;border:0;border-radius:14px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.24),rgba(255,255,255,0) 58%),var(--negro);color:var(--blanco);font-size:.85rem;line-height:1.15;text-align:center;overflow:hidden;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(58,42,36,.25)}
.cats--una .cats__volver{display:flex}
.cats__volver--flota{position:fixed;left:50%;transform:translateX(-50%);z-index:48;max-width:calc(100% - 32px);border-radius:999px;padding:9px 18px;width:auto;height:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 12px rgba(58,42,36,.25)}
.cats__volver--flota.cats__volver--ver{display:flex}
/* Pieza de categoría: cajita con el título arriba y la foto pegada debajo (sin taparla): una sola pieza. */
.cat-item{position:relative;display:flex;flex-direction:column;width:100%;min-width:0;border-radius:14px;box-shadow:0 3px 8px rgba(58,42,36,.18);transition:box-shadow .15s}
.cat-item .cat{width:100%;height:var(--caja-h);aspect-ratio:auto;border-radius:14px 14px 0 0;padding:4px 6px;background:var(--blanco);color:var(--negro);border:1px solid rgba(47,42,39,.3);border-bottom:0;box-shadow:none;z-index:1} /* borde fino en negro suave; abajo se une con la foto */
.cat-item .cat::after{display:none} /* cajita blanca y plana: sin destello */
.cat-item .cat.activa{box-shadow:none;filter:none}
.cat-item.activa{box-shadow:0 0 0 2px var(--crema),0 0 0 4px var(--naranja),0 3px 8px rgba(58,42,36,.18)}
.cat__foto{width:100%;aspect-ratio:100/110;border:0;padding:0;border-radius:0 0 14px 14px;overflow:hidden;background:var(--crema-2);display:flex;align-items:center;justify-content:center}
.cat__foto img{width:100%;height:100%;object-fit:cover;display:block}
.cat__inicial{font-size:1.8rem;color:var(--naranja);opacity:.6}
.cat-item:active{transform:scale(.98)}
.cat{flex:0 0 auto;width:80px;height:80px;border-radius:50%;padding:8px;border:0;position:relative;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.24),rgba(255,255,255,0) 58%),var(--tono);color:var(--blanco);font-size:13px;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden;word-break:normal;overflow-wrap:normal;box-shadow:0 4px 10px rgba(58,42,36,.22),inset 0 -3px 6px rgba(0,0,0,.18);transition:filter .15s,box-shadow .15s,transform .15s}
.cat:active{transform:scale(.96)}
.cat--partir{hyphens:auto;overflow-wrap:anywhere}
.cat.activa{filter:brightness(1.12);box-shadow:0 0 0 2px var(--crema),0 0 0 4px var(--anillo),0 4px 10px rgba(58,42,36,.22)}
/* Destello en cascada: invita a tocar mientras ninguna categoría está abierta */
.cat::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-130%)}
.cats--invita .cat::after{animation:cat-brillo 3620ms ease-in-out infinite;animation-delay:calc(var(--i,0) * .15s)}
@keyframes cat-brillo{0%{transform:translateX(-130%)}13.81%{transform:translateX(130%)}100%{transform:translateX(130%)}}
@media (prefers-reduced-motion:reduce){.cats--invita .cat::after{animation:none}}
.carta{padding:6px 8px 4px}
.carta .prod-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:600px){ .carta .prod-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:900px){ .carta .prod-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px} .cat{width:96px;height:96px;padding:10px;font-size:15px} .cats{--caja-h:48px} }
@media (min-width:1200px){ .carta .prod-grid{grid-template-columns:repeat(5,minmax(0,1fr))} }
@media (min-width:1600px){ .carta .prod-grid{grid-template-columns:repeat(6,minmax(0,1fr))} }
/* Autogestión del catálogo */
.adm-select{appearance:auto}
/* Selector en hoja (Util.selector): fondo blanco, letra negra en negrita, categorías resaltadas */
.elegir{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;color:var(--negro)}
.elegir::after{content:'▾';flex:none}
.hoja--elegir .hoja__caja{background:var(--blanco)}
.hoja--elegir .hoja__cuerpo{gap:0}
.elegir__cat{margin:12px 0 4px;padding:8px 12px;border-radius:10px;background:var(--naranja);color:var(--blanco)}
.elegir__op{display:flex;justify-content:space-between;gap:12px;width:100%;padding:14px 12px;border:0;border-bottom:1px solid var(--crema-2);background:var(--blanco);color:var(--negro);font-size:1rem;text-align:left}
.elegir__op span+span{flex:none;color:var(--texto);opacity:.7}
.elegir__op.activo{background:var(--crema)}
.elegir__res{border:1.5px solid var(--crema-2);border-radius:12px;background:var(--blanco);max-height:280px;overflow-y:auto}
.elegir__res:empty{display:none}
.elegir__op small{display:block;font-size:.8rem;color:var(--naranja)}
.elegir__nada{margin:0;padding:12px;color:var(--texto);opacity:.7}
.adm-lista{display:flex;flex-direction:column;gap:10px}
.adm-prod{display:flex;align-items:center;gap:10px}

.pie{background:var(--negro);color:var(--blanco);margin-top:32px}
.pie__fila{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:7px;padding-bottom:calc(7px + env(safe-area-inset-bottom))}
.pie__texto{font-size:.95rem;text-align:center;color:var(--blanco)}
.pie__version{min-height:1.4em;font-size:.75rem;opacity:.9;text-align:center;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;padding:2px 0}
</style>

<!-- =====================================================================
     CSS · MÓDULO AYUDA  (fila flotante: Compartir · WhatsApp del asesor)
     ===================================================================== -->
<style id="css-ayuda">
/* Compartir a la izquierda y WhatsApp a la derecha, alineados con el ancho del contenido (mismo margen lateral de la página). */
.ayuda{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:45;max-width:var(--ancho-max);margin:0 auto;display:flex;justify-content:space-between;gap:10px;padding:0 var(--gutter);pointer-events:none}
.ayuda__btn{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;min-height:25px;padding:3px 12px;line-height:1;border-radius:999px;border:0;background:#25D366;color:var(--blanco);font-size:.85rem;text-decoration:none;white-space:nowrap;box-shadow:0 4px 12px rgba(58,42,36,.25)}
.ayuda__btn--compartir{background:var(--naranja)}
.ayuda__btn svg{width:17px;height:17px;fill:currentColor;flex:0 0 auto}
/* Con pedido en curso la barra del pedido manda: la fila se esconde. */
body.con-barra .ayuda{display:none}
/* Espacio al final del pie para que la fila no tape el lema ni la ubicación. */
body.con-ayuda:not(.con-barra) .pie__fila{padding-bottom:calc(47px + env(safe-area-inset-bottom))}
</style>

<!-- =====================================================================
     CSS · MÓDULO HORARIO  (aviso de cerrado · autogestión J)
     ===================================================================== -->
<style id="css-horario">
.horario{max-width:var(--ancho-max);margin:12px auto 0;padding:0 8px}
.horario__aviso{background:var(--negro);color:var(--blanco);border-radius:999px;padding:10px 16px;text-align:center}
.hor-dia{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center;background:var(--blanco);border-radius:12px;padding:8px 10px}
.hor-dia__horas{grid-column:1 / -1;display:flex;align-items:center;gap:6px}
.hor-dia__horas .adm-input{flex:1;min-width:0;padding-left:8px;padding-right:6px;font-size:.9rem}
</style>
</head>
<body>

<!-- Ranuras donde cada módulo se monta (el orden lo define cada módulo) -->
<header id="slot-encabezado"></header>
<main id="app-main"></main>
<footer id="slot-pie"></footer>
<div id="slot-flotante"></div>
<div id="slot-capas"></div>

<!-- =====================================================================
     JS · CORE  — único código compartido. Los módulos solo hablan por aquí.
     ===================================================================== -->
<script id="js-core">
(function () {
  'use strict';

  const CONFIG = Object.freeze({
    negocioId: 'nachos',
    version: 'A124 → N125',
    archivo: 'Nachos-125-index.html',
    peso: '296.8 KB'
  });

  /* ---------- Utilidades ---------- */
  const Util = {
    // Crea elementos sin innerHTML: todo texto entra como textContent (sanitizado por diseño).
    el(tag, attrs, ...hijos) {
      const n = document.createElement(tag);
      if (attrs) for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = v;
        else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? '' : v);
      }
      for (const h of hijos.flat()) if (h !== null && h !== undefined && h !== false) n.append(h);
      return n;
    },
    // Ajusta el tamaño de letra para que el texto llene el ancho disponible en una línea.
    // tope(): tamaño máximo en px (se recalcula en cada ajuste); min: piso legible.
    ajustarAlAncho(el, tope, min) {
      const ajustar = () => {
        const max = Math.max(min, Math.floor(tope()));
        el.style.fontSize = max + 'px';
        const disponible = el.clientWidth, necesario = el.scrollWidth;
        if (disponible > 0 && necesario > disponible) {
          el.style.fontSize = Math.max(min, Math.floor(max * disponible / necesario)) + 'px';
        }
      };
      if (window.ResizeObserver) new ResizeObserver(ajustar).observe(el.parentElement);
      else window.addEventListener('resize', ajustar);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar);
      ajustar();
      return ajustar;
    },
    // Mensaje de estado uniforme (ok / error) en un elemento <p>.
    mensaje(el, texto, tipo) { el.textContent = texto; el.className = 'adm-msg adm-msg--' + (tipo || 'ok'); },
    // Hoja (panel) reutilizable. Devuelve { cuerpo, cerrar }. onCerrar se llama al cerrarse.
    hoja(titulo, onCerrar) {
      const cerrar = () => {
        if (!capa.isConnected) return;
        capa.remove(); document.removeEventListener('keydown', tecla);
        if (!document.querySelector('.hoja')) document.body.style.overflow = '';
        if (onCerrar) onCerrar();
      };
      const tecla = (e) => { if (e.key === 'Escape' && !document.querySelector('.dlg') && document.querySelector('.hoja:last-of-type') === capa) cerrar(); };
      const cuerpo = Util.el('div', { class: 'hoja__cuerpo' });
      const capa = Util.el('div', { class: 'hoja', role: 'dialog', 'aria-modal': 'true', 'aria-label': titulo,
        onclick: e => { if (e.target === capa) cerrar(); } },
        Util.el('div', { class: 'hoja__caja' },
          Util.el('div', { class: 'hoja__cab' },
            Util.el('span', { class: 'hoja__titulo', text: titulo }),
            Util.el('button', { type: 'button', class: 'hoja__cerrar', 'aria-label': 'Cerrar', text: '✕', onclick: () => cerrar() })),
          cuerpo));
      document.getElementById('slot-capas').append(capa);
      document.body.style.overflow = 'hidden';
      document.addEventListener('keydown', tecla);
      return { cuerpo, cerrar };
    },
    // Selector en hoja: reemplaza al <select> nativo (Android lo pinta oscuro y no se puede estilizar).
    // grupos(): [{ titulo|null, items: [{ valor, texto, extra }] }]. Devuelve un botón con .value como un <select>.
    // Con buscar: true, btn.buscador es una lupa que filtra por letras o números (sin tildes ni mayúsculas).
    selector({ etiqueta, vacio, grupos, alCambiar, buscar }) {
      let actual = '';
      const btn = Util.el('button', { type: 'button', class: 'adm-input elegir', 'aria-label': etiqueta });
      const pintar = () => { const it = grupos().flatMap(g => g.items).find(i => i.valor === actual); btn.textContent = it ? it.texto : vacio; };
      Object.defineProperty(btn, 'value', { get: () => actual, set: v => { actual = v || ''; pintar(); } });
      if (buscar) {
        const norm = (t) => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
        const res = Util.el('div', { class: 'elegir__res' });
        const inBus = Util.el('input', { type: 'search', class: 'adm-input', placeholder: '🔍 Buscar producto', 'aria-label': 'Buscar ' + etiqueta.toLowerCase(), autocomplete: 'off',
          oninput: () => {
            const q = norm(inBus.value);
            if (!q) { res.replaceChildren(); return; }
            const hits = grupos().flatMap(g => g.items.filter(i => i.valor && norm(i.texto).includes(q)).map(i => ({ ...i, cat: g.titulo })));
            res.replaceChildren(...(hits.length ? hits.map(i => Util.el('button', { type: 'button', class: 'elegir__op',
              onclick: () => { inBus.value = ''; res.replaceChildren(); const cambio = i.valor !== actual; btn.value = i.valor; if (cambio && alCambiar) alCambiar(i.valor); } },
              Util.el('span', null, i.texto, i.cat ? Util.el('small', { text: i.cat }) : null), i.extra ? Util.el('span', { text: i.extra }) : null))
              : [Util.el('p', { class: 'elegir__nada', text: 'Sin resultados' })]));
          } });
        btn.buscador = Util.el('div', { class: 'adm-campo' }, inBus, res);
      }
      btn.addEventListener('click', () => {
        const h = Util.hoja(etiqueta);
        h.cuerpo.closest('.hoja').classList.add('hoja--elegir');
        h.cuerpo.append(...grupos().flatMap(g => [g.titulo ? Util.el('p', { class: 'elegir__cat', text: g.titulo }) : null,
          ...g.items.map(i => Util.el('button', { type: 'button', class: 'elegir__op' + (i.valor === actual ? ' activo' : ''),
            onclick: () => { h.cerrar(); if (i.valor === actual) return; btn.value = i.valor; if (alCambiar) alCambiar(i.valor); } },
            Util.el('span', { text: i.texto }), i.extra ? Util.el('span', { text: i.extra }) : null))]).filter(Boolean));
      });
      pintar();
      return btn;
    },
    // Editor de encuadre reutilizable (banners, productos): se arrastra la foto dentro del marco con la forma
    // donde se mostrará y se guarda la posición { x, y } en %. La imagen no se modifica.
    encuadre(url, inicial, { aspecto, nota }, alGuardar) {
      const h = Util.hoja('✋ Ajustar encuadre');
      let { x, y } = inicial || { x: 50, y: 50 };
      const img = Util.el('img', { src: url, alt: '', draggable: 'false' });
      const marco = Util.el('div', { class: 'encuadre', style: 'aspect-ratio:' + aspecto }, img);
      const pintar = () => { img.style.objectPosition = x + '% ' + y + '%'; };
      let ini = null;
      const sobrante = () => {
        const W = marco.clientWidth, H = marco.clientHeight, nw = img.naturalWidth || 1, nh = img.naturalHeight || 1;
        const k = Math.max(W / nw, H / nh);
        return { ox: nw * k - W, oy: nh * k - H };
      };
      marco.addEventListener('pointerdown', e => { ini = { px: e.clientX, py: e.clientY, x, y }; marco.setPointerCapture(e.pointerId); marco.classList.add('arrastrando'); });
      marco.addEventListener('pointermove', e => {
        if (!ini) return;
        const { ox, oy } = sobrante();
        if (ox > 0.5) x = Math.min(100, Math.max(0, ini.x - (e.clientX - ini.px) / ox * 100));
        if (oy > 0.5) y = Math.min(100, Math.max(0, ini.y - (e.clientY - ini.py) / oy * 100));
        pintar();
      });
      const soltar = () => { ini = null; marco.classList.remove('arrastrando'); };
      marco.addEventListener('pointerup', soltar); marco.addEventListener('pointercancel', soltar);
      pintar();
      h.cuerpo.append(
        Util.el('p', { class: 'adm-nota', text: nota }),
        marco,
        Util.el('div', { class: 'adm-acciones' },
          Util.el('button', { type: 'button', class: 'btn', text: 'Cancelar', onclick: () => h.cerrar() }),
          Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar encuadre',
            onclick: async () => { await alGuardar({ x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 }); h.cerrar(); } })));
    },
    // Visor de imagen completa. accion opcional { texto, href, icono:'whatsapp' }. Se cierra con ✕, tocando fuera o con "atrás".
    // Con { galeria: [{ url, texto, accion }], inicio } muestra varias con flechas ‹ › y contador; onCerrar recibe la última vista.
    visor(opciones, onCerrar) {
      const items = opciones.galeria || [opciones];
      let i = Math.min(Math.max(0, opciones.inicio || 0), items.length - 1), cerrado = false;
      const cerrar = (desdeAtras) => {
        if (cerrado) return; cerrado = true;
        capa.remove(); document.removeEventListener('keydown', tecla); window.removeEventListener('popstate', atras);
        document.body.classList.remove('con-visor'); soltar();
        if (!document.querySelector('.hoja')) document.body.style.overflow = '';
        if (!desdeAtras && history.state && history.state.visor) history.back();
        if (onCerrar) onCerrar(i);
      };
      const atras = () => cerrar(true);
      const cerrarPedido = () => cerrar(); // p. ej. "Ver pedido" desde la barra del carrito
      document.body.classList.add('con-visor'); const soltar = App.Bus.on('visor:cerrar', cerrarPedido);
      const varias = items.length > 1;
      const img = Util.el('img', { class: 'visor__img', alt: '' });
      const titulo = Util.el('p', { class: 'visor__titulo' });
      const texto = Util.el('p', { class: 'visor__texto' });
      const precio = Util.el('p', { class: 'visor__precio' });
      const accionTxt = Util.el('span');
      const accion = Util.el('a', { class: 'visor__accion', target: '_blank', rel: 'noopener' }, Util.icoWa(), accionTxt);
      const contador = Util.el('p', { class: 'visor__contador' });
      function mostrar(k) {
        i = (k + items.length) % items.length;
        const it = items[i];
        img.classList.toggle('oculto', !it.url); if (it.url) { img.src = it.url; img.alt = it.texto || ''; }
        titulo.textContent = it.titulo || ''; titulo.classList.toggle('oculto', !it.titulo);
        texto.textContent = it.texto || ''; texto.classList.toggle('oculto', !it.texto);
        precio.textContent = it.precio || ''; precio.classList.toggle('oculto', !it.precio);
        accion.classList.toggle('oculto', !it.accion);
        if (it.accion) { accion.href = it.accion.href; accionTxt.textContent = it.accion.texto; accion.firstChild.style.display = it.accion.icono === 'whatsapp' ? '' : 'none'; }
        contador.textContent = (i + 1) + ' / ' + items.length;
        capa.setAttribute('aria-label', it.titulo || it.texto || 'Imagen');
      }
      const tecla = (e) => { if (e.key === 'Escape') cerrar(); else if (varias && e.key === 'ArrowRight') mostrar(i + 1); else if (varias && e.key === 'ArrowLeft') mostrar(i - 1); };
      const flecha = (dir) => Util.el('button', { type: 'button', class: 'visor__flecha visor__flecha--' + (dir < 0 ? 'izq' : 'der'), 'aria-label': dir < 0 ? 'Anterior' : 'Siguiente', text: dir < 0 ? '‹' : '›', onclick: () => mostrar(i + dir) });
      const capa = Util.el('div', { class: 'visor', role: 'dialog', 'aria-modal': 'true', onclick: e => { if (e.target === capa) cerrar(); } },
        img, titulo, texto, precio, accion,
        // Espacio opcional (ej. el − 0 + del producto para pedir sin cerrar).
        opciones.pie ? Util.el('div', { class: 'visor__pie' }, opciones.pie) : null,
        varias ? contador : null,
        // Cerrar abajo, grande y a la vista: al alcance del pulgar y claro para cualquier edad.
        Util.el('button', { type: 'button', class: 'visor__cerrar', text: '✕ Cerrar', onclick: () => cerrar() }),
        varias ? flecha(-1) : null, varias ? flecha(1) : null);
      mostrar(i);
      document.getElementById('slot-capas').append(capa);
      document.body.style.overflow = 'hidden';
      history.pushState({ visor: true }, '');
      window.addEventListener('popstate', atras);
      document.addEventListener('keydown', tecla);
      return { cerrar };
    },
    // Aviso flotante: permanece hasta que se cierre con ✕.
    // Aviso flotante. interno = true: es del asesor (cobros, cierres, cartera, inventario); vive solo mientras
    // Caja o Admin están abiertos y se borra al cerrarlos (el cliente nunca lo ve). Con roles, solo para asesores.
    toast(texto, interno) {
      const t = Util.el('div', { class: 'toast' + (interno ? ' toast--interno' : ''), role: 'status' },
        Util.el('span', { text: texto }),
        Util.el('button', { type: 'button', class: 'toast__cerrar', 'aria-label': 'Cerrar aviso', text: '✕', onclick: () => t.remove() }));
      document.getElementById('slot-capas').append(t);
      return t;
    },
    // Franja de título (cajita naranja ovalada, letra blanca en negrita, MAYÚSCULAS). La letra se ajusta sola:
    // el mismo tamaño que "NUESTROS PRODUCTOS" (~60 % del ancho) y, si el texto es más largo, lo justo para caber.
    franja(texto, clase) {
      const txt = Util.el('span', { class: 'franja__txt' });
      const caja = Util.el('h2', { class: 'franja__caja' }, txt);
      const el = Util.el('div', { class: 'franja' + (clase ? ' ' + clase : '') }, caja);
      const medir = (t) => { txt.textContent = t; txt.style.fontSize = '20px'; return txt.getBoundingClientRect().width; };
      let actual = '';
      const ajustar = () => {
        if (!caja.clientWidth) return; // oculta: se ajusta al mostrarse
        const ref = medir('NUESTROS PRODUCTOS'), w = medir(actual), ancho = caja.clientWidth;
        if (ref && w) txt.style.fontSize = Math.max(11, Math.min(24, 20 * ancho * 0.6 / ref, 20 * (ancho - 28) / w)).toFixed(1) + 'px';
      };
      const poner = (t) => { actual = String(t || '').toUpperCase(); txt.textContent = actual; ajustar(); };
      window.addEventListener('resize', ajustar);
      poner(texto);
      return { el, poner, ajustar };
    },
    quitarAvisosInternos() { document.querySelectorAll('.toast--interno').forEach(t => t.remove()); },
    // Diálogo con varias opciones. Devuelve Promise<valor | null>.
    elegir(titulo, opciones) {
      return new Promise(resolve => {
        const cerrar = (r) => { capa.remove(); document.removeEventListener('keydown', tecla); resolve(r); };
        const tecla = (e) => { if (e.key === 'Escape') cerrar(null); };
        const capa = Util.el('div', { class: 'dlg', role: 'dialog', 'aria-modal': 'true', onclick: e => { if (e.target === capa) cerrar(null); } },
          Util.el('div', { class: 'dlg__caja' },
            Util.el('p', { class: 'dlg__titulo', text: titulo }),
            Util.el('div', { class: 'dlg__acciones' }, opciones.map(o => Util.el('button', { type: 'button', class: 'btn btn--prim', text: o.texto, onclick: () => cerrar(o.valor) }))),
            Util.el('button', { type: 'button', class: 'btn', text: 'Cancelar', onclick: () => cerrar(null) })));
        document.addEventListener('keydown', tecla);
        document.body.append(capa);
      });
    },
    // Diálogo Sí/No. Devuelve Promise<boolean>.
    confirmar(titulo, texto, si, no) {
      return new Promise(resolve => {
        const cerrar = (r) => { capa.remove(); document.removeEventListener('keydown', tecla); resolve(r); };
        const tecla = (e) => { if (e.key === 'Escape') cerrar(false); };
        const capa = Util.el('div', { class: 'dlg', role: 'dialog', 'aria-modal': 'true', onclick: e => { if (e.target === capa) cerrar(false); } },
          Util.el('div', { class: 'dlg__caja' },
            Util.el('p', { class: 'dlg__titulo', text: titulo }),
            texto ? Util.el('p', { class: 'dlg__texto', text: texto }) : null,
            Util.el('div', { class: 'dlg__acciones' },
              Util.el('button', { type: 'button', class: 'btn', text: no || 'No', onclick: () => cerrar(false) }),
              Util.el('button', { type: 'button', class: 'btn btn--prim', text: si || 'Sí', onclick: () => cerrar(true) })
            )
          )
        );
        document.addEventListener('keydown', tecla);
        document.body.append(capa);
      });
    },
    precio(n) { return '$ ' + (parseInt(n, 10) || 0).toLocaleString('es-CO'); },
    entero(v) { const d = String(v ?? '').replace(/\D/g, ''); return d === '' ? null : parseInt(d, 10); },
    // Escucha eventos mientras el elemento siga en pantalla; al desaparecer se desuscribe solo.
    escuchar(el, eventos, fn) {
      const offs = eventos.map(ev => App.Bus.on(ev, d => { if (!el.isConnected) offs.forEach(o => o()); else fn(d); }));
    },
    // Ajusta la letra para que el texto quepa completo en su caja (sin cortar palabras).
    ajustarCaja(el, max, min) {
      let t = max;
      el.style.fontSize = t + 'px';
      while (t > min && (el.scrollWidth > el.clientWidth || el.scrollHeight > el.clientHeight)) { t -= 0.5; el.style.fontSize = t + 'px'; }
    },
    // WhatsApp: 10 dígitos colombianos → con indicativo 57 (para enlaces wa.me).
    numeroWa(n) { const d = String(n || '').replace(/\D/g, ''); return d.length === 10 ? '57' + d : d; },
    // Ícono de WhatsApp (SVG) reutilizable.
    icoWa() {
      const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'), path = document.createElementNS(ns, 'path');
      svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('aria-hidden', 'true');
      path.setAttribute('d', 'M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z');
      svg.append(path); return svg;
    },
    limpiarTexto(txt, max) {
      return String(txt || '').replace(/\s+/g, ' ').trim().slice(0, max || 200);
    },
    // Reduce una imagen a un lado máximo y la devuelve como Blob.
    reducirImagen(file, ladoMax, calidad) {
      return new Promise((resolve, reject) => {
        if (!file || !/^image\//.test(file.type)) return reject(new Error('El archivo no es una imagen.'));
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const escala = Math.min(1, ladoMax / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * escala);
          c.height = Math.round(img.height * escala);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          c.toBlob(b => b ? resolve(b) : reject(new Error('No se pudo procesar la imagen.')), 'image/jpeg', calidad || 0.85);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Formato de imagen no compatible (usa JPG, PNG o WEBP).')); };
        img.src = url;
      });
    }
  };

  /* ---------- Bus de eventos (comunicación entre módulos) ---------- */
  const Bus = (() => {
    const subs = {};
    return {
      on(evt, fn) { (subs[evt] = subs[evt] || []).push(fn); return () => { subs[evt] = (subs[evt] || []).filter(f => f !== fn); }; },
      emit(evt, data) { (subs[evt] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(evt, e); } }); }
    };
  })();

  /* ---------- Store: única capa de datos (Fase 1: localStorage) ----------
     API asíncrona a propósito: en Fase 2/3 se reemplaza por llamadas al servidor
     sin tocar los módulos. */
  const Store = (() => {
    const clave = (modulo) => CONFIG.negocioId + ':' + modulo;
    // Otra pestaña (ej. la caja) guardó datos: se avisa igual que un cambio local.
    window.addEventListener('storage', (e) => {
      const pref = CONFIG.negocioId + ':';
      if (!e.key || !e.key.startsWith(pref) || e.key.startsWith(pref + 'media:')) return;
      let d = null; try { d = JSON.parse(e.newValue); } catch (x) { }
      Bus.emit('store:' + e.key.slice(pref.length), d);
    });
    return {
      async get(modulo, porDefecto) {
        try {
          const raw = localStorage.getItem(clave(modulo));
          const base = JSON.parse(JSON.stringify(porDefecto || {}));
          return raw ? Object.assign(base, JSON.parse(raw)) : base;
        } catch (e) { return JSON.parse(JSON.stringify(porDefecto || {})); }
      },
      async set(modulo, datos) {
        try { localStorage.setItem(clave(modulo), JSON.stringify(datos)); }
        catch (e) { throw new Error('No hay espacio de almacenamiento en este dispositivo.'); }
        Bus.emit('store:' + modulo, datos);
        return datos;
      }
    };
  })();

  /* ---------- Media: fotos y videos fuera del localStorage ----------
     Fase 1: IndexedDB. Si el dispositivo no lo permite, respaldo en localStorage
     (solo apto para imágenes pequeñas ya reducidas). */
  const Media = (() => {
    const DB = CONFIG.negocioId + '-media', TABLA = 'archivos';
    let dbPromesa = null;
    function abrir() {
      if (dbPromesa) return dbPromesa;
      dbPromesa = new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(TABLA);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      });
      return dbPromesa;
    }
    const lsClave = id => CONFIG.negocioId + ':media:' + id;
    function blobADataURL(blob) {
      return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
    }
    const urls = {};
    return {
      async guardar(blob) {
        const id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const db = await abrir();
        if (db) {
          await new Promise((res, rej) => {
            const tx = db.transaction(TABLA, 'readwrite');
            tx.objectStore(TABLA).put(blob, id);
            tx.oncomplete = res; tx.onerror = () => rej(new Error('No se pudo guardar el archivo.'));
          });
        } else {
          try { localStorage.setItem(lsClave(id), await blobADataURL(blob)); }
          catch (e) { throw new Error('No hay espacio para guardar el archivo en este dispositivo.'); }
        }
        return id;
      },
      async url(id) {
        if (!id) return null;
        if (urls[id]) return urls[id];
        const db = await abrir();
        if (db) {
          const blob = await new Promise(res => {
            const req = db.transaction(TABLA).objectStore(TABLA).get(id);
            req.onsuccess = () => res(req.result || null); req.onerror = () => res(null);
          });
          if (blob) return (urls[id] = URL.createObjectURL(blob));
        }
        return localStorage.getItem(lsClave(id));
      },
      async borrar(id) {
        if (!id) return;
        if (urls[id]) { URL.revokeObjectURL(urls[id]); delete urls[id]; }
        const db = await abrir();
        if (db) await new Promise(res => { const tx = db.transaction(TABLA, 'readwrite'); tx.objectStore(TABLA).delete(id); tx.oncomplete = res; tx.onerror = res; });
        localStorage.removeItem(lsClave(id));
      }
    };
  })();

  /* ---------- Registro de módulos ----------
     Cada módulo declara: id, slot, orden, letra (autogestión), titulo,
     montar(contenedor) y, opcional, admin(contenedor). */
  const modulos = [];
  const servicios = {};
  const App = {
    CONFIG, Util, Bus, Store, Media,
    modulo(def) { modulos.push(def); },
    servicio(nombre, api) { if (api) servicios[nombre] = api; return servicios[nombre]; },
    lista() { return modulos.slice(); },
    async iniciar() {
      const ordenados = modulos.slice().sort((a, b) => (a.orden || 0) - (b.orden || 0));
      for (const m of ordenados) {
        const slot = document.getElementById(m.slot);
        if (!slot || !m.montar) continue;
        const raiz = Util.el('section', { 'data-modulo': m.id });
        slot.append(raiz);
        try { await m.montar(raiz); } catch (e) { console.error('Módulo ' + m.id, e); }
      }
      Bus.emit('app:lista');
    }
  };

  window.App = App;
})();
</script>

<script id="js-marca">
(function () {
  'use strict';
  const { Util, Store, Media, Bus } = App;
  const MOD = 'marca';
  const DEF = { nombre: "Nacho's Coffee & Drinks", logoId: null };
  const NOMBRE_MAX = 40;
  // Nombre vigente del negocio (con su valor por defecto) para otros módulos.
  App.servicio('marca', {
    async nombre() { return (await Store.get(MOD, DEF)).nombre; },
    async logoUrl() { return Media.url((await Store.get(MOD, DEF)).logoId); }
  });

  // Pinta un logo circular (imagen o inicial) dentro de un contenedor.
  async function pintarLogo(caja, datos, claseInicial) {
    caja.replaceChildren();
    const url = await Media.url(datos.logoId);
    if (url) caja.append(Util.el('img', { src: url, alt: 'Logo ' + datos.nombre }));
    else caja.append(Util.el('span', { class: claseInicial, text: (datos.nombre || '?').charAt(0).toUpperCase() }));
  }

  App.modulo({
    id: MOD,
    slot: 'slot-encabezado',
    orden: 10,
    letra: 'A',
    titulo: 'Logo y marca',

    async montar(raiz) {
      raiz.className = 'marca';
      const logo = Util.el('div', { class: 'marca__logo' });
      const nombre = Util.el('h1', { class: 'marca__nombre' });
      raiz.append(Util.el('div', { class: 'contenedor marca__fila' }, logo, nombre));
      const reajustar = Util.ajustarAlAncho(nombre, () => logo.offsetHeight * 0.8, 14);

      async function render(datos) {
        nombre.textContent = datos.nombre;
        document.title = datos.nombre;
        reajustar();
        await pintarLogo(logo, datos, 'marca__inicial');
      }
      render(await Store.get(MOD, DEF));
      Bus.on('store:' + MOD, d => render(Object.assign({}, DEF, d)));
    },

    async admin(cuerpo) {
      const datos = await Store.get(MOD, DEF);

      const preview = Util.el('div', { class: 'adm-preview-logo' });
      const inputArchivo = Util.el('input', { type: 'file', accept: 'image/*', class: 'oculto' });
      const btnCambiar = Util.el('button', { type: 'button', class: 'btn', text: 'Cambiar logo' });
      const btnQuitar = Util.el('button', { type: 'button', class: 'btn btn--peligro', text: 'Quitar logo' });
      const inputNombre = Util.el('input', { type: 'text', class: 'adm-input', maxlength: NOMBRE_MAX, value: datos.nombre, id: 'adm-marca-nombre' });
      const btnGuardar = Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar nombre' });
      const msg = Util.el('p', { class: 'adm-msg', role: 'status' });

      const aviso = (texto, tipo) => Util.mensaje(msg, texto, tipo);
      async function refrescar() {
        const d = await Store.get(MOD, DEF);
        await pintarLogo(preview, d, 'marca__inicial');
        btnQuitar.disabled = !d.logoId;
      }

      btnCambiar.addEventListener('click', () => inputArchivo.click());

      inputArchivo.addEventListener('change', async () => {
        const file = inputArchivo.files[0];
        inputArchivo.value = '';
        if (!file) return;
        try {
          aviso('Procesando imagen…', 'ok');
          const blob = await Util.reducirImagen(file, 512, 0.88);
          const d = await Store.get(MOD, DEF);
          const anterior = d.logoId;
          d.logoId = await Media.guardar(blob);
          await Store.set(MOD, d);
          await Media.borrar(anterior);
          await refrescar();
          aviso('✅ Logo actualizado.', 'ok');
        } catch (e) { aviso('⚠️ ' + e.message, 'error'); }
      });

      btnQuitar.addEventListener('click', async () => {
        const d = await Store.get(MOD, DEF);
        if (!d.logoId) return;
        const anterior = d.logoId;
        d.logoId = null;
        await Store.set(MOD, d);
        await Media.borrar(anterior);
        await refrescar();
        aviso('Logo eliminado.', 'ok');
      });

      btnGuardar.addEventListener('click', async () => {
        const nuevo = Util.limpiarTexto(inputNombre.value, NOMBRE_MAX);
        if (!nuevo) { aviso('⚠️ Escribe el nombre del negocio.', 'error'); return; }
        try {
          const d = await Store.get(MOD, DEF);
          d.nombre = nuevo;
          await Store.set(MOD, d);
          inputNombre.value = nuevo;
          await refrescar();
          aviso('✅ Nombre guardado.', 'ok');
        } catch (e) { aviso('⚠️ ' + e.message, 'error'); }
      });

      cuerpo.append(
        preview,
        inputArchivo,
        Util.el('div', { class: 'adm-acciones' }, btnCambiar, btnQuitar),
        Util.el('div', { class: 'adm-campo' },
          Util.el('label', { class: 'adm-etq', for: 'adm-marca-nombre', text: 'Nombre del negocio' }),
          inputNombre),
        btnGuardar,
        msg
      );
      await refrescar();
    }
  });
})();
</script>

     JS · MÓDULO BANNERS  (frente: slider · autogestión: B. Banners)
     ===================================================================== -->
<script id="js-banners">
(function () {
  'use strict';
  const { Util, Store, Media, Bus } = App;
  const MOD = 'banners';
  const MAX = 6, TEXTO_MAX = 60, TITULO_MAX = 40;
  const PAUSA_MS = 8000, SEG_MIN = 2, SEG_MAX = 15;
  const DEF = { titulo: 'Promociones & Eventos', segundos: 4, items: [] };

  const numeroWa = App.Util.numeroWa;
  // Paso único de datos: el antiguo WhatsApp general se copia a cada publicidad que no tenga número propio
  // y se elimina (cada banner tiene ahora su título y su WhatsApp). Si no hay nada que pasar, no hace nada.
  async function migrarWhatsapp() {
    const d = await Store.get(MOD, DEF);
    if (!('whatsapp' in d)) return;
    if (d.whatsapp) d.items.forEach(b => { if (!b.whatsapp) b.whatsapp = d.whatsapp; });
    delete d.whatsapp;
    await Store.set(MOD, d);
  }
  // Encuadre libre del recorte en el slider, en % (solo visual; la imagen no se modifica).
  // Datos anteriores con "enfoque" (arriba/centro/abajo) se leen como su porcentaje equivalente.
  const encuadreDe = (b) => b.encuadre || { x: 50, y: ({ top: 0, bottom: 100 })[b.enfoque] ?? 50 };
  const posicion = (b) => { const e = encuadreDe(b); return e.x + '% ' + e.y + '%'; };
  // Contenido visual de un banner (slider y vista previa usan lo mismo).
  function lienzo(b, url, alt) {
    if (b.completa) return [Util.el('img', { class: 'banners__fondo', src: url || '', alt: '', 'aria-hidden': 'true' }), Util.el('img', { class: 'banners__completa', src: url || '', alt: alt || '' })];
    return [Util.el('img', { src: url || '', alt: alt || '', style: 'object-position:' + posicion(b) })];
  }


  App.modulo({
    id: MOD,
    slot: 'app-main',
    orden: 20,
    letra: 'B',
    titulo: 'Banner publicitarios slider',

    async montar(raiz) {
      await migrarWhatsapp();
      let actual = 0, total = 0, timer = null, reanudar = null, rotarMs = DEF.segundos * 1000;
      const titulo = Util.el('h2', { class: 'banners__titulo' });
      const pista = Util.el('div', { class: 'banners__pista' });
      const puntos = Util.el('div', { class: 'banners__puntos' });
      const ctrl = Util.el('div', { class: 'banners__ctrl' },
        Util.el('button', { type: 'button', class: 'banners__flecha', 'aria-label': 'Anterior', text: '‹', onclick: () => { pausar(); ir(actual - 1); } }),
        puntos,
        Util.el('button', { type: 'button', class: 'banners__flecha', 'aria-label': 'Siguiente', text: '›', onclick: () => { pausar(); ir(actual + 1); } })
      );
      raiz.className = 'banners';
      raiz.append(titulo, Util.el('div', { class: 'banners__vista' }, pista), ctrl);

      function ir(i) {
        if (!total) return;
        actual = (i + total) % total;
        pista.style.transform = 'translateX(-' + (actual * 100) + '%)';
        [...puntos.children].forEach((p, k) => p.classList.toggle('activo', k === actual));
      }
      function iniciar() { detener(); if (total > 1) timer = setInterval(() => ir(actual + 1), rotarMs); }
      function detener() { clearInterval(timer); timer = null; clearTimeout(reanudar); }
      function pausar() { detener(); reanudar = setTimeout(iniciar, PAUSA_MS); }

      // Abre el banner tocado y permite pasar a los demás (‹ ›) sin salir; al cerrar, el slider queda en el último visto.
      async function verBanner(item, datos) {
        detener();
        const activos = datos.items.filter(b => b.activo && b.imagenId);
        // Cada publicidad escribe a su propio WhatsApp (su área); sin número, no hay botón.
        const galeria = await Promise.all(activos.map(async b => {
          const num = numeroWa(b.whatsapp);
          return { url: await Media.url(b.imagenId), texto: b.texto,
            accion: num ? { texto: 'Contactar al encargado', href: 'https://wa.me/' + num + '?text=' + encodeURIComponent('Hola, me interesa: ' + (b.texto || datos.titulo)), icono: 'whatsapp' } : null };
        }));
        Util.visor({ galeria, inicio: Math.max(0, activos.findIndex(b => b.id === item.id)) }, (k) => { ir(k); pausar(); });
      }

      async function render(datos) {
        detener();
        rotarMs = Math.min(SEG_MAX, Math.max(SEG_MIN, Number(datos.segundos) || DEF.segundos)) * 1000;
        const activos = datos.items.filter(b => b.activo && b.imagenId);
        total = activos.length;
        raiz.classList.toggle('oculto', total === 0);
        titulo.textContent = datos.titulo;
        titulo.classList.toggle('oculto', !datos.titulo);
        const slides = await Promise.all(activos.map(async b => {
          const url = await Media.url(b.imagenId);
          return Util.el('button', { type: 'button', class: 'banners__slide', 'aria-label': b.texto || 'Banner', onclick: () => verBanner(b, datos) },
            ...lienzo(b, url, b.texto),
            b.texto ? Util.el('span', { class: 'banners__texto', text: b.texto }) : null);
        }));
        pista.replaceChildren(...slides);
        puntos.replaceChildren(...activos.map((_, k) => Util.el('button', { type: 'button', class: 'banners__punto', 'aria-label': 'Banner ' + (k + 1), onclick: () => { pausar(); ir(k); } })));
        ctrl.classList.toggle('oculto', total < 2);
        ir(Math.min(actual, Math.max(0, total - 1)));
        iniciar();
      }
      render(await Store.get(MOD, DEF));
      Bus.on('store:' + MOD, d => render(Object.assign({}, DEF, d)));
    },

    async admin(cuerpo) {
      const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
      const aviso = (t, tipo) => Util.mensaje(msg, t, tipo);
      const lista = Util.el('div', { class: 'adm-sec__cuerpo', style: 'padding:0' });
      const inputArchivo = Util.el('input', { type: 'file', accept: 'image/*', class: 'oculto' });
      let destino = null; // id del banner a cambiar, o null = nuevo

      await migrarWhatsapp();
      const datos0 = await Store.get(MOD, DEF);
      const inTitulo = Util.el('input', { type: 'text', class: 'adm-input', maxlength: TITULO_MAX, value: datos0.titulo, id: 'adm-ban-titulo' });
      const inSeg = Util.el('input', { type: 'number', inputmode: 'numeric', class: 'adm-input', min: SEG_MIN, max: SEG_MAX, step: 1, value: datos0.segundos, id: 'adm-ban-seg' });
      const btnAgregar = Util.el('button', { type: 'button', class: 'btn btn--prim' });

      async function guardar(mutar, ok) {
        try {
          const d = await Store.get(MOD, DEF);
          d.items = d.items.slice();
          const r = await mutar(d);
          if (r === false) return;
          await Store.set(MOD, d);
          if (ok) aviso(ok, 'ok');
          await pintar();
        } catch (e) { aviso('⚠️ ' + e.message, 'error'); }
      }

      function tarjeta(b, i, n) {
        const prev = Util.el('div', { class: 'adm-preview-banner' });
        let urlImg = null;
        Media.url(b.imagenId).then(u => { urlImg = u; if (u) prev.append(...lienzo(b, u, '')); });
        const swCompleta = Util.el('input', { type: 'checkbox', checked: !!b.completa,
          onchange: e => guardar(d => { d.items.find(x => x.id === b.id).completa = e.target.checked; }, e.target.checked ? '✅ Se mostrará la imagen completa.' : '✅ Se mostrará con encuadre.') });
        const encuadre = Util.el('div', { class: 'adm-acciones' },
          Util.el('button', { type: 'button', class: 'btn', text: '✋ Ajustar encuadre', disabled: !!b.completa,
            onclick: () => { if (urlImg) Util.encuadre(urlImg, encuadreDe(b), { aspecto: '25/11', nota: 'Arrastra la foto con el dedo hasta que se vea lo importante. Así la verá el cliente en el slider.' }, (enc) => guardar(d => { const it = d.items.find(x => x.id === b.id); it.encuadre = enc; delete it.enfoque; }, '✅ Encuadre guardado.')); } }));
        const inTexto = Util.el('input', { type: 'text', class: 'adm-input', maxlength: TEXTO_MAX, value: b.texto, placeholder: 'Texto sobre la imagen (opcional)' });
        const inWaB = Util.el('input', { type: 'tel', inputmode: 'numeric', class: 'adm-input', value: b.whatsapp || '', placeholder: 'WhatsApp de esta publicidad', 'aria-label': 'WhatsApp del banner ' + (i + 1),
          oninput: e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10); } });
        const sw = Util.el('input', { type: 'checkbox', checked: b.activo,
          onchange: e => guardar(d => { d.items.find(x => x.id === b.id).activo = e.target.checked; }, e.target.checked ? '✅ Banner activado.' : 'Banner desactivado.') });
        const mover = (dir) => guardar(d => { const k = d.items.findIndex(x => x.id === b.id); const j = k + dir; if (j < 0 || j >= d.items.length) return false; [d.items[k], d.items[j]] = [d.items[j], d.items[k]]; }, '✅ Orden actualizado.');
        return Util.el('div', { class: 'adm-item' },
          Util.el('div', { class: 'adm-item__cab' },
            Util.el('span', { class: 'adm-item__num', text: 'Banner ' + (i + 1) }),
            Util.el('div', { class: 'adm-item__orden' },
              Util.el('button', { type: 'button', class: 'adm-mini', 'aria-label': 'Subir', text: '↑', disabled: i === 0, onclick: () => mover(-1) }),
              Util.el('button', { type: 'button', class: 'adm-mini', 'aria-label': 'Bajar', text: '↓', disabled: i === n - 1, onclick: () => mover(1) })
            )
          ),
          prev,
          encuadre,
          Util.el('label', { class: 'adm-switch' }, swCompleta, Util.el('span', { text: 'Mostrar imagen completa (sin recortar)' })),
          Util.el('label', { class: 'adm-switch' }, sw, Util.el('span', { text: 'Visible en la carta' })),
          Util.el('div', { class: 'adm-fila' }, inTexto,
            Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar',
              onclick: () => guardar(d => { d.items.find(x => x.id === b.id).texto = Util.limpiarTexto(inTexto.value, TEXTO_MAX); }, '✅ Texto guardado.') })),
          Util.el('div', { class: 'adm-fila' }, inWaB,
            Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar',
              onclick: () => guardar(d => {
                const v = inWaB.value.replace(/\D/g, '');
                if (v && v.length !== 10) { aviso('⚠️ El WhatsApp debe tener 10 dígitos.', 'error'); return false; }
                d.items.find(x => x.id === b.id).whatsapp = v;
              }, inWaB.value ? '✅ WhatsApp de la publicidad guardado.' : '✅ Esta publicidad queda sin WhatsApp (no muestra botón de contacto).') })),
          Util.el('div', { class: 'adm-acciones' },
            Util.el('button', { type: 'button', class: 'btn', text: 'Cambiar imagen', onclick: () => { destino = b.id; inputArchivo.click(); } }),
            Util.el('button', { type: 'button', class: 'btn btn--peligro', text: 'Eliminar',
              onclick: async () => {
                if (!await Util.confirmar('¿Eliminar este banner?', 'Se borra la imagen y su texto.', 'Eliminar', 'Cancelar')) return;
                await guardar(d => { d.items = d.items.filter(x => x.id !== b.id); }, 'Banner eliminado.');
                await Media.borrar(b.imagenId);
              } })
          )
        );
      }

      async function pintar() {
        const d = await Store.get(MOD, DEF);
        lista.replaceChildren(...d.items.map((b, i) => tarjeta(b, i, d.items.length)));
        btnAgregar.textContent = '＋ Agregar banner (' + d.items.length + '/' + MAX + ')';
        btnAgregar.disabled = d.items.length >= MAX;
      }

      btnAgregar.addEventListener('click', () => { destino = null; inputArchivo.click(); });
      inputArchivo.addEventListener('change', async () => {
        const file = inputArchivo.files[0]; inputArchivo.value = '';
        if (!file) return;
        try {
          aviso('Procesando imagen…', 'ok');
          const imagenId = await Media.guardar(await Util.reducirImagen(file, 1600, 0.82));
          let anterior = null;
          await guardar(d => {
            if (destino) { const b = d.items.find(x => x.id === destino); anterior = b.imagenId; b.imagenId = imagenId; }
            else {
              if (d.items.length >= MAX) throw new Error('Máximo ' + MAX + ' banners.');
              d.items.push({ id: 'b' + Date.now().toString(36), imagenId, texto: '', activo: true });
            }
          }, destino ? '✅ Imagen actualizada.' : '✅ Banner agregado.');
          await Media.borrar(anterior);
        } catch (e) { aviso('⚠️ ' + e.message, 'error'); }
      });

      cuerpo.append(
        Util.el('div', { class: 'adm-campo' },
          Util.el('label', { class: 'adm-etq', for: 'adm-ban-titulo', text: 'Título del slider' }),
          Util.el('div', { class: 'adm-fila' }, inTitulo,
            Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar',
              onclick: () => guardar(d => { d.titulo = Util.limpiarTexto(inTitulo.value, TITULO_MAX); inTitulo.value = d.titulo; }, '✅ Título guardado.') }))),
        Util.el('div', { class: 'adm-campo' },
          Util.el('label', { class: 'adm-etq', for: 'adm-ban-seg', text: 'Rotar cada (segundos)' }),
          Util.el('div', { class: 'adm-fila' }, inSeg,
            Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar',
              onclick: () => guardar(d => {
                const v = parseInt(inSeg.value, 10);
                if (!(v >= SEG_MIN && v <= SEG_MAX)) { aviso('⚠️ Escribe un valor entre ' + SEG_MIN + ' y ' + SEG_MAX + ' segundos.', 'error'); return false; }
                d.segundos = v; inSeg.value = v;
              }, '✅ Rotación guardada.') })),
          Util.el('p', { class: 'adm-nota', text: 'Entre ' + SEG_MIN + ' y ' + SEG_MAX + ' segundos.' })),
        msg,
        lista,
        btnAgregar,
        inputArchivo
      );
      await pintar();
    }
  });
})();

<!-- =====================================================================
     JS · SERVICIO CATÁLOGO  (datos de categorías y productos + tarjeta)
     Sin interfaz propia: lo consumen C, D, E y la carta vía App.servicio('catalogo').
     ===================================================================== -->
<script id="js-catalogo">
(function () {
  'use strict';
  const { Util, Store, Media } = App;
  const DEF_CAT = { items: [] }, DEF_PROD = { items: [] };
  // Promos: categoría especial que reúne productos de cualquier categoría. items: { productoId: % de descuento (0 = precio normal) }.
  const PROMO_ID = '__promos', DESC_MAX = 90;
  const DEF_PROMO = { nombre: '🔥 Promos hoy', vaciarDiario: true, fecha: '', items: {} };
  const hoyClave = () => { const f = new Date(); return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0'); };

  const Catalogo = {
    PROMO_ID, DESC_MAX,
    // Estado de Promos. Con "vaciar al final del día", lo marcado un día anterior se limpia solo.
    async promos() {
      const d = await Store.get('promos', DEF_PROMO);
      if (d.vaciarDiario && d.fecha && d.fecha < hoyClave() && Object.keys(d.items).length) {
        d.items = {}; d.fecha = hoyClave(); await Store.set('promos', d);
      }
      return d;
    },
    async guardarPromos(d) { d.fecha = hoyClave(); await Store.set('promos', d); },
    // Precio vigente (con descuento de promo si lo tiene), redondeado a los $100. Una sola regla para toda la app.
    precio(p, promos) {
      const v = parseInt(p.valor, 10) || 0, d = promos && promos.items[p.id];
      return d > 0 ? Math.round(v * (100 - d) / 10000) * 100 : v;
    },
    async categorias() { return (await Store.get('categorias', DEF_CAT)).items; },
    async guardarCategorias(items) { await Store.set('categorias', { items }); },
    async productos() {
      const ped = App.servicio('pedidos'), res = ped ? await ped.reservas() : {};
      return (await Store.get('productos', DEF_PROD)).items.map(p => ({ ...p, disponibles: Math.max(0, (parseInt(p.stock, 10) || 0) - (res[p.id] || 0)) }));
    },
    async guardarProductos(items) { await Store.set('productos', { items: items.map(({ disponibles, ...p }) => p) }); },
    unidades(p) { return p.disponibles ?? (parseInt(p.stock, 10) || 0); },
    disponible(p) { return this.unidades(p) > 0; },

    // Productos disponibles en el orden de la carta: orden de categorías, luego orden interno.
    async carta() {
      const cats = await this.categorias(), prods = await this.productos();
      const pos = Object.fromEntries(cats.map((c, i) => [c.id, i]));
      return prods
        .map((p, i) => ({ p, i }))
        .filter(x => this.disponible(x.p) && x.p.categoriaId in pos)
        .sort((a, b) => (pos[a.p.categoriaId] - pos[b.p.categoriaId]) || (a.i - b.i))
        .map(x => x.p);
    },

    // Ordena por rotación de ventas (más vendido primero). Sin módulo de ventas aún: conserva el orden recibido.
    async porVentas(lista) {
      const ventas = App.servicio('ventas');
      if (!ventas) return lista;
      const conteo = await ventas.unidadesPorProducto();
      return lista.map((p, i) => ({ p, i, v: conteo[p.id] || 0 })).sort((a, b) => (b.v - a.v) || (a.i - b.i)).map(x => x.p);
    },
    async ranking() { return this.porVentas(await this.carta()); },

    // Todos los productos de una categoría en su orden (manual u automático).
    async ordenCategoria(cat) {
      const propios = (await this.productos()).filter(p => p.categoriaId === cat.id);
      if (cat.orden !== 'manual') return this.porVentas(propios);
      const pos = Object.fromEntries((cat.ordenIds || []).map((id, i) => [id, i]));
      return propios.map((p, i) => ({ p, i, k: id => id in pos ? pos[id] : Infinity }))
        .sort((a, b) => (a.k(a.p.id) - b.k(b.p.id)) || (a.i - b.i)).map(x => x.p);
    },
    // Las categorías ya no llevan imagen: borra las que hubieran quedado guardadas.
    // Foto que acompaña al círculo de la categoría: la propia (D) o, si no tiene, la del primer producto con foto
    // (el más vendido o el del orden manual). En Promos, la del producto con mayor descuento.
    async fotoCategoria(catId) {
      const cat = (await this.categorias()).find(c => c.id === catId);
      if (cat && cat.imagenId) return { imagenId: cat.imagenId, encuadre: cat.encuadre || null };
      const p = (await this.productosDeCategoria(catId)).find(x => x.imagenId);
      return p ? { imagenId: p.imagenId, encuadre: p.encuadre || null } : null;
    },
    // Lo que ve el cliente: solo disponibles. Promos reúne los marcados, en el orden de la carta.
    async productosDeCategoria(catId) {
      if (catId === PROMO_ID) { const pr = await this.promos(); return (await this.carta()).filter(p => p.id in pr.items); }
      const cat = (await this.categorias()).find(c => c.id === catId);
      return cat ? (await this.ordenCategoria(cat)).filter(p => this.disponible(p)) : [];
    },

    // Tarjeta de producto reutilizable (destacados y carta). Sin marcos.
    tarjeta(p, pie) {
      const img = Util.el('div', { class: 'prod__img' });
      const valor = Util.el('p', { class: 'prod__valor', text: Util.precio(p.valor) });
      Media.url(p.imagenId).then(u => {
        if (!u) { img.prepend(Util.el('span', { class: 'prod__inicial', text: (p.nombre || '?').charAt(0).toUpperCase() })); return; }
        // Recorte según el encuadre elegido por el dueño; al tocarla, el cliente la ve completa.
        img.prepend(Util.el('img', { src: u, alt: p.nombre, loading: 'lazy', style: p.encuadre ? 'object-position:' + p.encuadre.x + '% ' + p.encuadre.y + '%' : null }));
        img.classList.add('prod__img--ver');
        img.addEventListener('click', async () => {
          const pr = await this.promos(), vigente = this.precio(p, pr);
          const Carrito = App.servicio('carrito'); // el mismo − 0 + de la tarjeta (mismo carrito, siempre sincronizado)
          Util.visor({ url: u, titulo: p.nombre, texto: p.detalle || '', pie: Carrito ? Carrito.selector(p) : null,
            precio: Util.precio(vigente) + (vigente !== (parseInt(p.valor, 10) || 0) ? '  (antes ' + Util.precio(p.valor) + ')' : '') });
        });
      });
      // Con descuento: precio normal tachado + precio de promo y etiqueta "-N%".
      this.promos().then(pr => {
        const d = pr.items[p.id];
        if (!(d > 0)) return;
        valor.classList.add('prod__valor--promo');
        valor.replaceChildren(Util.el('s', { class: 'prod__antes', text: Util.precio(p.valor) }), Util.el('span', { text: Util.precio(this.precio(p, pr)) }));
        img.append(Util.el('span', { class: 'prod__desc', text: '-' + d + '%' }));
      });
      return Util.el('article', { class: 'prod', 'data-producto': p.id },
        img,
        Util.el('div', { class: 'prod__caja' },
          Util.el('div', { class: 'prod__texto' },
            Util.el('h3', { class: 'prod__nombre', text: p.nombre }),
            p.detalle ? Util.el('p', { class: 'prod__detalle', text: p.detalle }) : null),
          Util.el('div', { class: 'prod__pie' }, valor, pie || null))
      );
    },

    // Miniatura para listas de autogestión.
    miniatura(imagenId, texto, circular) {
      const t = Util.el('div', { class: 'adm-thumb' + (circular ? ' adm-thumb--circ' : '') });
      Media.url(imagenId).then(u => t.replaceChildren(u ? Util.el('img', { src: u, alt: '' }) : (texto || '?').charAt(0).toUpperCase()));
      return t;
    }
  };

  App.servicio('catalogo', Catalogo);
  // Un solo evento para "cambió lo que se puede vender" (inventario o pedidos).
  ['store:productos', 'store:pedidos', 'store:promos'].forEach(ev => App.Bus.on(ev, () => App.Bus.emit('catalogo:cambio')));
})();
</script>
