<script id="js-pedidos">
(function () {
  'use strict';
  const { Util, Store, Bus } = App;
  const Cat = App.servicio('catalogo');
  const MOD = 'pedidos', CONF = 'pedidos-config';
  const DEF = { consecutivo: 0, items: [], banderas: {} };
  const CONF_DEF = { whatsapp: '', banderas: 10, dominio: '', textoQr: 'Escanea y pide tus bebidas' };
  const ACTIVOS = ['pendiente_bandera', 'nuevo', 'preparacion'];
  const ESTADOS = {
    pendiente_bandera: 'Pendiente de bandera', nuevo: 'Nuevos', preparacion: 'En preparación',
    despachado: 'Despachados', cancelado: 'Cancelados', cerrado: 'Ventas cerradas de hoy'
  };
  const numeroWa = App.Util.numeroWa;
  const hora = (iso) => new Date(iso).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });

  let panel = null; // panel de Caja abierto en esta pestaña

  /* ---------- Servicio ---------- */
  // ¿El pedido pertenece a la ocupación actual de su bandera? (cada asignación abre un "ciclo")
  function enBanderaActiva(p, est) {
    const b = p.bandera && est.banderas[p.bandera];
    if (!b) return false;
    if (b.ciclo || p.ciclo) return b.ciclo === p.ciclo;
    return b.nombre === p.nombre; // datos anteriores a los ciclos
  }
  // Regla permanente: un pedido despachado cuya bandera ya no lo acompaña es una venta cerrada.
  function normalizar(est) {
    let cambio = false;
    est.items.forEach(p => {
      if (p.estado === 'despachado' && !enBanderaActiva(p, est)) {
        p.estado = 'cerrado'; p.cerradoEn = p.cerradoEn || p.despachadoEn || new Date().toISOString(); cambio = true;
      }
    });
    return cambio;
  }

  const Pedidos = {
    async estado() {
      const est = await Store.get(MOD, DEF);
      if (normalizar(est)) await Store.set(MOD, est);
      return est;
    },
    async config() { return Store.get(CONF, CONF_DEF); },
    // Unidades apartadas por pedidos aún no despachados ni cancelados.
    async reservas() {
      const r = {};
      (await this.estado()).items.filter(p => ACTIVOS.includes(p.estado))
        .forEach(p => p.lineas.forEach(l => { r[l.productoId] = (r[l.productoId] || 0) + l.cantidad; }));
      return r;
    },
    // Crea el pedido con lo que de verdad hay disponible; devuelve el pedido y el enlace de WhatsApp.
    async crear({ nombre, whatsapp, lineas, bandera }) {
      const H = App.servicio('horario');
      if (H && !(await H.abierto())) throw new Error(await H.textoCerrado());
      const vigentes = (await Cat.productos()), promos = await Cat.promos();
      const porId = Object.fromEntries(vigentes.map(p => [p.id, p]));
      const items = lineas.map(l => {
        const p = porId[l.productoId];
        return p ? { productoId: p.id, nombre: p.nombre, valor: Cat.precio(p, promos), costo: Util.entero(p.costo), cantidad: Math.min(l.cantidad, Cat.unidades(p)), nota: l.nota || '' } : null;
      }).filter(l => l && l.cantidad > 0);
      if (!items.length) throw new Error('Los productos de tu pedido ya no están disponibles.');
      const est = await this.estado();
      const enUso = bandera && est.banderas[bandera];
      est.consecutivo += 1;
      const pedido = {
        id: 'o' + Date.now().toString(36), numero: 'P-' + String(est.consecutivo).padStart(4, '0'),
        fecha: new Date().toISOString(), nombre: nombre || (enUso ? enUso.nombre : ''), whatsapp, lineas: items,
        total: items.reduce((a, l) => a + l.valor * l.cantidad, 0),
        // Desde el QR de una bandera en uso: llega directo a "Nuevos" con su bandera.
        estado: enUso ? 'nuevo' : 'pendiente_bandera', bandera: enUso ? bandera : null
      };
      if (enUso) pedido.ciclo = enUso.ciclo;
      if (!pedido.nombre) throw new Error('Escribe tu nombre para atenderte.');
      est.items.push(pedido);
      await Store.set(MOD, est);
      return pedido;
    },
    async enlaceWhatsApp(pedido) {
      const num = numeroWa((await this.config()).whatsapp);
      if (!num) return null;
      const negocio = await App.servicio('marca').nombre();
      const txt = ['Pedido ' + pedido.numero + (negocio ? ' — ' + negocio : ''),
        'Cliente: ' + pedido.nombre + (pedido.whatsapp ? ' (' + pedido.whatsapp + ')' : ''), '',
        ...pedido.lineas.flatMap(l => [l.cantidad + ' x ' + l.nombre + ' — ' + Util.precio(l.valor * l.cantidad)].concat(l.nota ? ['   Nota: ' + l.nota] : [])),
        '', 'TOTAL: ' + Util.precio(pedido.total)].join('\n');
      return 'https://wa.me/' + num + '?text=' + encodeURIComponent(txt);
    },
    // Mensajes al cliente (una sola fuente de texto). aviso: 'preparacion' | 'listo' | 'despachado' (por defecto, el estado).
    mensajeCliente(p, aviso = p.estado) {
      const band = p.bandera ? ' 🚩 Bandera #' + String(p.bandera).padStart(2, '0') : '';
      if (aviso === 'listo') return '🎉 ¡Listo, ' + p.nombre + '! Tu pedido ' + p.numero + ' ya está preparado. Puedes recogerlo en la barra o te lo llevamos' + (band ? ' a tu' + band : '') + '.';
      if (aviso === 'preparacion') return '☕ Hola ' + p.nombre + ', tu pedido ' + p.numero + ' ya está en preparación.' + (band ? band + '.' : '') + ' ¡En un momento te lo llevamos!';
      if (aviso === 'despachado') return '🎉 ¡Listo, ' + p.nombre + '! Tu pedido ' + p.numero + ' ya está preparado y va para tu mesa' + band + '. Si prefieres, recógelo en la barra. ¡Buen provecho!';
      return null;
    },
    // Enlace para avisar al cliente por WhatsApp (lo envía el asesor con un toque).
    enlaceAvisoCliente(p, aviso) {
      const num = numeroWa(p.whatsapp), txt = this.mensajeCliente(p, aviso);
      return num && txt ? 'https://wa.me/' + num + '?text=' + encodeURIComponent(txt) : null;
    },
    // Deja constancia del aviso enviado por WhatsApp (la Caja muestra el siguiente).
    async marcarAviso(pedidoId, aviso) {
      const est = await this.estado(), ped = est.items.find(p => p.id === pedidoId);
      if (!ped) return;
      ped.avisos = Object.assign({}, ped.avisos, { [aviso]: new Date().toISOString() });
      await Store.set(MOD, est);
    },
    cajaAbierta() { return !!panel; },
    // Comprobante como imagen PNG (Blob).
    async comprobanteBlob(p) {
      const negocio = await App.servicio('marca').nombre();
      const W = 600, pad = 36, lh = 30;
      const filas = [];
      p.lineas.forEach(l => { filas.push({ izq: l.cantidad + ' × ' + l.nombre, der: Util.precio(l.valor * l.cantidad) }); if (l.nota) filas.push({ izq: '   Nota: ' + l.nota, nota: true }); });
      const H = 300 + filas.length * lh + 90;
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const g = c.getContext('2d');
      const fuente = (peso, tam) => peso + ' ' + tam + 'px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
      const recortar = (txt, max) => { let t = txt; while (g.measureText(t).width > max && t.length > 1) t = t.slice(0, -2) + '…'; return t; };
      g.fillStyle = '#FBF6EF'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#E8762E'; g.fillRect(0, 0, W, 96);
      g.fillStyle = '#FFFFFF'; g.textAlign = 'center'; g.font = fuente(900, 28); g.fillText(recortar(negocio, W - 2 * pad), W / 2, 58);
      g.fillStyle = '#5A2E22'; g.font = fuente(800, 22); g.fillText('Comprobante de pedido', W / 2, 140);
      g.fillStyle = '#E8762E'; g.font = fuente(900, 40); g.fillText(p.numero, W / 2, 190);
      g.fillStyle = '#8A7568'; g.font = fuente(400, 18);
      g.fillText(new Date(p.fecha).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }) + ' · ' + p.nombre, W / 2, 222);
      let y = 270; g.textAlign = 'left';
      filas.forEach(f => {
        g.font = f.nota ? fuente(700, 16) : fuente(400, 19); g.fillStyle = f.nota ? '#C9601E' : '#3A2A24';
        g.fillText(recortar(f.izq, W - 2 * pad - (f.der ? 140 : 0)), pad, y);
        if (f.der) { g.textAlign = 'right'; g.fillText(f.der, W - pad, y); g.textAlign = 'left'; }
        y += lh;
      });
      g.strokeStyle = '#F3EAE0'; g.lineWidth = 2; g.beginPath(); g.moveTo(pad, y - 10); g.lineTo(W - pad, y - 10); g.stroke();
      g.font = fuente(900, 24); g.fillStyle = '#5A2E22'; g.fillText('Total a pagar', pad, y + 22);
      g.textAlign = 'right'; g.fillStyle = '#E8762E'; g.fillText(Util.precio(p.total), W - pad, y + 22);
      g.textAlign = 'center'; g.fillStyle = '#5A2E22'; g.font = fuente(700, 18); g.fillText('¡Gracias por tu pedido!', W / 2, y + 66);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      if (!blob) throw new Error('No se pudo generar la imagen.');
      return blob;
    },
    async descargarComprobante(p) {
      const blob = await this.comprobanteBlob(p);
      const a = Util.el('a', { href: URL.createObjectURL(blob), download: 'comprobante-' + p.numero + '.png' });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    },
    // ¿El celular permite compartir archivos (guardar en galería, WhatsApp…)?
    puedeCompartir() {
      try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'c.png', { type: 'image/png' })] })); } catch (e) { return false; }
    },
    async compartirComprobante(p) {
      const archivo = new File([await this.comprobanteBlob(p)], 'comprobante-' + p.numero + '.png', { type: 'image/png' });
      try { await navigator.share({ files: [archivo], title: 'Comprobante ' + p.numero }); return true; }
      catch (e) { if (e && e.name === 'AbortError') return false; throw new Error('No se pudo compartir el comprobante.'); }
    },
    // Bandera en uso (o null) y la cuenta acumulada de su ocupación actual.
    async banderaActiva(n) {
      const b = n && (await this.estado()).banderas[n];
      return b ? { n, nombre: b.nombre, ciclo: b.ciclo } : null;
    },
    async cuentaBandera(n) {
      const est = await this.estado(), b = est.banderas[n];
      if (!b) return { pedidos: [], total: 0 };
      const pedidos = est.items.filter(p => p.estado !== 'cancelado' && enBanderaActiva(p, est) && p.bandera === n);
      return { pedidos, total: pedidos.reduce((a, p) => a + p.total, 0) };
    },
    // Dirección que lleva el QR de cada bandera (dominio del negocio o, en pruebas, este mismo archivo).
    async urlBandera(n) {
      return (await this.urlBase()) + '?b=' + String(n).padStart(2, '0');
    },
    // Dirección pública de la carta (dominio del negocio o, en pruebas, este mismo archivo), sin bandera ni ancla.
    async urlBase() {
      const dom = (await this.config()).dominio.trim().replace(/\/+$/, '');
      return dom ? (/^https?:\/\//.test(dom) ? dom : 'https://' + dom) + '/' : location.href.split('#')[0].split('?')[0];
    },
    /* ---- Cartera: créditos, pérdidas y cancelados en espera ---- */
    // Cancelado en espera: puede volver a la Caja. Descartado: queda solo como línea informativa en el libro (K).
    async descartar(id) {
      const est = await this.estado(), p = est.items.find(x => x.id === id);
      if (!p || p.estado !== 'cancelado' || p.descartadoEn) throw new Error('El pedido ya no está entre los cancelados.');
      p.descartadoEn = new Date().toISOString();
      await Store.set(MOD, est);
    },
    async reactivar(id) {
      const est = await this.estado(), p = est.items.find(x => x.id === id);
      if (!p || p.estado !== 'cancelado' || p.descartadoEn) throw new Error('El pedido ya no está entre los cancelados.');
      const prods = await Cat.productos();
      const falta = p.lineas.find(l => { const x = prods.find(q => q.id === l.productoId); return !x || Cat.unidades(x) < l.cantidad; });
      if (falta) throw new Error('No hay inventario suficiente de ' + falta.nombre + ' para reactivar ' + p.numero + '.');
      // Vuelve con su bandera si sigue siendo suya; si no, a "Pendiente de bandera".
      if (enBanderaActiva(p, est)) p.estado = 'nuevo';
      else { p.estado = 'pendiente_bandera'; p.bandera = null; delete p.ciclo; }
      p.reactivadoEn = new Date().toISOString();
      await Store.set(MOD, est);
    },
    async pasarAPerdida(id, obs, asesor) {
      const est = await this.estado(), p = est.items.find(x => x.id === id);
      const o = Util.limpiarTexto(obs, 160), a = Util.limpiarTexto(asesor, 40);
      if (!o || !a) throw new Error('Escribe el motivo y tu nombre.');
      const Cob = App.servicio('cobros');
      if (!p || p.estado === 'cancelado' || (Cob && (await Cob.pagados()).has(p.id))) throw new Error('El pedido ya no está por cobrar.');
      p.cuenta = { tipo: 'perdida', obs: o, asesor: a, fecha: new Date().toISOString(), antes: p.cuenta || null };
      await Store.set(MOD, est);
    },
    async banderasLibres() {
      const conf = await this.config(), est = await this.estado();
      const libres = [];
      for (let n = 1; n <= conf.banderas; n++) if (!est.banderas[n]) libres.push(n);
      return libres;
    },
    async asignarBandera(pedidoId, n) {
      const est = await this.estado(), ped = est.items.find(p => p.id === pedidoId);
      if (!ped || ped.estado !== 'pendiente_bandera') throw new Error('El pedido ya no está pendiente.');
      if (est.banderas[n] && est.banderas[n].nombre !== ped.nombre) throw new Error('La bandera #' + n + ' ya está en uso.');
      est.banderas[n] = est.banderas[n] || { desde: new Date().toISOString(), nombre: ped.nombre, ciclo: 'k' + Date.now().toString(36) };
      ped.bandera = n; ped.ciclo = est.banderas[n].ciclo; ped.estado = 'nuevo';
      await Store.set(MOD, est);
    },
    async cambiarEstado(pedidoId, nuevo) {
      const est = await this.estado(), ped = est.items.find(p => p.id === pedidoId);
      if (!ped || !ACTIVOS.includes(ped.estado)) throw new Error('El pedido ya fue cerrado.');
      const Cob = App.servicio('cobros');
      if (nuevo === 'cancelado' && Cob && (await Cob.pagados()).has(ped.id)) throw new Error(ped.numero + ' ya está pagado: no se puede cancelar.');
      if (nuevo === 'despachado') {
        // La venta descuenta el inventario real y queda en el kardex; la reserva se libera al dejar de estar activo.
        const Inv = App.servicio('inventario');
        if (Inv) await Inv.venta(ped);
        else {
          const prods = (await Cat.productos());
          ped.lineas.forEach(l => { const p = prods.find(x => x.id === l.productoId); if (p) p.stock = Math.max(0, (parseInt(p.stock, 10) || 0) - l.cantidad); });
          await Cat.guardarProductos(prods);
        }
      }
      ped.estado = nuevo; ped[nuevo + 'En'] = new Date().toISOString();
      await Store.set(MOD, est);
    },
    // Liberar la bandera = el cliente se retiró: sus pedidos despachados quedan cerrados (atención terminada).
    // Pedidos de la ocupación actual de una bandera que aún no están pagados.
    async sinPagar(n) {
      const est = await this.estado(), Cob = App.servicio('cobros'), pagados = Cob ? await Cob.pagados() : new Map();
      return est.items.filter(p => p.bandera === n && p.estado !== 'cancelado' && enBanderaActiva(p, est) && !pagados.has(p.id));
    },
    // Con saldo pendiente se exige qué pasó: { tipo: 'fiado' | 'perdida', obs, asesor }. Queda en cada pedido sin pagar.
    async liberarBandera(n, decision) {
      const antes = await this.estado();
      const activos = antes.items.filter(p => p.bandera === n && ACTIVOS.includes(p.estado)).length;
      if (activos) throw new Error('La bandera #' + n + ' tiene ' + activos + ' pedido(s) sin despachar.');
      const pend = await this.sinPagar(n);
      if (pend.length) {
        const d = decision || {}, obs = Util.limpiarTexto(d.obs, 160), asesor = Util.limpiarTexto(d.asesor, 40);
        if (!['fiado', 'perdida'].includes(d.tipo) || !obs || !asesor) throw new Error('La bandera tiene saldo: indica qué pasó, la observación y tu nombre.');
        const fecha = new Date().toISOString(), ids = new Set(pend.map(p => p.id));
        const e = await this.estado();
        e.items.forEach(p => { if (ids.has(p.id)) p.cuenta = { tipo: d.tipo, obs, asesor, fecha }; });
        await Store.set(MOD, e);
      }
      const est = await this.estado();
      const abiertos = est.items.filter(p => p.bandera === n && ACTIVOS.includes(p.estado)).length;
      if (abiertos) throw new Error('La bandera #' + n + ' tiene ' + abiertos + ' pedido(s) sin despachar.');
      const cerrados = est.items.filter(p => p.bandera === n && p.estado === 'despachado').length;
      delete est.banderas[n];
      normalizar(est); // al soltar la bandera, sus despachados quedan cerrados por la regla única
      await Store.set(MOD, est);
      return cerrados;
    }
  };
  App.servicio('pedidos', Pedidos);

  /* ---------- Sonido de aviso (sin archivos externos) ---------- */
  let audio = null;
  function sonar() {
    if (!audio) return;
    [0, 0.22].forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.18);
      o.connect(g).connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.2);
    });
  }

  /* ---------- Panel de Caja ---------- */
  let vistos = null;
  // Cajas acordeón: qué pedidos ya vio el asesor en cada caja (para la burbuja "+N" de pedidos nuevos).
  const CON_AVISO = ['pendiente_bandera', 'nuevo', 'preparacion', 'despachado'];
  let vistosGrupo = null;
  const iniciarVistosGrupo = (est) => { vistosGrupo = Object.fromEntries(CON_AVISO.map(c => [c, new Set(est.items.filter(p => p.estado === c).map(p => p.id))])); };
  async function abrirCaja() {
    if (panel) return;
    panel = Util.hoja('🧾 Caja', () => { panel = null; Util.quitarAvisosInternos(); Bus.emit('caja:cerrada'); });
    const cuerpo = panel.cuerpo;
    // Cobros es opcional para la Caja: si el módulo no está, la Caja funciona igual sin pagos.
    const Cob = () => App.servicio('cobros');
    const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
    const aviso = (t, tipo) => Util.mensaje(msg, t, tipo);
    const turno = Util.el('span', { class: 'caja-turno' });
    const btnTurno = Util.el('button', { type: 'button', class: 'btn btn--prim', text: '🔔 Iniciar turno',
      onclick: async () => {
        try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); await audio.resume(); sonar(); } catch (e) { aviso('⚠️ Este navegador no permite sonido.', 'error'); }
        pintarTurno();
      } });
    const pintarTurno = () => { const on = !!audio && audio.state === 'running'; btnTurno.classList.toggle('oculto', on); turno.textContent = on ? '🔔 Turno activo: sonará con cada pedido nuevo' : ''; };
    const zona = Util.el('div', { class: 'hoja__cuerpo', style: 'padding:0' });
    cuerpo.append(Util.el('div', { class: 'caja-top' }, btnTurno, turno,
      Cob() ? Util.el('button', { type: 'button', class: 'btn', text: '📊 Cerrar caja', onclick: () => Cob().abrirCierre() }) : null), msg, zona);
    pintarTurno();

    // Cajas de trabajo (Pendiente → Nuevos → En preparación → Despachados): se abren solas cuando les entra un pedido
    // y se cierran solas cuando quedan vacías. El asesor puede cerrarlas a mano; una caja cerrada a mano solo se
    // vuelve a abrir si le entra un pedido nuevo. Las de consulta se abren y cierran solo a mano.
    const abiertas = new Set(), previos = {};
    const alternar = (clave) => { abiertas.has(clave) ? abiertas.delete(clave) : abiertas.add(clave); pintar(); };
    const accion = async (fn, ok) => { try { await fn(); if (ok) aviso(ok, 'ok'); } catch (e) { aviso('⚠️ ' + e.message, 'error'); } };

    function tarjeta(p, libres, nuevo, pagados, listas) {
      const acciones = Util.el('div', { class: 'adm-acciones' });
      const pagado = pagados && pagados.get(p.id);
      const perdida = p.cuenta && p.cuenta.tipo === 'perdida';
      const cobrable = Cob() && !pagado && p.estado !== 'cancelado' && !perdida;
      // Entregado y sin pagar: lo urgente es cobrar (tarjeta en rojo y Cobrar de primero).
      const debe = cobrable && p.estado === 'despachado';
      const btnCobrar = cobrable ? Util.el('button', { type: 'button', class: 'btn btn--prim', text: '💵 Cobrar', onclick: () => Cob().abrirCobro([p.id], 'Cobrar ' + p.numero) }) : null;
      if (debe) acciones.append(btnCobrar);
      if (p.estado === 'pendiente_bandera') {
        // Elegir la bandera pide confirmación (Sí / No); con No la lista vuelve a quedar sin elegir.
        const sel = Util.el('select', { class: 'adm-input adm-select', 'aria-label': 'Bandera para ' + p.numero,
          onchange: async () => {
            const n = parseInt(sel.value, 10);
            if (!n) return;
            if (!await Util.confirmar('¿Asignar 🚩 #' + String(n).padStart(2, '0') + ' a ' + p.numero + '?', '', 'Sí', 'No')) { sel.value = ''; return; }
            accion(() => Pedidos.asignarBandera(p.id, n), '✅ Bandera asignada a ' + p.numero + '.');
          } },
          Util.el('option', { value: '', text: libres.length ? '— Elige bandera —' : 'Sin banderas libres' }),
          libres.map(n => Util.el('option', { value: n, text: '🚩 #' + String(n).padStart(2, '0') })));
        acciones.append(sel);
      }
      if (p.estado === 'nuevo') acciones.append(Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'En preparación', onclick: () => accion(() => Pedidos.cambiarEstado(p.id, 'preparacion')) }));
      // Ya entregado no hay nada que avisar; antes, el aviso va por WhatsApp (o se informa que no dejó número).
      // En preparación el aviso va en dos pasos: "en preparación" y luego "listo" (recoger en barra o se lo llevan).
      if (p.estado === 'preparacion') {
        const av = p.avisos || {}, paso = !av.preparacion ? 'preparacion' : !av.listo ? 'listo' : null;
        const avisoWa = paso && Pedidos.enlaceAvisoCliente(p, paso);
        if (!Pedidos.enlaceAvisoCliente(p, 'listo')) acciones.append(Util.el('p', { class: 'ped__sinwa', text: '📵 El cliente no dejó WhatsApp' }));
        else if (avisoWa) acciones.append(Util.el('a', { class: 'btn', href: avisoWa, target: '_blank', rel: 'noopener', style: 'text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center',
          text: paso === 'preparacion' ? '📲 Avisar: en preparación' : '✅ Preparado · avisar al cliente', onclick: () => Pedidos.marcarAviso(p.id, paso) }));
        else acciones.append(Util.el('p', { class: 'ped__sinwa', text: '✔️ Cliente avisado: listo' }));
      }
      if (p.estado === 'preparacion') acciones.append(Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Despachar', onclick: () => accion(() => Pedidos.cambiarEstado(p.id, 'despachado'), '✅ ' + p.numero + ' despachado.') }));
      if (cobrable && !debe) acciones.append(btnCobrar);
      if (ACTIVOS.includes(p.estado) && !pagado) acciones.append(Util.el('button', { type: 'button', class: 'btn btn--peligro', text: 'Cancelar',
        onclick: async () => { if (await Util.confirmar('¿Cancelar ' + p.numero + '?', 'Se libera el inventario apartado. Queda en Cartera → Pedidos cancelados (sin entregar), por si el cliente vuelve.', 'Cancelar pedido', 'Volver')) accion(() => Pedidos.cambiarEstado(p.id, 'cancelado'), p.numero + ' cancelado · quedó en Cartera.'); } }));
      return Util.el('div', { class: 'ped ped--' + p.estado + (debe ? ' ped--debe' : '') + (nuevo ? ' ped--llegado' : ''), 'data-pedido': p.id },
        Util.el('div', { class: 'ped__cab' },
          Util.el('span', { class: 'ped__num', text: p.numero }),
          Util.el('span', { class: 'ped__band' + (p.bandera ? '' : ' ped__band--sin'), text: p.bandera ? '🚩 #' + String(p.bandera).padStart(2, '0') : 'Sin bandera' })),
        Util.el('span', { class: 'ped__cliente', text: '👤 ' + p.nombre + (p.whatsapp ? ' · ' + p.whatsapp : '') }),
        Util.el('span', { class: 'ped__meta', text: 'Recibido ' + hora(p.fecha) }),
        Util.el('div', { class: 'ped__lineas' }, p.lineas.flatMap(l => [
          Util.el('div', { class: 'ped__linea' }, Util.el('span', { text: l.cantidad + ' × ' + l.nombre }), Util.el('span', { text: Util.precio(l.valor * l.cantidad) })),
          l.nota ? Util.el('div', { class: 'ped__nota', text: '📝 ' + l.nota }) : null])),
        Util.el('div', { class: 'ped__total' }, Util.el('span', { text: 'Total' }), Util.el('span', { text: Util.precio(p.total) })),
        p.estado === 'despachado' && listas && listas.has(p.bandera) ? Util.el('span', { class: 'ped__recoger', text: '🚩 Pendiente: recoger bandera #' + String(p.bandera).padStart(2, '0') + ' al retirarse' }) : null,
        pagados && p.estado !== 'cancelado' ? Util.el('span', { class: 'pago ' + (pagado ? 'pago--ok' : 'pago--pend'), text: pagado ? '🟢 Pagado · ' + (ACTIVOS.includes(p.estado) ? 'solo entregar' : pagado.numero) + ' · ' + Cob().mediosDe(pagado)
          : perdida ? '⚫ Pérdida' : p.cuenta ? '🔴 Por cobrar (crédito)' : '🔴 Por cobrar' }) : null,
        p.cuenta && !pagado ? Util.el('span', { class: 'ped__meta', text: '📝 ' + p.cuenta.obs + ' · ' + p.cuenta.asesor + ' · ' + hora(p.cuenta.fecha) }) : null,
        acciones.childElementCount ? acciones : null);
    }

    // Bandera con saldo: el asesor deja constancia de qué pasó (crédito o pérdida), con observación y su nombre.
    async function liberarConSaldo(n, cliente, pend, deuda) {
      const num = String(n).padStart(2, '0');
      const h = Util.hoja('🚩 Liberar bandera #' + num);
      const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
      let tipo = null;
      const opcion = (t, txt) => Util.el('button', { type: 'button', class: 'btn', 'data-tipo': t, text: txt, onclick: () => {
        tipo = t; opciones.querySelectorAll('.btn').forEach(b => b.classList.toggle('btn--prim', b.dataset.tipo === t)); } });
      const opciones = Util.el('div', { class: 'adm-acciones' }, opcion('fiado', '🔴 Queda por cobrar (crédito)'), opcion('perdida', '⚫ Pérdida (no pagó / se fue)'));
      const inObs = Util.el('textarea', { class: 'adm-input', rows: 3, maxlength: 160, placeholder: 'Ej: Es el vecino del local 12, paga mañana', id: 'lib-obs' });
      const inAsesor = Util.el('input', { type: 'text', class: 'adm-input', maxlength: 40, placeholder: 'Ej: Carolina', id: 'lib-asesor', value: (await Store.get('asesor', { nombre: '' })).nombre });
      h.cuerpo.append(
        Util.el('div', { class: 'cob-resumen' },
          Util.el('span', { class: 'ped__cliente', text: '👤 ' + cliente }),
          ...pend.map(p => Util.el('div', { class: 'ped__linea' }, Util.el('span', { text: p.numero }), Util.el('span', { text: Util.precio(p.total) }))),
          Util.el('div', { class: 'cob-total' }, Util.el('span', { text: 'Saldo sin pagar' }), Util.el('span', { text: Util.precio(deuda) }))),
        Util.el('span', { class: 'adm-etq', text: '¿Qué pasó? *' }), opciones,
        Util.el('div', { class: 'adm-campo' }, Util.el('label', { class: 'adm-etq', for: 'lib-obs', text: 'Observación *' }), inObs),
        Util.el('div', { class: 'adm-campo' }, Util.el('label', { class: 'adm-etq', for: 'lib-asesor', text: 'Tu nombre (asesor) *' }), inAsesor),
        msg,
        Util.el('div', { class: 'adm-acciones' },
          Util.el('button', { type: 'button', class: 'btn', text: 'Cancelar', onclick: () => h.cerrar() }),
          Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Liberar bandera', onclick: async () => {
            if (!tipo) return Util.mensaje(msg, '⚠️ Elige qué pasó.', 'error');
            if (!inObs.value.trim()) return Util.mensaje(msg, '⚠️ Escribe la observación.', 'error');
            if (!inAsesor.value.trim()) return Util.mensaje(msg, '⚠️ Escribe tu nombre.', 'error');
            try {
              await Store.set('asesor', { nombre: Util.limpiarTexto(inAsesor.value, 40) });
              const c = await Pedidos.liberarBandera(n, { tipo, obs: inObs.value, asesor: inAsesor.value });
              h.cerrar();
              aviso('✅ Bandera #' + num + ' libre · ' + (tipo === 'perdida' ? 'registrada como pérdida' : 'queda por cobrar') + ' (' + Util.precio(deuda) + ').' + (c ? ' Venta cerrada (' + c + (c === 1 ? ' pedido).' : ' pedidos).') : ''), 'ok');
            } catch (e) { Util.mensaje(msg, '⚠️ ' + e.message, 'error'); }
          } })));
    }

    async function pintar() {
      const est = await Pedidos.estado(), libres = await Pedidos.banderasLibres();
      CON_AVISO.forEach(c => {
        const ids = est.items.filter(p => p.estado === c).map(p => p.id), antes = previos[c];
        if (!ids.length) abiertas.delete(c);
        else if (!antes || ids.some(id => !antes.has(id))) abiertas.add(c);
        previos[c] = new Set(ids);
      });
      const pagados = Cob() ? await Cob().pagados() : null;
      // Saldo de cada bandera en uso: pedidos de su ocupación actual aún sin cobrar.
      const deBandera = (n) => est.items.filter(p => p.bandera === n && p.estado !== 'cancelado' && enBanderaActiva(p, est));
      const saldo = (n) => deBandera(n).filter(p => pagados && !pagados.has(p.id));
      // Bandera lista para recoger: todos sus pedidos entregados y pagados (el cliente puede irse o pedir más).
      const listas = new Set(Object.keys(est.banderas).map(Number).filter(n => {
        const ps = deBandera(n);
        return ps.length && ps.every(p => p.estado === 'despachado' && (!pagados || pagados.has(p.id)));
      }));
      const recientes = new Set(est.items.map(p => p.id));
      const llegados = vistos ? est.items.filter(p => !vistos.has(p.id)) : [];
      if (llegados.length) sonar();
      vistos = recientes;
      if (!vistosGrupo) iniciarVistosGrupo(est);
      // Caja acordeón (mismo estilo que Autogestión). El contenido solo se arma si está abierta.
      const caja = (clave, titulo, cantidad, contenido) => {
        const ids = CON_AVISO.includes(clave) ? est.items.filter(p => p.estado === clave).map(p => p.id) : [];
        const on = abiertas.has(clave);
        if (on && vistosGrupo[clave]) ids.forEach(id => vistosGrupo[clave].add(id)); // a la vista = visto
        const nuevos = vistosGrupo[clave] ? ids.filter(id => !vistosGrupo[clave].has(id)).length : 0;
        return Util.el('div', { class: 'adm-sec caja-sec' + (on ? ' abierta' : '') + (cantidad ? '' : ' caja-sec--vacia'), 'data-grupo': clave },
          Util.el('button', { type: 'button', class: 'adm-sec__btn', 'aria-expanded': String(on), onclick: () => alternar(clave) },
            Util.el('span', { class: 'adm-sec__nombre', text: titulo }),

<script id="js-mesa">
(function () {

          Util.el('div', { class: 'ped__lineas' }, p.lineas.map(l => Util.el('div', { class: 'ped__linea' }, Util.el('span', { text: l.cantidad + ' × ' + l.nombre }), Util.el('span', { text: Util.precio(l.valor * l.cantidad) })))),
          Util.el('div', { class: 'ped__total' }, Util.el('span', { text: 'Subtotal' }), Util.el('span', { text: Util.precio(p.total) }))))

<!-- =====================================================================
     JS · MÓDULO COBROS  (servicio de pagos · hoja de cobro con pago mixto · autogestión: I. Cobros)
     Venta (despacho) y cobro (pago) van separados. Cada cobro cubre uno o varios pedidos y
     se reparte entre medios de pago; solo se registra si la suma cuadra exacto con el total.
     ===================================================================== -->
<script id="js-cobros">
(function () {
  'use strict';
  const { Util, Store, Media } = App;
  const MOD = 'cobros', CONF = 'cobros-config';
  const DEF = { consecutivo: 0, items: [], cierres: [], consecutivoCierre: 0 };
  // datos: por medio digital, la cuenta y el QR que el dueño descarga de su app bancaria. { medio: { cuenta, titular, nota, qrId } }
  const CONF_DEF = { medios: ['Efectivo', 'Transferencia', 'Nequi', 'Daviplata', 'Datáfono'], datos: {} };
  const DATO_MAX = 40;
  const EFECTIVO = 'Efectivo';
  const MEDIO_MAX = 24;
  const Ped = () => App.servicio('pedidos');

  const Cobros = {
    async config() { return Store.get(CONF, CONF_DEF); },
    async datos() { return Store.get(MOD, DEF); },
    // pedidoId → cobro que lo pagó.
    async pagados() {
      const m = new Map();
      (await this.datos()).items.forEach(c => c.pedidoIds.forEach(id => m.set(id, c)));
      return m;
    },
    // Medios vigentes con datos para pagar (cuenta o QR), en el orden de la lista.
    async datosPago() {
      const c = await this.config();
      return c.medios.map(m => Object.assign({ medio: m }, c.datos[m])).filter(x => x.cuenta || x.qrId);
    },
    // Pantalla completa para mostrar al cliente: QR, cuenta y (si se da) el total a pagar.
    async verPago(d, total) {
      Util.visor({ url: await Media.url(d.qrId), texto: [d.medio, d.cuenta, d.titular, d.nota, total ? 'Total a pagar: ' + Util.precio(total) : ''].filter(Boolean).join(' · ') });
    },
    // Medios usados en un cobro, para mostrarlos ("Efectivo + Nequi").
    mediosDe(c) { return c.partes.map(x => x.medio).join(' + '); },
    // Registra el cobro. partes: [{ medio, valor }]. pagaCon: billete recibido en efectivo (opcional, para las vueltas).
    async cobrar(pedidoIds, partes, pagaCon) {
      const est = await Ped().estado(), pagados = await this.pagados(), medios = (await this.config()).medios;
      const pedidos = pedidoIds.map(id => est.items.find(p => p.id === id));
      if (!pedidos.length || pedidos.some(p => !p)) throw new Error('El pedido ya no existe.');
      const yaPago = pedidos.find(p => pagados.has(p.id));
      if (yaPago) throw new Error(yaPago.numero + ' ya fue cobrado (' + pagados.get(yaPago.id).numero + ').');
      const anulado = pedidos.find(p => p.estado === 'cancelado');
      if (anulado) throw new Error(anulado.numero + ' está cancelado.');
      const perdido = pedidos.find(p => p.cuenta && p.cuenta.tipo === 'perdida');
      if (perdido) throw new Error(perdido.numero + ' quedó como pérdida.');
      const total = pedidos.reduce((a, p) => a + p.total, 0);
      const validas = partes.map(x => ({ medio: x.medio, valor: parseInt(x.valor, 10) || 0 })).filter(x => x.valor > 0);
      if (validas.some(x => !medios.includes(x.medio))) throw new Error('Medio de pago no válido.');
      const suma = validas.reduce((a, x) => a + x.valor, 0);
      if (suma !== total) throw new Error('La suma (' + Util.precio(suma) + ') debe ser igual al total (' + Util.precio(total) + ').');
      const efectivo = validas.filter(x => x.medio === EFECTIVO).reduce((a, x) => a + x.valor, 0);
      const recibe = parseInt(pagaCon, 10) || 0;
      if (recibe && recibe < efectivo) throw new Error('El efectivo recibido no alcanza para ' + Util.precio(efectivo) + '.');
      const d = await this.datos();
      d.consecutivo += 1;
      const cobro = {
        id: 'k' + Date.now().toString(36), numero: 'C-' + String(d.consecutivo).padStart(4, '0'), fecha: new Date().toISOString(),
        pedidoIds: pedidos.map(p => p.id), pedidos: pedidos.map(p => p.numero), total, partes: validas,
        pagaCon: recibe || null, vueltas: recibe ? recibe - efectivo : 0
      };
      d.items.push(cobro);
      await Store.set(MOD, d);
      return cobro;
    },
    // Hoja de cobro: un campo por medio de pago; tocar el nombre del medio pone ahí lo que falta.
    // Antes de registrar, el asesor valida el medio de pago (Sí, cobrar / Corregir).
    async abrirCobro(pedidoIds, titulo) {
      const est = await Ped().estado();
      const pedidos = pedidoIds.map(id => est.items.find(p => p.id === id)).filter(Boolean);
      const total = pedidos.reduce((a, p) => a + p.total, 0);
      const { medios } = await this.config();
      const conDatos = Object.fromEntries((await this.datosPago()).map(d => [d.medio, d]));
      const h = Util.hoja('💵 ' + titulo);
      const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
      const campos = medios.map(m => Util.el('input', { type: 'text', inputmode: 'numeric', class: 'adm-input', placeholder: '$ 0', 'aria-label': 'Valor en ' + m,
        oninput: e => { const v = Util.entero(e.target.value); e.target.value = v ? v.toLocaleString('es-CO') : ''; actualizar(); } }));
      const valor = (i) => Util.entero(campos[i].value) || 0;
      const suma = () => campos.reduce((a, _, i) => a + valor(i), 0);
      const iEf = medios.indexOf(EFECTIVO);
      const inPagaCon = Util.el('input', { type: 'text', inputmode: 'numeric', class: 'adm-input', placeholder: 'Opcional', id: 'cob-pagacon',
        oninput: e => { const v = Util.entero(e.target.value); e.target.value = v ? v.toLocaleString('es-CO') : ''; actualizar(); } });
      const vueltas = Util.el('p', { class: 'cob-vueltas' });
      const zonaEf = iEf >= 0 ? Util.el('div', { class: 'adm-campo oculto' },
        Util.el('label', { class: 'adm-etq', for: 'cob-pagacon', text: 'El cliente paga en efectivo con' }), inPagaCon, vueltas) : null;
      const estado = Util.el('div', { class: 'cob-estado' });
      const btnOk = Util.el('button', { type: 'button', class: 'btn btn--prim', text: '✅ Confirmar cobro', disabled: true,
        onclick: async () => {
          const partes = medios.map((m, i) => ({ medio: m, valor: valor(i) })), pagaCon = Util.entero(inPagaCon.value);
          const detalle = partes.filter(x => x.valor > 0).map(x => x.medio + ' ' + Util.precio(x.valor)).join(' · ');
          if (!await Util.confirmar('¿Seguro del medio de pago?', '💵 ' + detalle, 'Sí, cobrar', 'Corregir')) return;
          try {
            const c = await Cobros.cobrar(pedidoIds, partes, pagaCon);
            h.cerrar();
            Util.toast('✅ Cobro ' + c.numero + ' · ' + Cobros.mediosDe(c) + ' · ' + Util.precio(c.total) + (c.vueltas ? ' · Vueltas ' + Util.precio(c.vueltas) : ''), true);
          } catch (e) { Util.mensaje(msg, '⚠️ ' + e.message, 'error'); }
        } });
      function actualizar() {
        const s = suma(), falta = total - s;
        estado.className = 'cob-estado' + (falta === 0 ? ' cob-estado--ok' : '');
        estado.replaceChildren(Util.el('span', { text: 'Suma ' + Util.precio(s) }),
          Util.el('span', { text: falta === 0 ? '✔ Cuadra' : falta > 0 ? 'Falta ' + Util.precio(falta) : 'Sobra ' + Util.precio(-falta) }));
        btnOk.disabled = falta !== 0;
        if (zonaEf) {
          const ef = valor(iEf), recibe = Util.entero(inPagaCon.value) || 0;
          if (ef && recibe && recibe < ef) btnOk.disabled = true; // el efectivo recibido no alcanza
          zonaEf.classList.toggle('oculto', !ef);
          vueltas.textContent = recibe ? (recibe >= ef ? 'Vueltas: ' + Util.precio(recibe - ef) : '⚠️ No alcanza para ' + Util.precio(ef)) : '';
        }
      }
      h.cuerpo.append(
        Util.el('div', { class: 'cob-resumen' },
          ...pedidos.map(p => Util.el('div', { class: 'ped__linea' }, Util.el('span', { text: p.numero + ' · ' + p.nombre }), Util.el('span', { text: Util.precio(p.total) }))),
          Util.el('div', { class: 'cob-total' }, Util.el('span', { text: 'Total a cobrar' }), Util.el('span', { text: Util.precio(total) }))),
        Util.el('p', { class: 'adm-nota', text: 'Toca un medio para poner ahí lo que falta. Puedes repartir entre varios.' }),
        Util.el('div', { class: 'cob-medios' }, medios.map((m, i) => Util.el('div', { class: 'cob-fila' + (conDatos[m] ? ' cob-fila--qr' : '') },
          Util.el('button', { type: 'button', class: 'btn', text: m, onclick: () => {
            // Si ya cuadra y este medio está vacío, fue un toque equivocado: el total completo pasa a este medio.
            if (!valor(i) && suma() === total) { campos.forEach(c => { c.value = ''; }); campos[i].value = total.toLocaleString('es-CO'); actualizar(); return; }
            const resto = total - (suma() - valor(i));
            campos[i].value = resto > 0 ? resto.toLocaleString('es-CO') : ''; actualizar();
          } }), campos[i],
          conDatos[m] ? Util.el('button', { type: 'button', class: 'btn cob-qr', 'aria-label': 'Mostrar QR y cuenta de ' + m, text: '📱',
            onclick: () => Cobros.verPago(conDatos[m], valor(i) || (total - suma()) || total) }) : null))),
        zonaEf, estado, msg, btnOk);
      actualizar();
    }
  };
  /* ---------- Cierre de caja (uno al final del día; cubre todo lo cobrado desde el cierre anterior) ---------- */
  const fechaHora = (iso) => new Date(iso).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  Object.assign(Cobros, {
    // Cobros aún sin cierre, total por medio y pedidos que siguen por cobrar.
    async resumenCaja() {
      const d = await this.datos(), est = await Ped().estado(), pagados = await this.pagados();
      const cobros = d.items.filter(c => !c.cierre);
      const porMedio = {};
      cobros.forEach(c => c.partes.forEach(x => { porMedio[x.medio] = (porMedio[x.medio] || 0) + x.valor; }));
      const pendientes = est.items.filter(p => p.estado !== 'cancelado' && !pagados.has(p.id) && !(p.cuenta && p.cuenta.tipo === 'perdida'));
      return {
        cobros, total: cobros.reduce((a, c) => a + c.total, 0),
        porMedio: Object.entries(porMedio).map(([medio, valor]) => ({ medio, valor })).sort((a, b) => b.valor - a.valor),
        pendientes, totalPendiente: pendientes.reduce((a, p) => a + p.total, 0)
      };
    },
    async cerrarCaja() {
      const r = await this.resumenCaja();
      if (!r.cobros.length) throw new Error('No hay cobros desde el último cierre.');
      const d = await this.datos();
      d.consecutivoCierre += 1;
      const cierre = {
        id: 'z' + Date.now().toString(36), numero: 'Z-' + String(d.consecutivoCierre).padStart(4, '0'), fecha: new Date().toISOString(),
        desde: r.cobros[0].fecha, cobros: r.cobros.length, total: r.total, porMedio: r.porMedio,
        pendientes: r.pendientes.length, totalPendiente: r.totalPendiente
      };
      const ids = new Set(r.cobros.map(c => c.id));
      d.items.forEach(c => { if (ids.has(c.id)) c.cierre = cierre.numero; });
      d.cierres.push(cierre);

    },
    async abrirCierre() {
      const h = Util.hoja('📊 Cierre de caja');
      const zona = Util.el('div', { class: 'hoja__cuerpo', style: 'padding:0' });

      async function pintar() {

        zona.replaceChildren(
          Util.el('div', { class: 'cierre-total' },
            Util.el('span', { class: 'adm-etq', text: 'Total cobrado' }),
            Util.el('span', { class: 'cierre-total__valor', text: Util.precio(r.total) }),
            Util.el('span', { class: 'cierre-total__meta', text: r.cobros.length
              ? r.cobros.length + (r.cobros.length === 1 ? ' cobro' : ' cobros') + ' · desde ' + fechaHora(r.cobros[0].fecha)
              : 'Aún no hay cobros desde el último cierre.' })),
          r.porMedio.length ? Util.el('div', { class: 'cob-resumen' },
            ...r.porMedio.map(x => Util.el('div', { class: 'ped__linea' }, Util.el('span', { text: x.medio }), Util.el('span', { text: Util.precio(x.valor) }))),
            Util.el('div', { class: 'cob-total' }, Util.el('span', { text: 'Total' }), Util.el('span', { text: Util.precio(r.total) }))) : null,
          r.pendientes.length ? Util.el('div', { class: 'qr-aviso cierre-pend' },
            Util.el('strong', { text: '⚠️ ' + (r.pendientes.length === 1 ? 'Queda 1 pedido' : 'Quedan ' + r.pendientes.length + ' pedidos') + ' por cobrar · ' + Util.precio(r.totalPendiente) }),
            ...r.pendientes.map(p => Util.el('div', { class: 'ped__linea' }, Util.el('span', { text: p.numero + ' · ' + p.nombre }), Util.el('span', { text: Util.precio(p.total) })))) : null,
          Util.el('button', { type: 'button', class: 'btn btn--prim', text: '🔒 Cerrar caja', disabled: !r.cobros.length,
            onclick: async () => {
              if (!await Util.confirmar('¿Cerrar caja?', 'Total ' + Util.precio(r.total) + (r.pendientes.length ? ' · ' + (r.pendientes.length === 1 ? 'queda 1 pedido' : 'quedan ' + r.pendientes.length + ' pedidos') + ' por cobrar' : '') + '. No se puede deshacer.', 'Sí, cerrar', 'Volver')) return;
              try { const z = await Cobros.cerrarCaja(); h.cerrar(); Util.toast('🔒 Caja cerrada ' + z.numero + ' · ' + Util.precio(z.total), true); }
              catch (e) { Util.toast('⚠️ ' + e.message, true); }
            } }));
      }
      await pintar();
      Util.escuchar(h.cuerpo, ['store:' + MOD, 'store:pedidos'], pintar);
    }
  });
  App.servicio('cobros', Cobros);

  /* ---------- Autogestión I: medios de pago ---------- */
  App.modulo({
    id: MOD,
    letra: 'I',
    titulo: 'Cobros sistema de pagos bancos etc',
    async admin(cuerpo) {
      const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
      const aviso = (t, tipo) => Util.mensaje(msg, t, tipo);
      const lista = Util.el('div', { class: 'cob-medios' });
      const inNuevo = Util.el('input', { type: 'text', class: 'adm-input', maxlength: MEDIO_MAX, placeholder: 'Ej: Bancolombia QR', id: 'adm-cob-medio' });
      const guardar = async (cambio, ok) => {
        const c = await Cobros.config();
        if (cambio(c) === false) return;
        await Store.set(CONF, c); aviso(ok, 'ok');
      };
      const abiertos = new Set(); // medios desplegados (se conservan al repintar)
      // Datos para pagar de un medio digital: cuenta, titular, nota y la imagen del QR de su app bancaria.
      function datosMedio(m, d) {
        const campo = (k, etq, ph) => { const i = Util.el('input', { type: 'text', class: 'adm-input', maxlength: DATO_MAX, value: d[k] || '', placeholder: ph, 'aria-label': etq + ' ' + m });
          return [i, Util.el('div', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: etq }), i)]; };
        const [inCuenta, fCuenta] = campo('cuenta', 'Número, llave o cuenta', 'Ej: 300 123 4567');
        const [inTitular, fTitular] = campo('titular', 'Titular', 'Ej: Nachos SAS');
        const [inNota, fNota] = campo('nota', 'Nota', 'Ej: Ahorros Bancolombia');
        const img = Util.el('img', { class: 'adm-qr oculto', alt: 'QR de ' + m });
        if (d.qrId) Media.url(d.qrId).then(u => { if (u) { img.src = u; img.classList.remove('oculto'); } });
        const inArchivo = Util.el('input', { type: 'file', accept: 'image/*', class: 'oculto', onchange: async () => {
          const file = inArchivo.files[0]; inArchivo.value = '';
          if (!file) return;
          try {
            aviso('Procesando imagen…', 'ok');
            const id = await Media.guardar(await Util.reducirImagen(file, 1000, 0.92));
            const c = await Cobros.config(), anterior = (c.datos[m] || {}).qrId;
            c.datos[m] = Object.assign({}, c.datos[m], { qrId: id });
            await Store.set(CONF, c); await Media.borrar(anterior);
            aviso('✅ QR de ' + m + ' guardado.', 'ok');
          } catch (e) { aviso('⚠️ ' + e.message, 'error'); }
        } });
        return [fCuenta, fTitular, fNota,
          Util.el('div', { class: 'adm-campo' }, Util.el('span', { class: 'adm-etq', text: 'QR (descárgalo de tu app bancaria y súbelo aquí)' }), img, inArchivo,
            Util.el('div', { class: 'adm-acciones' },
              Util.el('button', { type: 'button', class: 'btn', text: d.qrId ? 'Cambiar QR' : 'Subir QR', onclick: () => inArchivo.click() }),
              d.qrId ? Util.el('button', { type: 'button', class: 'btn btn--peligro', text: 'Quitar QR', onclick: async () => {
                const c = await Cobros.config(), anterior = (c.datos[m] || {}).qrId;
                delete c.datos[m].qrId; await Store.set(CONF, c); await Media.borrar(anterior); aviso('QR de ' + m + ' quitado.', 'ok');
              } }) : null)),
          Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar datos de ' + m, onclick: () => guardar(c => {
            c.datos[m] = Object.assign({}, c.datos[m], { cuenta: Util.limpiarTexto(inCuenta.value, DATO_MAX), titular: Util.limpiarTexto(inTitular.value, DATO_MAX), nota: Util.limpiarTexto(inNota.value, DATO_MAX) });
          }, '✅ Datos de ' + m + ' guardados.') })];
      }
      async function pintar() {
        const { medios, datos } = await Cobros.config();
        lista.replaceChildren(...medios.map(m => {
          const d = datos[m] || {}, listo = d.cuenta || d.qrId;
          const det = Util.el('details', { class: 'caja-grupo cob-resumen', open: abiertos.has(m), ontoggle: () => { det.open ? abiertos.add(m) : abiertos.delete(m); } },
            Util.el('summary', { class: 'caja-grupo__tit' }, Util.el('span', { text: m + (m === EFECTIVO ? '' : listo ? ' · ✅ ' + [d.cuenta, d.qrId ? 'QR' : ''].filter(Boolean).join(' · ') : ' · sin datos') })),
            ...(m === EFECTIVO ? [Util.el('p', { class: 'adm-nota', text: 'Calcula las vueltas al cobrar. No lleva cuenta ni QR.' })] : datosMedio(m, d)),
            Util.el('button', { type: 'button', class: 'btn', text: 'Quitar medio', onclick: async () => {
              if (medios.length === 1) { aviso('⚠️ Debe quedar al menos un medio de pago.', 'error'); return; }
              if (!await Util.confirmar('¿Quitar "' + m + '"?', 'Los cobros ya hechos con este medio se conservan.', 'Quitar', 'Cancelar')) return;
              const qr = (datos[m] || {}).qrId;
              await guardar(c => { c.medios = c.medios.filter(x => x !== m); delete c.datos[m]; }, 'Medio "' + m + '" quitado.');
              await Media.borrar(qr);
            } }));
          return det;
        }));
      }
      cuerpo.append(
        Util.el('div', { class: 'adm-campo' },
          Util.el('span', { class: 'adm-etq', text: 'Medios de pago' }),
          Util.el('p', { class: 'adm-nota', text: 'Toca un medio para poner su cuenta y su QR. El asesor los muestra al cobrar y el cliente los ve en "Mi cuenta".' }), lista),
        Util.el('div', { class: 'adm-campo' },
          Util.el('label', { class: 'adm-etq', for: 'adm-cob-medio', text: 'Agregar medio de pago' }),
          Util.el('div', { class: 'adm-fila' }, inNuevo, Util.el('button', { type: 'button', class: 'btn btn--prim', text: '＋ Agregar',
            onclick: () => guardar(c => {
              const v = Util.limpiarTexto(inNuevo.value, MEDIO_MAX);
