     ===================================================================== -->
<script id="js-carrito">
(function () {
  'use strict';
  const { Util, Store, Bus } = App;
  const Cat = App.servicio('catalogo');
  const MOD = 'carrito', NOTA_MAX = 80, NOMBRE_MAX = 40;
  const DEF = { lineas: [], nombre: '', whatsapp: '', misPedidos: [], avisados: [] };

  /* ---------- Servicio: estado del pedido en curso ---------- */
  const Carrito = {
    async estado() { return Store.get(MOD, DEF); },
    // Líneas válidas: producto existente, con inventario y cantidad ajustada al stock.
    async lineas() {
      const est = await this.estado(), prods = await Cat.productos(), promos = await Cat.promos();
      const porId = Object.fromEntries(prods.map(p => [p.id, p]));
      return est.lineas
        .map(l => ({ ...l, producto: porId[l.productoId] }))
        .filter(l => l.producto && Cat.disponible(l.producto))
        .map(l => ({ ...l, cantidad: Math.min(l.cantidad, Cat.unidades(l.producto)), precio: Cat.precio(l.producto, promos) }))
        .filter(l => l.cantidad > 0);
    },
    async resumen() {
      const ls = await this.lineas();
      return { lineas: ls, unidades: ls.reduce((a, l) => a + l.cantidad, 0), total: ls.reduce((a, l) => a + l.cantidad * l.precio, 0) };
    },
    async cantidad(id) { const l = (await this.lineas()).find(x => x.productoId === id); return l ? l.cantidad : 0; },
    async cambiar(id, delta) {
      const H = App.servicio('horario');
      if (delta > 0 && H && !(await H.abierto())) return; // fuera de horario: solo vitrina
      const est = await this.estado();
      // Se parte de las líneas efectivas (ajustadas al inventario actual), así lo guardado nunca difiere de lo que ve el cliente.
      const vigentes = await this.lineas();
      const p = (await Cat.productos()).find(x => x.id === id);
      const max = p ? Cat.unidades(p) : 0;
      let l = vigentes.find(x => x.productoId === id);
      const nueva = Math.max(0, Math.min(max, (l ? l.cantidad : 0) + delta));
      if (!l && nueva > 0) { l = { productoId: id, cantidad: 0, nota: '' }; vigentes.push(l); }
      if (l) l.cantidad = nueva;
      est.lineas = vigentes.filter(x => x.cantidad > 0).map(x => ({ productoId: x.productoId, cantidad: x.cantidad, nota: x.nota || '' }));
      await Store.set(MOD, est);
    },
    async recordarPedido(id) { const est = await this.estado(); est.misPedidos = est.misPedidos.concat(id).slice(-20); await Store.set(MOD, est); },
    // Tras enviar: carrito vacío y datos del cliente en blanco para el siguiente pedido.
    async vaciar() { const est = await this.estado(); est.lineas = []; est.nombre = ''; est.whatsapp = ''; await Store.set(MOD, est); },
    async guardarCampo(campo, valor, productoId) {
      const est = await this.estado();
      if (productoId) { const l = est.lineas.find(x => x.productoId === productoId); if (!l) return; l.nota = valor; }
      else est[campo] = valor;
      await Store.set(MOD, est);
    },

    // Selector − cantidad + reutilizable (tarjetas y Ver pedido). Se actualiza solo.
    selector(p) {
      const num = Util.el('span', { class: 'paso__num', text: '0', 'aria-live': 'polite' });
      const menos = Util.el('button', { type: 'button', class: 'paso__btn', 'aria-label': 'Quitar uno de ' + p.nombre, text: '−', disabled: true, onclick: () => Carrito.cambiar(p.id, -1) });
      const mas = Util.el('button', { type: 'button', class: 'paso__btn paso__btn--mas', 'aria-label': 'Agregar uno de ' + p.nombre, text: '+', onclick: () => Carrito.cambiar(p.id, 1) });
      const caja = Util.el('div', { class: 'paso' }, menos, num, mas);
      async function pintar() {
        const prod = (await Cat.productos()).find(x => x.id === p.id);
        const c = await Carrito.cantidad(p.id), max = prod ? Cat.unidades(prod) : 0;
        num.textContent = c; menos.disabled = c === 0; mas.disabled = c >= max;
        const H = App.servicio('horario');
        caja.classList.toggle('oculto', !!H && !(await H.abierto()));
      }
      pintar();
      Util.escuchar(caja, ['store:' + MOD, 'catalogo:cambio', 'horario:cambio'], pintar);
      return caja;
    }
  };
  App.servicio('carrito', Carrito);

  /* ---------- Confirmación obligatoria tras enviar ---------- */
  function confirmacion(pedido, enlacePendiente) {
    const Ped = App.servicio('pedidos');
    const h = Util.hoja('🧾 Comprobante');
    const msgDesc = Util.el('p', { class: 'adm-msg', role: 'status' });
    h.cuerpo.append(Util.el('div', { class: 'conf' },
      Util.el('span', { class: 'conf__icono', text: '🚩' }),
      Util.el('p', { class: 'ped__cliente', text: '¡Gracias por tu pedido, ' + pedido.nombre + '!' }),
      Util.el('span', { class: 'conf__num', text: pedido.numero }),
      Util.el('span', { class: 'conf__meta', text: new Date(pedido.fecha).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }) }),
      Util.el('div', { class: 'conf__det' },
        pedido.lineas.flatMap(l => [
          Util.el('div', { class: 'ped__linea' }, Util.el('span', { text: l.cantidad + ' × ' + l.nombre }), Util.el('span', { text: Util.precio(l.valor * l.cantidad) })),
          l.nota ? Util.el('div', { class: 'ped__nota', text: '📝 ' + l.nota }) : null]),
        Util.el('div', { class: 'ped__total' }, Util.el('span', { text: 'Total a pagar' }), Util.el('span', { class: 'ped-total__valor', text: Util.precio(pedido.total) }))),
      Util.el('div', { class: 'conf__acciones' },
        Util.el('button', { type: 'button', class: 'btn btn--prim conf__guardar', text: '📥 Guardar mi comprobante',
          onclick: async () => { try { await Ped.descargarComprobante(pedido); Util.mensaje(msgDesc, '✅ Comprobante guardado en tus descargas.', 'ok'); } catch (e) { Util.mensaje(msgDesc, '⚠️ ' + e.message, 'error'); } } }),
        Ped.puedeCompartir() ? Util.el('button', { type: 'button', class: 'btn conf__compartir', text: '📤 Compartir',
          onclick: async () => { try { if (await Ped.compartirComprobante(pedido)) Util.mensaje(msgDesc, '✅ Comprobante compartido.', 'ok'); } catch (e) { Util.mensaje(msgDesc, '⚠️ ' + e.message, 'error'); } } }) : null),
      Util.el('p', { class: 'conf__meta', text: 'Guárdalo como soporte de tu pedido.' }),
      msgDesc,
      Util.el('p', { class: 'conf__msg', text: pedido.bandera
        ? '🚩 Te lo llevamos a tu mesa, Bandera #' + String(pedido.bandera).padStart(2, '0') + '. ¡Gracias!'
        : 'Por favor solicita al asesor en la barra tu Bandera de pedido personalizado a tu nombre. Con ella te llevamos tu pedido.' }),
      enlacePendiente ? Util.el('a', { class: 'visor__accion', href: enlacePendiente, target: '_blank', rel: 'noopener', text: 'Enviar también por WhatsApp' }) : null,
      Util.el('button', { type: 'button', class: 'btn', style: 'width:100%', text: 'Entendido', onclick: () => h.cerrar() })));
  }

  /* ---------- Aviso en la app del cliente: preparación y pedido listo ---------- */
  // Un aviso solo se muestra si el cambio ocurrió mientras esta pantalla estaba como cliente (no con la Caja
  // abierta aquí) y hace menos de AVISO_MAX_MS. Lo que pasó antes se da por visto en silencio:
  // nunca un "¡Listo!" viejo encima de un pedido nuevo.
  const AVISO_MAX_MS = 10 * 60 * 1000;
  let clienteDesde = Date.now();
  Bus.on('caja:cerrada', () => { clienteDesde = Date.now(); });
  Bus.on('store:pedidos', async () => {
    const Ped = App.servicio('pedidos');
    if (!Ped || Ped.cajaAbierta()) return; // con la Caja abierta esta pantalla no actúa como cliente
    const est = await Carrito.estado();
    if (!est.misPedidos.length) return;
    const pendientes = (await Ped.estado()).items.filter(p => est.misPedidos.includes(p.id) && ['preparacion', 'despachado'].includes(p.estado) && !est.avisados.includes(p.id + ':' + p.estado));
    if (!pendientes.length) return;
    // Al avisar "listo" también se da por avisada la preparación (no se muestra tarde).
    est.avisados = est.avisados.concat(pendientes.flatMap(p => p.estado === 'despachado' ? [p.id + ':despachado', p.id + ':preparacion'] : [p.id + ':preparacion'])).slice(-40);
    await Store.set(MOD, est);
    const ahora = Date.now();
    pendientes.filter(p => { const t = new Date(p[p.estado + 'En'] || 0).getTime(); return t >= clienteDesde && ahora - t <= AVISO_MAX_MS; })
      .forEach(p => Util.toast(Ped.mensajeCliente(p)));
  });

  /* ---------- Ver pedido ---------- */
  let hojaPedido = null;
  async function verPedido() {
    if (hojaPedido) return;
    const { lineas } = await Carrito.resumen();
    if (!lineas.length) return;
    hojaPedido = Util.hoja('🛒 Tu pedido', () => { hojaPedido = null; });
    const cuerpo = hojaPedido.cuerpo;
    const est = await Carrito.estado();
    const Mesa = App.servicio('mesa'), band = Mesa ? await Mesa.activa() : null;
    const totalEl = Util.el('span', { class: 'ped-total__valor' });
    const msgEnvio = Util.el('p', { class: 'adm-msg', role: 'status' });
    const btnEnviar = Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Enviar pedido', onclick: () => enviar() });
    async function enviar() {
      // Con bandera del QR no se pide ningún dato: el nombre ya viene de la bandera.
      const nombre = band ? band.nombre : Util.limpiarTexto(inNombre.value, NOMBRE_MAX);
      const wa = band ? '' : inWa.value.replace(/\D/g, '');
      // Lleva al campo exacto (arriba) para que el cliente vea qué falta.
      const irA = (input) => { input.classList.add('adm-input--error'); input.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => input.focus(), 350); };
      if (!nombre) { Util.mensaje(msgEnvio, '⚠️ Escribe tu nombre para atenderte.', 'error'); irA(inNombre); return; }
      if (wa && wa.length !== 10) { Util.mensaje(msgEnvio, '⚠️ El WhatsApp debe tener 10 dígitos (o déjalo vacío).', 'error'); irA(inWa); return; }
      if (!band && !wa && !await Util.confirmar('¿Enviar sin WhatsApp?', 'No podremos avisarte cuando tu pedido esté listo.', 'Enviar así', 'Agregar mi WhatsApp')) { irA(inWa); return; }
      btnEnviar.disabled = true;
      // Guardados diferidos pendientes no deben reescribir datos después de enviar.
      [tNota, tDato].forEach(m => Object.values(m).forEach(clearTimeout));
      try {
        const Ped = App.servicio('pedidos');
        // Se guarda lo que está escrito en pantalla en este instante (notas, nombre y WhatsApp).
        for (const [id, f] of Object.entries(filas)) await Carrito.guardarCampo('nota', Util.limpiarTexto(f.nota.value, NOTA_MAX), id);
        await Carrito.guardarCampo('nombre', nombre); await Carrito.guardarCampo('whatsapp', wa);
        const est = await Carrito.estado();
        const pedido = await Ped.crear({ nombre, whatsapp: wa, lineas: est.lineas, bandera: band ? band.n : null });
        const enlace = await Ped.enlaceWhatsApp(pedido);
        const ventana = enlace ? window.open(enlace, '_blank') : null;
        await Carrito.vaciar();
        await Carrito.recordarPedido(pedido.id);
        hojaPedido && hojaPedido.cerrar();
        confirmacion(pedido, enlace && !ventana ? enlace : null);
      } catch (e) { Util.mensaje(msgEnvio, '⚠️ ' + e.message, 'error'); btnEnviar.disabled = false; }
    }
    const filas = {};
    let tNota = {}, tDato = {};
    const diferir = (mapa, clave, fn) => { clearTimeout(mapa[clave]); mapa[clave] = setTimeout(fn, 300); };

    // Datos del cliente primero: es lo que se pide antes de enviar (nombre obligatorio; WhatsApp recomendado).
    const inNombre = Util.el('input', { type: 'text', class: 'adm-input', maxlength: NOMBRE_MAX, value: est.nombre, placeholder: 'Ej: Alexander', id: 'ped-nombre', autocomplete: 'given-name',
      oninput: e => { e.target.classList.remove('adm-input--error'); diferir(tDato, 'nombre', () => Carrito.guardarCampo('nombre', Util.limpiarTexto(e.target.value, NOMBRE_MAX))); } });
    const inWa = Util.el('input', { type: 'tel', inputmode: 'numeric', class: 'adm-input', value: est.whatsapp, placeholder: '3001234567', id: 'ped-wa', autocomplete: 'tel-national',
      oninput: e => { e.target.classList.remove('adm-input--error'); e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10); diferir(tDato, 'wa', () => Carrito.guardarCampo('whatsapp', e.target.value)); } });
    cuerpo.append(band
      ? Util.el('div', { class: 'ped-datos' }, Util.el('p', { class: 'ped__cliente', text: '🚩 Tu pedido llega a la Bandera #' + String(band.n).padStart(2, '0') + ' · ' + band.nombre }))
      : Util.el('div', { class: 'ped-datos' },
        Util.el('div', { class: 'adm-campo' }, Util.el('label', { class: 'adm-etq', for: 'ped-nombre', text: 'Tu nombre *' }), inNombre),
        Util.el('div', { class: 'adm-campo' }, Util.el('label', { class: 'adm-etq', for: 'ped-wa', text: 'Tu WhatsApp (recomendado)' }), inWa,
          Util.el('p', { class: 'adm-nota', text: '📲 Para avisarte cuando tu pedido esté listo.' }))));

    lineas.forEach(l => {
      const p = l.producto;
      const sub = Util.el('span', { class: 'ped-linea__sub' });
      const unit = Util.el('span', { class: 'ped-linea__unit', text: Util.precio(l.precio) + ' c/u' });
      const nota = Util.el('input', { type: 'text', class: 'adm-input', maxlength: NOTA_MAX, value: l.nota || '', placeholder: 'Nota (opcional): ej. sin azúcar', 'aria-label': 'Nota para ' + p.nombre,
        oninput: e => diferir(tNota, p.id, () => Carrito.guardarCampo('nota', Util.limpiarTexto(e.target.value, NOTA_MAX), p.id)) });
      const fila = Util.el('div', { class: 'ped-linea', 'data-producto': p.id },
        Util.el('div', { class: 'ped-linea__fila' },
          Cat.miniatura(p.imagenId, p.nombre),
          Util.el('div', { class: 'ped-linea__info' },
            Util.el('span', { class: 'ped-linea__nombre', text: p.nombre }),
            unit),
          sub),
        Util.el('div', { class: 'ped-linea__fila' }, Carrito.selector(p)),
        nota);
      filas[p.id] = { fila, sub, unit, nota };
      cuerpo.append(fila);
    });

    // Barra fija abajo: total siempre a la vista + seguir pidiendo o enviar (útil con listas largas, p. ej. un grupo de amigos).
    cuerpo.append(Util.el('div', { class: 'ped-pie' },
      Util.el('div', { class: 'ped-total' }, Util.el('span', { text: 'Total a pagar' }), totalEl),
      msgEnvio,
      Util.el('div', { class: 'ped-pie__botones' },
        // Seguir pidiendo: cierra el resumen y deja al cliente exactamente donde estaba (misma categoría y posición).
        Util.el('button', { type: 'button', class: 'btn', text: '➕ Agregar más', onclick: () => { hojaPedido && hojaPedido.cerrar(); } }),
        btnEnviar)));

    // Actualiza solo números y filas retiradas (no toca lo que el cliente escribe).
    async function actualizar() {
      const r = await Carrito.resumen();
      if (!r.lineas.length) { hojaPedido && hojaPedido.cerrar(); return; }
      const vivas = Object.fromEntries(r.lineas.map(l => [l.productoId, l]));
      Object.entries(filas).forEach(([id, f]) => {
        if (!vivas[id]) { f.fila.remove(); delete filas[id]; }
        else { f.sub.textContent = Util.precio(vivas[id].cantidad * vivas[id].precio); f.unit.textContent = Util.precio(vivas[id].precio) + ' c/u'; }
      });
      totalEl.textContent = Util.precio(r.total);
    }
    await actualizar();
    Util.escuchar(cuerpo, ['store:' + MOD, 'catalogo:cambio'], actualizar);
  }

  /* ---------- Barra inferior estilo Rappi ---------- */
  App.modulo({
    id: MOD,
    slot: 'slot-flotante',
    orden: 900,
    async montar(raiz) {
      const info = Util.el('span', { class: 'barra__info' });
      raiz.className = 'barra oculto';
      raiz.append(Util.el('div', { class: 'barra__fila' }, info,
        Util.el('button', { type: 'button', class: 'barra__btn', text: 'Ver pedido', onclick: () => { Bus.emit('visor:cerrar'); verPedido(); } })));
      async function render() {
        const r = await Carrito.resumen(), H = App.servicio('horario');
        const hay = r.unidades > 0 && !(H && !(await H.abierto()));
        raiz.classList.toggle('oculto', !hay);
        document.body.classList.toggle('con-barra', hay);
        info.textContent = '🛒 ' + r.unidades + (r.unidades === 1 ? ' producto' : ' productos') + ' · ' + Util.precio(r.total);
      }
      await render();
      ['store:' + MOD, 'catalogo:cambio', 'horario:cambio'].forEach(ev => Bus.on(ev, render));
    }
  });
})();
</script>

<script id="js-destacados">
(function () {
  'use strict';
  const { Util, Store, Bus } = App;
  const Cat = App.servicio('catalogo');
  const Carrito = App.servicio('carrito');
  const MOD = 'destacados', CUPOS_DEF = 4; // el dueño decide cuántos: desde 0 (apagados) y sin tope
  const TITULO_DEF = 'Productos destacados con descuento', TITULO_MAX = 50;
  const DEF = { modo: 'promos', ids: [], cupos: CUPOS_DEF, titulo: TITULO_DEF };
  const cuposDe = (conf) => { const v = parseInt(conf.cupos, 10); return v >= 0 ? v : CUPOS_DEF; };

  // Resuelve los destacados a mostrar. Manual: los elegidos disponibles y, si faltan, se completan por ranking.
  async function resolver() {
    const conf = await Store.get(MOD, DEF), CUPOS = cuposDe(conf);
    if (conf.modo === 'promos') { // los productos en promoción, mayor descuento primero
      const pr = await Cat.promos();
      return (await Cat.productosDeCategoria(Cat.PROMO_ID)).slice().sort((a, b) => (pr.items[b.id] || 0) - (pr.items[a.id] || 0)).slice(0, CUPOS);
    }
    const ranking = await Cat.ranking();
    if (conf.modo !== 'manual') return ranking.slice(0, CUPOS);
    const porId = Object.fromEntries(ranking.map(p => [p.id, p]));
    const elegidos = conf.ids.map(id => porId[id]).filter(Boolean);
    const resto = ranking.filter(p => !elegidos.includes(p));
    return elegidos.concat(resto).slice(0, CUPOS);
  }

  App.modulo({
    id: MOD,
    slot: 'app-main',
    orden: 30,
    letra: 'C',
    titulo: 'Destacados y promociones',

    async montar(raiz) {
      raiz.className = 'destacados';
      const grid = Util.el('div', { class: 'prod-grid' });
      const franja = Util.franja(TITULO_DEF, 'destacados__titulo'); // título editable por el dueño (siempre en mayúsculas)
      raiz.append(franja.el, grid);
      async function render() {
        const lista = await resolver();
        grid.replaceChildren(...lista.map(p => Cat.tarjeta(p, Carrito.selector(p))));
        raiz.classList.toggle('oculto', lista.length === 0); // sin destacados no hay título
        franja.poner((await Store.get(MOD, DEF)).titulo || TITULO_DEF);
      }
      // Con una categoría abierta, el cliente ve solo esa categoría: los destacados se ocultan y vuelven al cerrarla.
      Bus.on('categorias:abierta', (abierta) => { raiz.classList.toggle('destacados--fuera', abierta); if (!abierta) franja.ajustar(); });
      await render();
      ['store:' + MOD, 'catalogo:cambio', 'store:categorias', 'store:promos'].forEach(ev => Bus.on(ev, render));
    },

    async admin(cuerpo) {
      const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
      const aviso = (t, tipo) => Util.mensaje(msg, t, tipo);
      const zona = Util.el('div', { class: 'adm-sec__cuerpo', style: 'padding:0' });
      const DESC_MAX_UI = Cat.DESC_MAX;
      // Promociones: productos de cualquier categoría con su % de descuento (fuente única del precio con descuento).
      const promo = Util.el('details', { class: 'caja-grupo cob-resumen adm-promo' });
      let promoAbierta = false;
      promo.addEventListener('toggle', () => { promoAbierta = promo.open; });
      async function pintarPromo() {
        const pr = await Cat.promos(), cats = await Cat.categorias(), prods = await Cat.productos();
        const n = Object.keys(pr.items).filter(id => prods.some(p => p.id === id)).length;
        const guardarPr = async (fn, ok) => { const d = await Cat.promos(); fn(d); await Cat.guardarPromos(d); if (ok) aviso(ok, 'ok'); };
        const swVaciar = Util.el('input', { type: 'checkbox', checked: pr.vaciarDiario, onchange: e => guardarPr(d => { d.vaciarDiario = e.target.checked; },
          e.target.checked ? '✅ Las promociones se vaciarán solas al empezar cada día.' : '✅ Las promociones quedan hasta que las vacíes.') });
        const fila = (p) => {
          const d = pr.items[p.id], en = p.id in pr.items;
          const precio = Util.el('span', { class: 'adm-prod__meta', text: Util.precio(p.valor) + (d > 0 ? ' → ' + Util.precio(Cat.precio(p, pr)) : '') });
          const inPct = Util.el('input', { type: 'number', inputmode: 'numeric', class: 'adm-input adm-promo__pct', min: 0, max: DESC_MAX_UI, step: 1, value: d || 0, disabled: !en, 'aria-label': '% de descuento ' + p.nombre,
            onchange: e => { const v = Math.max(0, Math.min(DESC_MAX_UI, parseInt(e.target.value, 10) || 0)); guardarPr(x => { if (p.id in x.items) x.items[p.id] = v; }, v ? '✅ ' + p.nombre + ': -' + v + '%.' : '✅ ' + p.nombre + ': precio normal.'); } });
          const sw = Util.el('input', { type: 'checkbox', checked: en, 'aria-label': 'En promo ' + p.nombre,
            onchange: e => guardarPr(x => { if (e.target.checked) x.items[p.id] = 0; else delete x.items[p.id]; }, e.target.checked ? '🔥 ' + p.nombre + ' en promo.' : p.nombre + ' salió de promo.') });
          return Util.el('div', { class: 'adm-promo__fila' + (en ? ' adm-promo__fila--on' : '') },
            Util.el('div', { class: 'adm-prod__info' }, Util.el('span', { class: 'adm-prod__nombre', text: p.nombre }), precio),
            Util.el('label', { class: 'adm-promo__pct-et' }, inPct, Util.el('span', { text: '%' })),
            Util.el('label', { class: 'adm-switch' }, sw));
        };
        promo.replaceChildren(
          Util.el('summary', { class: 'caja-grupo__tit' }, Util.el('span', { text: '🔥 Promociones · ' + n + (n === 1 ? ' producto' : ' productos') })),
          Util.el('label', { class: 'adm-switch' }, swVaciar, Util.el('span', { text: 'Vaciar promociones al final del día' })),
          Util.el('button', { type: 'button', class: 'btn btn--peligro', text: 'Vaciar ahora', disabled: !n, onclick: async () => {
            if (!await Util.confirmar('¿Vaciar las promociones?', 'Los productos vuelven a su precio normal. No se borran.', 'Vaciar', 'Cancelar')) return;
            guardarPr(d => { d.items = {}; }, 'Promociones vacías.');
          } }),
          Util.el('p', { class: 'adm-nota', text: 'Prende los productos que van en promo. El % es opcional: 0 % = precio normal. Se redondea a los $100.' }),
          ...cats.flatMap(c => { const ps = prods.filter(p => p.categoriaId === c.id); return ps.length ? [Util.el('span', { class: 'adm-etq', text: c.nombre }), ...ps.map(fila)] : []; }),
          ...(prods.length ? [] : [Util.el('p', { class: 'adm-nota', text: 'Aún no hay productos (bloque Productos).' })]));
        promo.open = promoAbierta;
      }
      cuerpo.append(promo, zona, msg); // promociones arriba: es lo que más se mueve en el día
      await pintarPromo();
      Util.escuchar(cuerpo, ['store:categorias', 'store:productos', 'store:promos'], pintarPromo);

      async function pintar() {
        const conf = await Store.get(MOD, DEF), CUPOS = cuposDe(conf);
        const carta = await Cat.carta();
        if (!carta.length) {
          zona.replaceChildren(Util.el('p', { class: 'adm-nota', text: 'Primero crea categorías y productos con inventario. Aquí aparecerán para elegir.' }));
          return;
        }
        const radio = (valor, texto) => Util.el('label', {},
          Util.el('input', { type: 'radio', name: 'adm-dest-modo', value: valor, checked: conf.modo === valor,
            onchange: async () => { const d = await Store.get(MOD, DEF); d.modo = valor; await Store.set(MOD, d); aviso('✅ Modo guardado.', 'ok'); await pintar(); } }),
          Util.el('span', { text: texto }));
        const inCupos = Util.el('input', { type: 'number', inputmode: 'numeric', class: 'adm-input', min: 0, step: 1, value: CUPOS, id: 'adm-dest-cupos' });
        const inTitulo = Util.el('input', { type: 'text', class: 'adm-input', maxlength: TITULO_MAX, value: conf.titulo || TITULO_DEF, id: 'adm-dest-titulo' });
        const nodos = [
          Util.el('div', { class: 'adm-campo' },
            Util.el('label', { class: 'adm-etq', for: 'adm-dest-titulo', text: 'Título de la sección' }),
            Util.el('div', { class: 'adm-fila' }, inTitulo,
              Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar', onclick: async () => {
                const v = Util.limpiarTexto(inTitulo.value, TITULO_MAX) || TITULO_DEF;
                const d = await Store.get(MOD, DEF); d.titulo = v; await Store.set(MOD, d); inTitulo.value = v;
                aviso('✅ Título guardado: ' + v.toUpperCase(), 'ok');
              } })),
            Util.el('p', { class: 'adm-nota', text: 'Sale en mayúsculas encima de los destacados. Vacío = "' + TITULO_DEF + '".' })),
          Util.el('div', { class: 'adm-campo' },
            Util.el('label', { class: 'adm-etq', for: 'adm-dest-cupos', text: 'Cantidad de destacados' }),
            Util.el('div', { class: 'adm-fila' }, inCupos,
              Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar', onclick: async () => {
                const v = parseInt(inCupos.value, 10);
                if (!(v >= 0)) { aviso('⚠️ Escribe un número desde 0.', 'error'); inCupos.value = CUPOS; return; }
                const d = await Store.get(MOD, DEF); d.cupos = v; await Store.set(MOD, d);
                aviso(v ? '✅ Se mostrarán ' + v + ' destacados.' : '✅ Destacados apagados: la portada muestra solo las categorías.', 'ok'); await pintar();
              } })),
            Util.el('p', { class: 'adm-nota', text: '0 = sin destacados. Si hay menos productos disponibles, se muestran todos los que haya.' }))
        ];
        // Con 0 no hay nada que elegir: solo el aviso.
        if (!CUPOS) { nodos.push(Util.el('p', { class: 'adm-nota', text: '🔕 Destacados apagados (0). Escribe una cantidad para volver a mostrarlos.' })); zona.replaceChildren(...nodos); return; }
        nodos.push(
          Util.el('div', { class: 'adm-radio' },
            radio('promos', '🔥 Mis promociones: los productos en promo (mayor descuento primero)'),
            radio('auto', 'Automático: los más vendidos'),
            radio('manual', 'Manual: yo elijo los ' + CUPOS)),
          Util.el('p', { class: 'adm-nota', text: 'Sin ventas aún, el automático muestra los primeros productos de la carta. Un producto agotado sale y entra el siguiente.' }));
        if (conf.modo === 'manual') {
          const selects = [];
          for (let i = 0; i < CUPOS; i++) {
            const sel = Util.el('select', { class: 'adm-input adm-select', 'aria-label': 'Destacado ' + (i + 1) },
              Util.el('option', { value: '', text: '— Destacado ' + (i + 1) + ' —' }),
              carta.map(p => Util.el('option', { value: p.id, text: p.nombre + ' · ' + Util.precio(p.valor), selected: conf.ids[i] === p.id })));
            selects.push(sel);
          }
          nodos.push(...selects, Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar destacados',
            onclick: async () => {
              const ids = selects.map(s => s.value).filter(Boolean);
              if (new Set(ids).size !== ids.length) { aviso('⚠️ Hay un producto repetido.', 'error'); return; }
              const d = await Store.get(MOD, DEF); d.ids = ids; await Store.set(MOD, d);
              aviso('✅ Destacados guardados.', 'ok');
            } }));
        }
        zona.replaceChildren(...nodos);
      }
      await pintar();
      Util.escuchar(cuerpo, ['catalogo:cambio', 'store:categorias'], pintar);
    }
  });
})();
</script>

<!-- =====================================================================
     JS · MÓDULO CATEGORÍAS  (autogestión: D. Categorías · frente en paso siguiente)

<script id="js-categorias">
(function () {
  'use strict';
  const { Util, Store, Media } = App;
  const Cat = App.servicio('catalogo');
  const NOMBRE_MAX = 30;

  const Carrito = App.servicio('carrito');
  const CONF = 'carta', CONF_DEF = { cierreSeg: 15, textoVolver: '← Volver a categorías' }, SEG_MIN = 5, SEG_MAX = 120, VOLVER_MAX = 30;
  const DESC_MAX_UI = Cat.DESC_MAX;

  App.modulo({
    id: 'categorias',
    slot: 'app-main',
    orden: 25, // justo debajo del banner (20)
    letra: 'D',
    titulo: 'Categorías de productos + servicios',

    async montar(raiz) {
      raiz.className = 'cats';
      const fila = Util.el('div', { class: 'cats__fila', role: 'tablist', 'aria-label': 'Categorías' });
      const grid = Util.el('div', { class: 'prod-grid' });
      const carta = Util.el('div', { class: 'carta oculto' }, grid);
      // Los productos de la categoría abierta salen siempre debajo de todas las categorías.
      // Botón para volver a todas las categorías (texto editable en D): al lado de la categoría abierta y, cuando
      // el cliente baja y esa pieza sale de la pantalla, flotando abajo en la zona del pulgar sin montarse en lo fijo.
      const volverTodas = () => { cerrar(); titulo.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
      const volver = Util.el('button', { type: 'button', class: 'cats__volver', onclick: volverTodas });
      const flota = Util.el('button', { type: 'button', class: 'cats__volver cats__volver--flota', onclick: volverTodas });
      document.getElementById('slot-capas').append(flota);
      let piezaVisible = true;
      const ponerFlota = () => {
        const ver = !!activa && !piezaVisible;
        if (ver) { // justo encima de lo fijo de abajo (fila de ayuda o barra del carrito)
          const tops = ['.barra', '.ayuda'].map(sel => document.querySelector(sel)).filter(e => e && !e.classList.contains('oculto') && getComputedStyle(e).display !== 'none')
            .map(e => e.getBoundingClientRect()).filter(r => r.height > 0).map(r => r.top);
          flota.style.bottom = (tops.length ? innerHeight - Math.min(...tops) + 8 : 16) + 'px';
        }
        flota.classList.toggle('cats__volver--ver', ver);
      };
      const vigia = new IntersectionObserver(es => { piezaVisible = es[0].isIntersecting; ponerFlota(); });
      App.Bus.on('store:carrito', () => setTimeout(ponerFlota, 50)); // la barra del carrito aparece o se va
      window.addEventListener('resize', ponerFlota);
      // Título "NUESTROS PRODUCTOS" entre el banner y las categorías (franja compartida con Destacados).
      const franja = Util.franja('NUESTROS PRODUCTOS', 'cats__titulo'), titulo = franja.el;
      raiz.append(titulo, Util.el('div', { class: 'cats__marco' }, fila), carta);
      let activa = null, timer = null, cierreMs = CONF_DEF.cierreSeg * 1000, avisada = false;

      // Inactividad: cualquier toque, tecla o desplazamiento mientras hay una categoría abierta reinicia la cuenta.
      const reiniciar = () => { if (!activa) return; clearTimeout(timer); timer = setTimeout(cerrar, cierreMs); };
      ['pointerdown', 'keydown', 'wheel', 'touchmove'].forEach(ev => document.addEventListener(ev, reiniciar, { passive: true }));
      window.addEventListener('scroll', reiniciar, { passive: true });

      // Cada círculo ajusta su letra para que el nombre quepa completo.
      // Si una palabra larga no cabe ni con la letra mínima (círculo pequeño, ej. "Hamburguesas"), se parte con guion.
      const desborda = (b) => { const r = document.createRange(); r.selectNodeContents(b); const t = r.getBoundingClientRect(), c = b.getBoundingClientRect(); return t.width > c.width - 4 || t.height > c.height - 4; };
      const ajustarTextos = () => fila.querySelectorAll('.cat').forEach(b => {
        b.classList.remove('cat--partir'); b.style.fontSize = '';
        const base = parseFloat(getComputedStyle(b).fontSize);
        Util.ajustarCaja(b, base, 9);
        if (desborda(b)) { b.classList.add('cat--partir'); Util.ajustarCaja(b, base, 9); }
      });
      window.addEventListener('resize', ajustarTextos);
      function marcar() {
        raiz.classList.toggle('cats--invita', !activa);
        raiz.classList.toggle('cats--una', !!activa); // con una abierta, las demás se ocultan (solo sus productos a la vista)
        if (avisada !== !!activa) { avisada = !!activa; App.Bus.emit('categorias:abierta', avisada); } // Destacados se oculta mientras tanto
        fila.querySelectorAll('.cat').forEach(b => { const on = b.dataset.categoria === activa; b.classList.toggle('activa', on); b.parentNode.classList.toggle('activa', on); b.setAttribute('aria-selected', String(on)); });
        // Vigila si la pieza abierta está en pantalla: si sale, el botón de volver flota abajo.
        vigia.disconnect(); piezaVisible = true;
        const abierta = activa && fila.querySelector('.cat-item.activa');
        if (abierta) { vigia.observe(abierta); volver.style.fontSize = ''; Util.ajustarCaja(volver, parseFloat(getComputedStyle(volver).fontSize), 9); } // el texto cabe en el mismo alto del título
        ponerFlota();
      }
      function cerrar() { clearTimeout(timer); activa = null; marcar(); grid.replaceChildren(); carta.classList.add('oculto'); }
      async function abrir(id) {
        if (activa === id) return; // la abierta es solo encabezado: un toque por error no saca al cliente (se sale con "Volver")
        activa = id; marcar();
        const pieza = fila.querySelector('.cat-item.activa');
        if (pieza) pieza.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); // si el cliente había bajado, vuelve a la categoría
        await pintarProductos(); reiniciar();
      }
      async function pintarProductos() {
        const lista = await Cat.productosDeCategoria(activa);
        grid.replaceChildren(...lista.map(p => Cat.tarjeta(p, Carrito.selector(p))));
        carta.classList.toggle('oculto', !lista.length);
      }
      async function render() {
        const conf = await Store.get(CONF, CONF_DEF);
        cierreMs = Math.min(SEG_MAX, Math.max(SEG_MIN, Number(conf.cierreSeg) || CONF_DEF.cierreSeg)) * 1000;
        volver.textContent = flota.textContent = conf.textoVolver || CONF_DEF.textoVolver;
        const cats = await Cat.categorias();
        const visibles = []; // las promociones se muestran en Destacados (no como categoría)
        for (const c of cats) if ((await Cat.productosDeCategoria(c.id)).length) visibles.push(c);
        raiz.classList.toggle('oculto', visibles.length === 0);
        if (!visibles.some(c => c.id === activa)) activa = null;
        fila.replaceChildren(volver, ...visibles.map((c, i) => {
          const btn = Util.el('button', { type: 'button', class: 'cat', role: 'tab', 'aria-selected': 'false', 'data-categoria': c.id,
            style: '--i:' + i, text: c.nombre, onclick: () => abrir(c.id) });
          // La manito 👇 solo va en Promos: es la categoría que debe llamar la atención.
          // Foto de la categoría debajo del círculo: misma pieza, mismo toque.
          const foto = Util.el('button', { type: 'button', class: 'cat__foto', tabindex: '-1', 'aria-hidden': 'true', onclick: () => abrir(c.id) },
            Util.el('span', { class: 'cat__inicial', text: (c.nombre.replace(/[^\p{L}\p{N}]/gu, '') || '?').charAt(0).toUpperCase() }));
          Cat.fotoCategoria(c.id).then(async f => {
            const u = f && await Media.url(f.imagenId);
            if (u) foto.replaceChildren(Util.el('img', { src: u, alt: '', loading: 'lazy', style: f.encuadre ? 'object-position:' + f.encuadre.x + '% ' + f.encuadre.y + '%' : null }));
          });
          return Util.el('div', { class: 'cat-item', style: '--i:' + i }, btn, foto);
        }));
        marcar();
        ajustarTextos();
        franja.ajustar();
        if (activa) await pintarProductos(); else cerrar();
      }
      await render();
      ['store:categorias', 'catalogo:cambio', 'store:' + CONF].forEach(ev => App.Bus.on(ev, render));
      setInterval(render, 60000); // Promos con "vaciar al final del día": el cambio de día se refleja sin recargar
    },

    async admin(cuerpo) {
      const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
      const aviso = (t, tipo) => Util.mensaje(msg, t, tipo);
      const lista = Util.el('div', { class: 'adm-lista' });
      const inNuevo = Util.el('input', { type: 'text', class: 'adm-input', maxlength: NOMBRE_MAX, placeholder: 'Ej: Bebidas calientes', id: 'adm-cat-nueva' });
      let fotoNueva = null;
      const prevNueva = Util.el('div', { class: 'adm-thumb', text: '📷' });
      const inFotoNueva = Util.el('input', { type: 'file', accept: 'image/*', class: 'oculto' });
      inFotoNueva.addEventListener('change', async () => {
        const file = inFotoNueva.files[0]; inFotoNueva.value = '';
        if (!file) return;
        try { fotoNueva = await Util.reducirImagen(file, 800, 0.82); prevNueva.replaceChildren(Util.el('img', { src: URL.createObjectURL(fotoNueva), alt: '' })); }
        catch (e) { aviso('⚠️ ' + e.message, 'error'); }
      });

      async function mutar(fn, ok) {
        try {
          const items = (await Cat.categorias()).slice();
          if (await fn(items) === false) return;
          await Cat.guardarCategorias(items);
          if (ok) aviso(ok, 'ok');
        } catch (e) { aviso('⚠️ ' + e.message, 'error'); }
      }

      // Foto de la categoría (va debajo del círculo en la carta). Opcional: sin ella se usa la del primer producto.
      function fotoAdmin(c) {
        const inArchivo = Util.el('input', { type: 'file', accept: 'image/*', class: 'oculto' });
        inArchivo.addEventListener('change', async () => {
          const file = inArchivo.files[0]; inArchivo.value = '';
          if (!file) return;
          try {
            const id = await Media.guardar(await Util.reducirImagen(file, 800, 0.82));
            let anterior = null;
            await mutar(items => { const x = items.find(k => k.id === c.id); anterior = x.imagenId || null; x.imagenId = id; x.encuadre = null; }, '✅ Foto de "' + c.nombre + '" guardada.');
            await Media.borrar(anterior);
          } catch (e) { aviso('⚠️ ' + e.message, 'error'); }
        });
        const acciones = [Util.el('button', { type: 'button', class: 'btn', text: '📷 ' + (c.imagenId ? 'Cambiar foto' : 'Subir foto'), onclick: () => inArchivo.click() })];
        if (c.imagenId) acciones.push(
          Util.el('button', { type: 'button', class: 'btn', text: '✋ Encuadre', onclick: async () => {
            const url = await Media.url(c.imagenId);
            if (url) Util.encuadre(url, c.encuadre, { aspecto: '100/110', nota: 'Arrastra la foto hasta que se vea lo importante. Así la verá el cliente debajo del círculo.' },
              (enc) => mutar(items => { items.find(k => k.id === c.id).encuadre = enc; }, '✅ Encuadre guardado.'));
          } }),
          Util.el('button', { type: 'button', class: 'btn btn--peligro', text: 'Quitar foto', onclick: async () => {
            if (!await Util.confirmar('¿Quitar la foto de "' + c.nombre + '"?', 'Se mostrará la del producto que va primero.', 'Quitar', 'Cancelar')) return;
            const id = c.imagenId;
            await mutar(items => { const x = items.find(k => k.id === c.id); delete x.imagenId; delete x.encuadre; }, 'Foto quitada.');
            await Media.borrar(id);
          } }));
        return Util.el('div', { class: 'adm-campo' },
          Util.el('div', { class: 'adm-prod' }, Cat.miniatura(c.imagenId, c.nombre),
            Util.el('p', { class: 'adm-nota', text: c.imagenId ? 'Foto de la categoría (va debajo del círculo).' : 'Sin foto propia: se muestra la del producto que va primero.' })),
          Util.el('div', { class: 'adm-acciones' }, acciones), inArchivo);
      }

      async function pintar() {
        const cats = await Cat.categorias(), prods = await Cat.productos();
        lista.replaceChildren(...cats.map((c, i) => {
          const n = prods.filter(p => p.categoriaId === c.id).length;
          const inNombre = Util.el('input', { type: 'text', class: 'adm-input', maxlength: NOMBRE_MAX, value: c.nombre, 'aria-label': 'Nombre de la categoría' });
          const mover = (dir) => mutar(items => { const k = items.findIndex(x => x.id === c.id), j = k + dir; if (j < 0 || j >= items.length) return false; [items[k], items[j]] = [items[j], items[k]]; }, '✅ Orden actualizado.');
          const swOrden = Util.el('input', { type: 'checkbox', checked: c.orden === 'manual',
            onchange: e => mutar(items => { items.find(x => x.id === c.id).orden = e.target.checked ? 'manual' : 'auto'; },
              e.target.checked ? '✅ Orden manual: ordena los productos con ↑ ↓.' : '✅ Orden automático por ventas.') });
          const zonaOrden = Util.el('div', { class: 'adm-lista' });
          if (c.orden === 'manual') Cat.ordenCategoria(c).then(orden => {
            const moverProd = (k, dir) => mutar(items => {
              const cat = items.find(x => x.id === c.id), ids = orden.map(p => p.id), j = k + dir;
              if (j < 0 || j >= ids.length) return false;
              [ids[k], ids[j]] = [ids[j], ids[k]]; cat.ordenIds = ids;
            }, '✅ Orden actualizado.');
            zonaOrden.replaceChildren(...orden.map((p, k) => Util.el('div', { class: 'adm-prod' },
              Util.el('span', { class: 'adm-prod__info adm-prod__nombre', text: (k + 1) + '. ' + p.nombre + (Cat.disponible(p) ? '' : ' (agotado)') }),
              Util.el('div', { class: 'adm-item__orden' },
                Util.el('button', { type: 'button', class: 'adm-mini', 'aria-label': 'Subir ' + p.nombre, text: '↑', disabled: k === 0, onclick: () => moverProd(k, -1) }),
                Util.el('button', { type: 'button', class: 'adm-mini', 'aria-label': 'Bajar ' + p.nombre, text: '↓', disabled: k === orden.length - 1, onclick: () => moverProd(k, 1) })))));
            if (!orden.length) zonaOrden.append(Util.el('p', { class: 'adm-nota', text: 'Esta categoría aún no tiene productos.' }));
          });
          return Util.el('div', { class: 'adm-item' },
            Util.el('div', { class: 'adm-item__cab' },
              Util.el('div', { class: 'adm-prod' },
                Util.el('div', { class: 'adm-prod__info' },
                  Util.el('span', { class: 'adm-item__num', text: 'Posición ' + (i + 1) }),
                  Util.el('span', { class: 'adm-prod__meta', text: n + (n === 1 ? ' producto' : ' productos') }))),
              Util.el('div', { class: 'adm-item__orden' },
                Util.el('button', { type: 'button', class: 'adm-mini', 'aria-label': 'Subir', text: '↑', disabled: i === 0, onclick: () => mover(-1) }),
                Util.el('button', { type: 'button', class: 'adm-mini', 'aria-label': 'Bajar', text: '↓', disabled: i === cats.length - 1, onclick: () => mover(1) }))),
            Util.el('div', { class: 'adm-fila' }, inNombre,
              Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar',
                onclick: () => mutar(items => {
                  const v = Util.limpiarTexto(inNombre.value, NOMBRE_MAX);
                  if (!v) { aviso('⚠️ Escribe el nombre.', 'error'); return false; }
                  if (items.some(x => x.id !== c.id && x.nombre.toLowerCase() === v.toLowerCase())) { aviso('⚠️ Ya existe una categoría con ese nombre.', 'error'); return false; }
                  items.find(x => x.id === c.id).nombre = v;
                }, '✅ Nombre guardado.') })),
            fotoAdmin(c),
            Util.el('label', { class: 'adm-switch' }, swOrden, Util.el('span', { text: 'Orden manual de productos' })),
            zonaOrden,
            Util.el('div', { class: 'adm-acciones' },
              Util.el('button', { type: 'button', class: 'btn btn--peligro', text: 'Eliminar',
                onclick: async () => {
                  if (n > 0) { aviso('⚠️ "' + c.nombre + '" tiene ' + n + (n === 1 ? ' producto' : ' productos') + '. Elimínalos o cámbialos de categoría primero.', 'error'); return; }
                  if (!await Util.confirmar('¿Eliminar la categoría "' + c.nombre + '"?', '', 'Eliminar', 'Cancelar')) return;
                  await mutar(items => { items.splice(items.findIndex(x => x.id === c.id), 1); }, 'Categoría eliminada.');
                  await Media.borrar(c.imagenId);
                } }))
          );
        }));
        if (!cats.length) lista.append(Util.el('p', { class: 'adm-nota', text: 'Aún no hay categorías. Crea la primera abajo.' }));
      }

      const conf = await Store.get(CONF, CONF_DEF);
      const inSeg = Util.el('input', { type: 'number', inputmode: 'numeric', class: 'adm-input', min: SEG_MIN, max: SEG_MAX, step: 1, value: conf.cierreSeg, id: 'adm-cat-cierre' });
      const inVolver = Util.el('input', { type: 'text', class: 'adm-input', maxlength: VOLVER_MAX, value: conf.textoVolver || CONF_DEF.textoVolver, id: 'adm-cat-volver' });
      // Orden: crear arriba (lo más usado), categorías creadas y, al final, el tiempo de cierre. (Las promociones viven en Destacados.)
      cuerpo.append(
        Util.el('div', { class: 'adm-campo' },
          Util.el('label', { class: 'adm-etq', for: 'adm-cat-nueva', text: '➕ Nueva categoría' }),
          Util.el('div', { class: 'adm-fila' }, inNuevo,
            Util.el('button', { type: 'button', class: 'btn btn--prim', text: '＋ Crear',
              onclick: async () => {
                const v = Util.limpiarTexto(inNuevo.value, NOMBRE_MAX);
                if (!v) { aviso('⚠️ Escribe el nombre de la categoría.', 'error'); return; }
                if (!fotoNueva) { aviso('⚠️ Sube la foto de la categoría.', 'error'); return; }
                const imagenId = await Media.guardar(fotoNueva);
                let creada = false;
                await mutar(items => {
                  if (items.some(x => x.nombre.toLowerCase() === v.toLowerCase())) { aviso('⚠️ Ya existe una categoría con ese nombre.', 'error'); return false; }
                  items.push({ id: 'c' + Date.now().toString(36), nombre: v, imagenId });
                  creada = true;
                }, '✅ Categoría creada.');
                if (!creada) { await Media.borrar(imagenId); return; }
                inNuevo.value = ''; fotoNueva = null; prevNueva.replaceChildren('📷');
              } })),
          // Foto de la nueva categoría (va debajo de su título en la carta).
          Util.el('div', { class: 'adm-prod' }, prevNueva,
            Util.el('button', { type: 'button', class: 'btn', text: '📷 Foto de la categoría', onclick: () => inFotoNueva.click() }), inFotoNueva)),
        msg,
        Util.el('span', { class: 'adm-etq', text: 'Categorías creadas' }), lista,
        Util.el('div', { class: 'adm-campo' },
          Util.el('label', { class: 'adm-etq', for: 'adm-cat-cierre', text: 'Cerrar categoría abierta tras (segundos sin uso)' }),
          Util.el('div', { class: 'adm-fila' }, inSeg,
            Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar',
              onclick: async () => {
                const v = parseInt(inSeg.value, 10);
                if (!(v >= SEG_MIN && v <= SEG_MAX)) { aviso('⚠️ Escribe un valor entre ' + SEG_MIN + ' y ' + SEG_MAX + ' segundos.', 'error'); return; }
                await Store.set(CONF, Object.assign({}, await Store.get(CONF, CONF_DEF), { cierreSeg: v })); inSeg.value = v; aviso('✅ Tiempo de cierre guardado.', 'ok');
              } })),
          Util.el('p', { class: 'adm-nota', text: 'Entre ' + SEG_MIN + ' y ' + SEG_MAX + ' segundos. Cada toque o desplazamiento reinicia la cuenta.' })),
        Util.el('div', { class: 'adm-campo' },
          Util.el('label', { class: 'adm-etq', for: 'adm-cat-volver', text: 'Texto del botón para volver' }),
          Util.el('div', { class: 'adm-fila' }, inVolver,
            Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar',
              onclick: async () => {
                const v = Util.limpiarTexto(inVolver.value, VOLVER_MAX) || CONF_DEF.textoVolver;
                await Store.set(CONF, Object.assign({}, await Store.get(CONF, CONF_DEF), { textoVolver: v })); inVolver.value = v; aviso('✅ Texto del botón guardado.', 'ok');
              } })),
          Util.el('p', { class: 'adm-nota', text: 'Sale al lado de la categoría abierta. Vacío = "' + CONF_DEF.textoVolver + '".' })));
      await pintar();
      Util.escuchar(cuerpo, ['store:categorias', 'catalogo:cambio'], pintar);
    }
  });
})();
</script>

<!-- =====================================================================

<script id="js-productos">
(function () {
  'use strict';
  const { Util, Media } = App;
  const Cat = App.servicio('catalogo');
  const NOMBRE_MAX = 40, DETALLE_MAX = 120, MIN_DEF = 3;

  App.modulo({
    id: 'productos',
    letra: 'E',
    titulo: 'Productos creación + eliminar',

    async admin(cuerpo) {
      const msg = Util.el('p', { class: 'adm-msg', role: 'status' });
      const aviso = (t, tipo) => Util.mensaje(msg, t, tipo);
      const filtro = Util.el('select', { class: 'adm-input adm-select', 'aria-label': 'Filtrar por categoría', onchange: () => pintar() });
      const lista = Util.el('div', { class: 'adm-lista' });
      const btnNuevo = Util.el('button', { type: 'button', class: 'btn btn--prim', text: '＋ Nuevo producto', onclick: () => abrirFormulario(null) });
      const zonaNuevo = Util.el('div');
      let abierto = null, formActual = null; // producto en edición ('nuevo' para alta) y su formulario

      async function mutar(fn, ok) {
        try {
          const items = (await Cat.productos()).slice();
          if (await fn(items) === false) return false;
          await Cat.guardarProductos(items);
          if (ok) aviso(ok, 'ok');
          return true;
        } catch (e) { aviso('⚠️ ' + e.message, 'error'); return false; }
      }

      function campo(etq, input, nota) {
        return Util.el('div', { class: 'adm-campo' }, Util.el('label', { class: 'adm-etq', text: etq }), input, nota ? Util.el('p', { class: 'adm-nota', text: nota }) : null);
      }
      const numerico = (valor, ph) => Util.el('input', { type: 'text', inputmode: 'numeric', class: 'adm-input', value: valor ?? '', placeholder: ph || '',
        oninput: e => { e.target.value = e.target.value.replace(/\D/g, ''); } });

      async function abrirFormulario(p) {
        if (abierto) { cerrarFormulario(); await pintar(); }
        const cats = await Cat.categorias();
        if (!cats.length) { aviso('⚠️ Primero crea al menos una categoría (bloque Categorías).', 'error'); return; }
        if (p) p = (await Cat.productos()).find(x => x.id === p.id) || p; // datos vigentes (ventas o movimientos de M)
        abierto = p ? p.id : 'nuevo';
        let imagenNueva = null, quitarImagen = false, encuadre = p ? p.encuadre || null : null;
        const prev = Cat.miniatura(p && p.imagenId, p && p.nombre);
        const inArchivo = Util.el('input', { type: 'file', accept: 'image/*', class: 'oculto' });
        const inNombre = Util.el('input', { type: 'text', class: 'adm-input', maxlength: NOMBRE_MAX, value: p ? p.nombre : '', placeholder: 'Ej: Jugo de mango' });
        const inDetalle = Util.el('input', { type: 'text', class: 'adm-input', maxlength: DETALLE_MAX, value: p ? p.detalle : '', placeholder: 'Ej: Natural en agua' });
        const inValor = numerico(p && p.valor, 'Ej: 7900');
        const inCosto = numerico(p && p.costo, 'Opcional');
        const inStock = numerico(p ? p.stock : '', 'Unidades disponibles');
        const inMin = numerico(p ? p.stockMin : MIN_DEF);
        const selCat = Util.el('select', { class: 'adm-input adm-select' },
          Util.el('option', { value: '', text: '— Elige categoría —' }),
          cats.map(c => Util.el('option', { value: c.id, text: c.nombre, selected: p ? p.categoriaId === c.id : filtro.value === c.id })));

        inArchivo.addEventListener('change', async () => {
          const file = inArchivo.files[0]; inArchivo.value = '';
          if (!file) return;
          try {
            imagenNueva = await Util.reducirImagen(file, 800, 0.82); quitarImagen = false; encuadre = null; // foto nueva: encuadre al centro
            prev.replaceChildren(Util.el('img', { src: URL.createObjectURL(imagenNueva), alt: '' }));
          } catch (e) { aviso('⚠️ ' + e.message, 'error'); }
        });

        async function guardar() {
          const datos = {
            nombre: Util.limpiarTexto(inNombre.value, NOMBRE_MAX),
            detalle: Util.limpiarTexto(inDetalle.value, DETALLE_MAX),
            valor: Util.entero(inValor.value), costo: Util.entero(inCosto.value),
            stock: Util.entero(inStock.value), stockMin: Util.entero(inMin.value),
            categoriaId: selCat.value,
            encuadre: quitarImagen ? null : encuadre
          };
          if (!datos.nombre) return aviso('⚠️ Escribe el nombre del producto.', 'error');
          if (!datos.valor) return aviso('⚠️ Escribe el valor (mayor a 0).', 'error');
          if (!datos.categoriaId) return aviso('⚠️ Elige la categoría.', 'error');
          if (datos.stock === null) return aviso('⚠️ Escribe las unidades de inventario (puede ser 0).', 'error');
          if (datos.stockMin === null) datos.stockMin = MIN_DEF;
          let anterior = null, nuevoId = null, ajuste = null;
          if (imagenNueva) nuevoId = await Media.guardar(imagenNueva);
          const ok = await mutar(items => {
            let prod = p ? items.find(x => x.id === p.id) : null;
            if (p && !prod) throw new Error('El producto ya no existe.');
            if (!prod) { prod = { id: 'p' + Date.now().toString(36), imagenId: null, creado: Date.now() }; items.push(prod); }
            if (nuevoId || quitarImagen) { anterior = prod.imagenId; prod.imagenId = nuevoId; }
            const antes = p ? (parseInt(prod.stock, 10) || 0) : null;
            // Costo y unidades sin tocar en el formulario no pisan lo que cambió mientras estaba abierto.
            if (p && datos.costo === Util.entero(p.costo)) delete datos.costo;
            if (p && datos.stock === Util.entero(p.stock)) datos.stock = prod.stock;
            Object.assign(prod, datos);
            ajuste = { prod, antes, despues: datos.stock };
          }, p ? '✅ Producto actualizado.' : '✅ Producto creado.');
          // Todo cambio de inventario hecho a mano queda en el kardex (M. Inventario).
          const Inv = App.servicio('inventario');
          if (ok && Inv && ajuste) await Inv.ajuste(ajuste.prod, ajuste.antes, ajuste.despues);
          if (ok) { await Media.borrar(anterior); cerrarFormulario(); await pintar(); }
          else if (nuevoId) await Media.borrar(nuevoId);
        }

        const form = Util.el('div', { class: 'adm-item', 'data-form': abierto },
          Util.el('span', { class: 'adm-item__num', text: p ? 'Editar producto' : 'Nuevo producto' }),
          Util.el('div', { class: 'adm-prod' }, prev,
            Util.el('div', { class: 'adm-acciones', style: 'flex:1' },
              Util.el('button', { type: 'button', class: 'btn', text: 'Subir imagen', onclick: () => inArchivo.click() }),
              Util.el('button', { type: 'button', class: 'btn btn--peligro', text: 'Quitar',
                onclick: () => { imagenNueva = null; quitarImagen = true; encuadre = null; prev.replaceChildren((inNombre.value || '?').charAt(0).toUpperCase()); } }),
              Util.el('button', { type: 'button', class: 'btn', text: '✋ Ajustar encuadre', onclick: async () => {
                const url = imagenNueva ? URL.createObjectURL(imagenNueva) : (!quitarImagen && p ? await Media.url(p.imagenId) : null);
                if (!url) { aviso('⚠️ Primero sube una imagen.', 'error'); return; }
                Util.encuadre(url, encuadre, { aspecto: '1/1', nota: 'Arrastra la foto hasta que se vea lo importante. Así la verá el cliente en la tarjeta; al tocarla, la verá completa.' },
                  (e) => { encuadre = e; aviso('✋ Encuadre listo. Toca Guardar para aplicarlo.', 'ok'); });
              } }))),
          inArchivo,
          campo('Nombre *', inNombre),
          campo('Detalle', inDetalle),
          campo('Categoría *', selCat),
          Util.el('div', { class: 'adm-grid2' }, campo('Valor (venta) *', inValor), campo('Costo', inCosto)),
          Util.el('div', { class: 'adm-grid2' }, campo('Inventario *', inStock), campo('Alerta en', inMin)),
          Util.el('p', { class: 'adm-nota', text: 'Con inventario en 0 el producto no se muestra en la carta. "Alerta en": unidades para avisar que se está agotando.' }),
          Util.el('div', { class: 'adm-acciones' },
            Util.el('button', { type: 'button', class: 'btn', text: 'Cancelar', onclick: () => { cerrarFormulario(); pintar(); } }),
            Util.el('button', { type: 'button', class: 'btn btn--prim', text: 'Guardar', onclick: guardar })),
          p ? Util.el('button', { type: 'button', class: 'btn btn--peligro', text: 'Eliminar producto',
            onclick: async () => {
              if (!await Util.confirmar('¿Eliminar "' + p.nombre + '"?', 'Se borra con su imagen. No se puede deshacer.', 'Eliminar', 'Cancelar')) return;
              const ok = await mutar(items => { const k = items.findIndex(x => x.id === p.id); if (k < 0) return false; items.splice(k, 1); }, 'Producto eliminado.');
              if (ok) {
                await Media.borrar(p.imagenId);
                cerrarFormulario(); await pintar();
              }
            } }) : null
        );
        const fila = p ? lista.querySelector('[data-id="' + p.id + '"]') : null;
        if (fila) fila.replaceWith(form); else zonaNuevo.replaceChildren(form);
        formActual = form;
        form.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }

      function cerrarFormulario() { abierto = null; if (formActual) formActual.remove(); formActual = null; }

      async function pintar() {
        if (abierto) return; // no borrar lo que el dueño está escribiendo
        const cats = await Cat.categorias(), prods = await Cat.productos();
        const nombreCat = Object.fromEntries(cats.map(c => [c.id, c.nombre]));
        const valorFiltro = cats.some(c => c.id === filtro.value) ? filtro.value : '';
        filtro.replaceChildren(Util.el('option', { value: '', text: 'Todas las categorías (' + prods.length + ')' }),
          ...cats.map(c => Util.el('option', { value: c.id, text: c.nombre + ' (' + prods.filter(p => p.categoriaId === c.id).length + ')', selected: c.id === valorFiltro })));
        const visibles = prods.filter(p => !valorFiltro || p.categoriaId === valorFiltro);
        lista.replaceChildren(...visibles.map(p => {
          const fila = Util.el('div', { class: 'adm-item', 'data-id': p.id });
          const bajo = (parseInt(p.stock, 10) || 0) <= (parseInt(p.stockMin, 10) || 0);
          fila.append(Util.el('div', { class: 'adm-prod' },
            Cat.miniatura(p.imagenId, p.nombre),
            Util.el('div', { class: 'adm-prod__info' },
              Util.el('span', { class: 'adm-prod__nombre', text: p.nombre }),
              Util.el('span', { class: 'adm-prod__meta', text: (nombreCat[p.categoriaId] || 'Sin categoría') + ' · ' + Util.precio(p.valor) }),
              Util.el('span', { class: 'adm-prod__meta' + (bajo ? ' adm-prod__meta--alerta' : ''), text: 'Inventario: ' + (p.stock || 0) + (bajo ? (p.stock > 0 ? ' · por agotarse' : ' · agotado') : '') })),
            Util.el('button', { type: 'button', class: 'btn', text: 'Editar', onclick: () => abrirFormulario(p) })));
          return fila;
        }));
        if (!visibles.length) lista.append(Util.el('p', { class: 'adm-nota', text: cats.length ? 'No hay productos aquí todavía.' : 'Primero crea categorías (bloque Categorías).' }));
      }

      cuerpo.append(filtro, msg, lista, zonaNuevo, btnNuevo);
      await pintar();
      Util.escuchar(cuerpo, ['store:categorias'], pintar);
    }
  });
})();
</script>

<script id="js-qr">
(function () {
  'use strict';
  const ECC_CW = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  const BLOQUES = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  const modulosDatos = (v) => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const a = Math.floor(v / 7) + 2; r -= (25 * a - 10) * a - 55; if (v >= 7) r -= 36; } return r; };
  const cwDatos = (v) => Math.floor(modulosDatos(v) / 8) - ECC_CW[v] * BLOQUES[v];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; };
  function divisor(grado) {
    const r = new Array(grado).fill(0); r[grado - 1] = 1; let raiz = 1;
    for (let i = 0; i < grado; i++) { for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], raiz); if (j + 1 < r.length) r[j] ^= r[j + 1]; } raiz = mul(raiz, 2); }
    return r;
  }
  function residuo(datos, div) {
    const r = div.map(() => 0);
    for (const b of datos) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); }
    return r;
  }

  function matriz(texto) {
    const datos = Array.from(new TextEncoder().encode(texto));
    let ver = 1;
    for (; ver <= 10; ver++) if (4 + (ver <= 9 ? 8 : 16) + datos.length * 8 <= cwDatos(ver) * 8) break;
    if (ver > 10) throw new Error('El texto es demasiado largo para el QR.');
    // Flujo de bits
    const bits = []; const poner = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    poner(4, 4); poner(datos.length, ver <= 9 ? 8 : 16); datos.forEach(b => poner(b, 8));
    const cap = cwDatos(ver) * 8;
    poner(0, Math.min(4, cap - bits.length)); poner(0, (8 - bits.length % 8) % 8);
    for (let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) poner(pad, 8);

    // Bloques con corrección de errores (Reed-Solomon) e intercalado

    const div = divisor(ecc), bloques = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = cw.slice(k, k + largoCorto - ecc + (i < cortos ? 0 : 1)); k += dat.length;
      const e = residuo(dat, div); if (i < cortos) dat.push(0); bloques.push(dat.concat(e));
    }

    for (let i = 0; i < bloques[0].length; i++) bloques.forEach((b, j) => { if (i !== largoCorto - ecc || j >= cortos) final.push(b[i]); });
    // Matriz y patrones fijos
    const n = ver * 4 + 17;
    const m = Array.from({ length: n }, () => new Array(n).fill(false));
    const fija = Array.from({ length: n }, () => new Array(n).fill(false));
    const set = (x, y, v) => { m[y][x] = v; fija[y][x] = true; };
    for (let i = 0; i < n; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const buscador = (x, y) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy; if (xx >= 0 && xx < n && yy >= 0 && yy < n) set(xx, yy, d !== 2 && d !== 4); } };
    buscador(3, 3); buscador(n - 4, 3); buscador(3, n - 4);
    const al = [];
    if (ver > 1) { const na = Math.floor(ver / 7) + 2, paso = Math.ceil((ver * 4 + 4) / (na * 2 - 2)) * 2; for (let p = ver * 4 + 10; al.length < na - 1; p -= paso) al.unshift(p); al.unshift(6); }
    al.forEach((ax, i) => al.forEach((ay, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === al.length - 1) || (i === al.length - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
    const formato = (mascara) => {
      const d = mascara; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412, bit = (i) => ((b >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(n - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) set(8, n - 15 + i, bit(i));
      set(8, n - 8, true);
    };
    formato(0);
    if (ver >= 7) {
      let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = (ver << 12) | r;

    }
    // Máscara con menor penalización
    const MASC = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const aplicar = (k) => { for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!fija[y][x] && MASC[k](x, y)) m[y][x] = !m[y][x]; };
    const PATRON = [true, false, true, true, true, false, true, false, false, false, false];
    const penal = () => {
      let p = 0, oscuros = 0;
      for (const fila of [0, 1]) for (let a = 0; a < n; a++) {
        const get = (b) => fila ? m[a][b] : m[b][a];
        let run = 1;
        for (let b = 1; b < n; b++) { if (get(b) === get(b - 1)) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; }
        for (let b = 0; b + 11 <= n; b++) {
          if (PATRON.every((v, k) => get(b + k) === v) || PATRON.every((v, k) => get(b + 10 - k) === v)) p += 40;
        }
      }
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        if (m[y][x]) oscuros++;
        if (x < n - 1 && y < n - 1 && m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) p += 3;
      }

    };
    let mejor = 0, minimo = Infinity;
    for (let k = 0; k < 8; k++) { aplicar(k); formato(k); const p = penal(); if (p < minimo) { minimo = p; mejor = k; } aplicar(k); }
    aplicar(mejor); formato(mejor);
    return m;
  }

  // SVG nítido para pantalla e impresión (margen de 4 módulos, como pide el estándar).
  function svg(texto) {
    const m = matriz(texto), n = m.length, ns = 'http://www.w3.org/2000/svg', borde = 4;

  }

  App.servicio('qr', { matriz, svg });
})();
</script>
